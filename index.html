/* ---- Échéances ---- */
function vueEcheances(){
  const j = jourISO(), l = datees().filter(passeSphere);
  const seau = t => { const n = ecartJours(j, t.date_due); return n < 0 ? 0 : n <= 30 ? 1 : n <= 90 ? 2 : 3; };
  const noms = ["En retard","30 jours","90 jours","Plus tard"];
  const h = [`<div class="entete-mob"><h1 class="titre">Échéances</h1><div class="jour">${dateCourte(j)}</div></div>`,
    `<p class="sous">Toutes les tâches qui ont une date. Elle remonte dans l'inbox au préavis, et se reconduit toute seule si elle est récurrente.</p>`,
    `<div style="margin-bottom:6px"><button class="btn" data-act="nouvelleEcheance">Nouvelle échéance</button></div>`];
  if(!l.length) return h.join("") + vide("Aucune échéance", "Contrôle technique, mutuelle, assurance… ajoutez la première.");
  for(let s = 0; s < 4; s++){
    const g = l.filter(t => seau(t) === s);
    if(g.length) h.push(groupe(noms[s], g.length, enFiche(g.map(t => ligneTache(t, { veille:true })))));
  }
  return h.join("");
}


/* ---- Agenda ----
   Semaines entières : la page démarre au lundi de la semaine du 1er et finit
   au dimanche de la semaine du dernier jour. Aucune semaine n'est coupée,
   les jours débordants apparaissent en gris. */
const LETTRES = ["D","L","M","M","J","V","S"];
function grilleMois(annee, mois){
  const premier = new Date(annee, mois, 1);
  const debut = new Date(premier);
  debut.setDate(debut.getDate() - ((premier.getDay() + 6) % 7));
  const dernier = new Date(annee, mois + 1, 0);
  const fin = new Date(dernier);
  fin.setDate(fin.getDate() + (7 - ((dernier.getDay() + 6) % 7) - 1));
  const jours = [];
  for(let d = new Date(debut); d <= fin; d.setDate(d.getDate() + 1)) jours.push(jourISO(d));
  return jours;
}

function vueAgenda(){
  const j = jourISO();
  if(!vue.moisAgenda) vue.moisAgenda = j.slice(0,7);
  const [an, mo] = vue.moisAgenda.split("-").map(Number);
  const jours = grilleMois(an, mo - 1);
  const h = [`<div class="entete-mob"><h1 class="titre">${MOIS[mo-1]} ${an}</h1><div class="jour">${dateCourte(j)}</div></div>`];

  const navMois = `<div class="nav-mois">
    <button class="btn mini creux" data-mois="-1">←</button>
    <button class="btn mini creux" data-mois="0">Aujourd'hui</button>
    <button class="btn mini creux" data-mois="1">→</button>
    <button class="btn mini" data-act="nouveauRdv">+ Rendez-vous</button></div>`;
  h.push(navMois);

  const lignes = [];
  let semaine = -1;
  jours.forEach((iso, i) => {
    const d = versDate(iso), dow = d.getDay();
    const horsMois = +iso.slice(5,7) !== mo;
    const we = dow === 0 || dow === 6;
    const ferie = ferieDe(iso), vac = vacanceDe(iso), auj = iso === j;
    if(i % 7 === 0 && i > 0) lignes.push(`<div class="sep-sem"></div>`);

    const marques = [];
    anniDu(iso).forEach(a => marques.push(
      `<span class="anniv">${a.icone === "coeur" ? "❤️" : "🎂"} ${ech(a.nom)}</span>`));
    if(ferie) marques.push(`<span class="ferie">${ech(ferie)}</span>`);

    const bloc = cote => rdvDu(iso).filter(r => (r.cote || "perso") === cote).map(r =>
      `<div class="rdv" data-rdv="${r.id}" data-rdvjour="${iso}" data-act="editerRdv" title="Modifier">
         <span class="${r.couleur ? "surl surl-" + r.couleur : ""}">${
           (r.duree || 1) > 1 ? `<i class="jalon">${rangRdv(r, iso)}/${r.duree}</i> ` : ""
         }${r.heure && rangRdv(r, iso) === 1 ? `<b>${ech(r.heure)}</b> ` : ""}${ech(r.intitule)}${
           r.repete ? ` <i class="jalon">↻</i>` : ""}${r.notes ? ` <i class="jalon">✎</i>` : ""}</span>
         <button class="ico sup" data-act="jeter" title="Supprimer">✕</button></div>`).join("");

    const taches = cote => cote === "perso" ? tachesDu(iso).map(t =>
      `<div class="rdv tache" data-tache="${t.id}">◷ ${ech(t.intitule)}</div>`).join("") : "";

    lignes.push(`<div class="jour-l ${we?"we":""} ${horsMois?"hors":""} ${auj?"auj":""} ${vac?"envac":""}"
      data-jourdate="${iso}"${vac?` title="Vacances ${ech(vac)}"`:""}>
      <div class="date-c">
        <span class="lettre">${LETTRES[dow]}</span>
        <span class="num">${d.getDate()}</span>
        <button class="plus" data-act="rdvJour" title="Ajouter un rendez-vous">+</button>
      </div>
      <div class="col perso">${bloc("perso")}${taches("perso")}${marques.length?`<div class="marques">${marques.join("")}</div>`:""}</div>
      <div class="col pro">${bloc("pro")}</div>
    </div>`);
  });

  h.push(`<div class="fiche agenda">
    <div class="entete-cols"><span></span><span>Perso</span><span>Pro</span></div>
    ${lignes.join("")}</div>`);
  /* Les mêmes flèches en bas : après avoir parcouru le mois, on ne veut pas
     remonter en haut pour passer au suivant. */
  h.push(`<div style="margin-top:14px">${navMois}</div>`);
  h.push(`<p class="petit-detail" style="text-align:center;margin:2px 0 0">
    Sur téléphone, balayez l'écran vers la gauche ou la droite pour changer de mois.</p>`);
  return h.join("");
}

/* ---- Budget ---- */
function vueBudget(){
  const b = bilan(vue.decalage), j = jourISO();
  const nomPeriode = nomDeLaPeriode(vue.decalage);
  const h = [`<div class="entete-mob"><h1 class="titre">Budget</h1><div class="jour">${dateCourte(j)}</div></div>`];

  /* ---------- 1. Le mois consulté ---------- */
  h.push(`<div class="barre-mois ${b.courante ? "" : "ailleurs"}">
    <button class="btn mini creux" data-periode="-1">←</button>
    <div class="titre-mois">
      <span class="nom">${nomPeriode}</span>
      <span class="plage">${dateMoyenne(b.deb)} → ${dateMoyenne(b.fin)}${
        b.courante ? "" : (vue.decalage < 0 ? " · mois passé" : " · mois à venir")}</span>
    </div>
    <button class="btn mini creux" data-periode="1">→</button>
    ${vue.decalage !== 0 ? `<button class="btn mini creux" data-periode="0">Revenir au mois en cours</button>` : ""}
  </div>`);

  /* ---------- 2. Ce qu'il reste ---------- */
  if(!b.revenus && !b.charges && !db.depenses.length){
    h.push(vide("Le budget est vide",
      "Commencez par renseigner vos revenus dans Réglages. Vos factures et abonnements se saisissent dans les dossiers du Suivi."));
  }else{
    const pc = b.disponible > 0 ? Math.min(100, (b.depense / b.disponible) * 100) : (b.depense > 0 ? 100 : 0);
    const aPrel = resteAPrelever(b.deb, b.fin);
    const details = [`${euro(b.depense,0)} dépensés ${b.courante ? "ce mois-ci" : "sur " + nomPeriode}`];
    if(b.sortiePonctuelle > 0)
      details.push(`${euro(b.sortiePonctuelle,0)} de facture annuelle retirés en plus`);
    if(aPrel > 0 && b.courante)
      details.push(`${euro(aPrel,0)} encore à prélever, déjà retirés`);

    h.push(`<div class="compteur">
      <div class="etiq">${b.courante ? "Il reste" : "Il resterait sur " + nomPeriode}</div>
      <div class="grand ${b.reste<0?"neg":""}">${euro(b.reste,0).replace(" €",'<span class="u"> €</span>')}</div>
      <div class="parjour">${b.courante
        ? `pour finir le mois, soit <b>${euro(b.reste / b.encore, 0)}</b> par jour pendant ${b.encore} jours`
        : `sur la période close · ${b.total} jours`}</div>
      <div class="jauge"><i class="${b.depense>b.disponible?"trop":""}" style="width:${pc}%"></i></div>
      <div class="petit-detail">${details.join(" · ")}</div>
    </div>`);

    h.push(`<div class="bilan">
      <div><div class="e">Ce qu'il y avait au départ</div><div class="v">${euroCourt(b.disponible)}</div></div>
      <div><div class="e">Factures et abonnements</div><div class="v moins">${euroCourt(b.charges)}</div></div>
      <div><div class="e">Dépenses du quotidien</div><div class="v moins">${euroCourt(b.depense)}</div></div>
      ${b.sortiePonctuelle > 0
        ? `<div><div class="e">Facture annuelle du mois</div><div class="v moins">${euroCourt(b.sortiePonctuelle)}</div></div>`
        : ""}
    </div>`);

    h.push(`<button class="aide-q" data-act="voirExplication">${
      vue.voirExplication ? "Masquer l'explication" : "Comment ce calcul fonctionne ?"}</button>`);
    if(vue.voirExplication)
      h.push(`<p class="explique">
        « Ce qu'il y avait au départ », ce sont vos revenus une fois les factures et abonnements retirés.
        Vos dépenses du quotidien viennent s'y soustraire au fil du mois : ce qu'il reste est le montant ci-dessus.
        ${b.sortiePonctuelle > 0
          ? `Ce mois-ci, une facture annuelle est en plus retirée en entier : elle est donc comptée deux fois,
             une fois lissée et une fois en totalité. C'est une marge de sécurité volontaire, modifiable dans Réglages.`
          : ""}</p>`);
  }

  /* ---------- 3. Saisir une dépense ---------- */
  h.push(`<div class="oeil">Ajouter une dépense</div>`);
  h.push(`<div class="saisie">
    <input id="dep-montant" class="court" inputmode="decimal" placeholder="0,00" autocomplete="off" enterkeyhint="done">
    <input id="dep-libelle" placeholder="Libellé (facultatif)" autocomplete="off" enterkeyhint="done">
    <button class="btn" data-act="ajouterDepense">Ajouter</button></div>`);
  h.push(`<div class="filtres">${db.categories_depense.map(c =>
    `<button class="filtre ${vue.catDep===c.id?"on":""}" data-cdep="${c.id}">${ech(c.nom)}</button>`).join("")}</div>`);

  /* ---------- 4. Ce que l'on attend ---------- */
  if(b.attente.length){
    const age = ecartJours(b.attente[0].date, j);
    h.push(`<div class="oeil">En attente de remboursement<span class="a-droite">${euro(b.avances,0)} avancés</span></div>`);
    h.push(`<p class="petit-detail" style="margin:0 0 8px">
      ${b.attente.length} dépense${b.attente.length>1?"s":""} · la plus ancienne remonte à ${age} jour${age>1?"s":""}.</p>`);
    h.push(enFiche(b.attente.map(x => { const c = cdepDe(x.categorie_id); return `<div class="ligne" data-depense="${x.id}">
      <div class="cases"><button class="case carre" data-act="rembourser"
        title="J'ai été remboursé" aria-label="Encaisser le remboursement">${CHECK}</button></div>
      <div class="corps"><div class="intitule">${ech(x.libelle) || (c ? ech(c.nom) : "Dépense")}</div>
        <div class="meta"><span class="puce date">avancé le ${dateCourte(x.date)}</span>
          ${c && x.libelle ? `<span class="puce">${ech(c.nom)}</span>` : ""}</div></div>
      <div class="somme">${euro(x.montant,2)}</div>
      <div class="outils"><button class="ico" data-act="marquerRemb" title="Retirer de l'attente">⟲</button></div></div>`; })));
  }

  const rentrees = [...(db.rentrees||[])].sort((a,c) =>
    (a.recu?1:0) - (c.recu?1:0) || (a.date||"9").localeCompare(c.date||"9"));
  h.push(`<div class="oeil">Rentrées ponctuelles${b.attendues ? `<span class="a-droite">${euro(b.attendues,0)} à venir</span>` : ""}</div>`);
  h.push(rentrees.length ? enFiche(rentrees.map(r => `<div class="ligne" data-rentree="${r.id}">
      <div class="cases"><button class="case carre ${r.recu?"coche":""}" data-act="encaisser"
        title="${r.recu?"Encaissé":"Marquer comme encaissé"}" aria-label="Encaisser">${CHECK}</button></div>
      <div class="corps"><div class="intitule">${ech(r.libelle)}</div>
        <div class="meta">${r.recu
          ? `<span class="puce date">encaissé le ${dateCourte(r.date)}</span>`
          : `<span class="puce ctx">${r.date ? "prévu le " + dateCourte(r.date) : "à venir"}</span>`}</div></div>
      <div class="somme">${r.montant == null ? "?" : euro(r.montant,2)}</div>
      <div class="outils"><button class="ico" data-act="editer">✎</button>
        <button class="ico sup" data-act="jeter">✕</button></div></div>`))
    : vide("Aucune rentrée", "Remboursement, prime, vente… date et montant facultatifs."));
  h.push(`<div style="margin:9px 0 14px"><button class="btn mini creux" data-act="nouvelleRentree">Ajouter une rentrée</button></div>`);

  /* ---------- 5. Les dépenses saisies ---------- */
  /* Les factures annuelles qui tombent ce mois-ci figurent parmi les
     dépenses : ce jour-là, l'argent quitte réellement le compte, et le
     réglage « compter deux fois » les retire effectivement du reste. */
  /* Une facture qui tombe ce mois-ci se voit toujours : qu'elle soit
     comptée en plus ou seulement lissée est une affaire de calcul, pas
     une raison de la cacher. */
  const ponctuelsDuMois = b.ponctuels;
  const comptes = compterPrelevements();
  const parJour = {};
  b.dep.forEach(x => (parJour[x.date] = parJour[x.date] || []).push({ genre:"dep", x }));
  ponctuelsDuMois.forEach(p => (parJour[p.date] = parJour[p.date] || []).push({ genre:"prel", p }));
  const jours = Object.keys(parJour).sort().reverse();
  const totalMois = b.depense + (comptes ? b.sortiePonctuelle : 0);
  /* Le renvoi vers les mois à venir ne doit pas disparaître dès qu'une
     dépense est saisie : c'est justement là qu'on cherche où tombe la
     prochaine facture annuelle. */
  const aVenirMois = moisAvecMouvement()
    .filter(n => n > 0 && n !== vue.decalage)
    .sort((a,z) => a - z)
    .slice(0, 6);
  h.push(`<div class="oeil">Dépenses ${b.courante ? "" : "de " + nomPeriode}
    ${jours.length?`<span class="cpt">${euro(totalMois,2)}</span>`:""}</div>`);
  if(ponctuelsDuMois.length){
    const somme = ponctuelsDuMois.reduce((s,p) => s + (p.l.montant || 0), 0);
    const liste = ponctuelsDuMois.map(p => `${ech(p.l.libelle)} le ${versDate(p.date).getDate()}`).join(" · ");
    h.push(`<p class="petit-detail" style="margin:0 0 8px">${comptes
      ? `Dont ${euro(somme,2)} de facture annuelle prélevée ${b.courante ? "ce mois-ci" : "sur " + nomPeriode} : ${liste}.`
      : `${euro(somme,2)} de facture annuelle sont aussi prélevés ${b.courante ? "ce mois-ci" : "sur " + nomPeriode} — ${liste} —
         mais déjà comptés de façon lissée, ils ne s'ajoutent pas au total.`}</p>`);
  }
  if(!jours.length){
    /* On ne propose que les mois à venir : une facture annuelle a autant
       d'occurrences passées que futures, et les remonter n'aide en rien. */
    const ailleurs = aVenirMois;
    h.push(vide(b.courante ? "Aucune dépense ce mois-ci" : `Aucune dépense en ${nomPeriode}`,
      ailleurs.length
        ? `À venir sur d'autres mois : ${ailleurs.map(n =>
            `<button class="lien-mois" data-saut="${n}" title="${dateMoyenne(debutPeriode(n))} → ${dateMoyenne(finPeriode(debutPeriode(n)))}">${nomDeLaPeriode(n)}</button>`
          ).join(" · ")}`
        : "La première saisie se fait en deux gestes : un montant, une catégorie."));
  }
  else h.push(jours.map(d => {
    const l = parJour[d];
    const s = l.reduce((t,e) => t + (e.genre === "dep" ? e.x.montant : e.p.l.montant), 0);
    return `<div class="oeil" style="margin:14px 0 6px">${d===j?"Aujourd'hui":dateLongue(d)}<span class="a-droite">${euro(s,2)}</span></div>
    ${enFiche(l.map(e => {
      if(e.genre === "prel"){
        const { l:lg, d:dos } = e.p;
        return `<div class="ligne" data-dossier="${dos.id}">
          <div class="corps"><div class="intitule">${ech(lg.libelle)}</div>
            <div class="meta"><span class="puce doss">${ech(dos.nom)}</span>
              <span class="puce ctx">prélèvement ${ech(lg.periodicite)}</span>
              ${comptes ? "" : `<span class="puce">déjà lissé</span>`}</div></div>
          <div class="somme"${comptes ? "" : ` style="color:var(--encre-3)"`}>${euro(lg.montant,2)}</div>
          <div class="outils"><button class="ico" data-act="ouvrir" title="Ouvrir le dossier">↗</button></div></div>`;
      }
      const x = e.x, c = cdepDe(x.categorie_id);
      return `<div class="ligne" data-depense="${x.id}">
      <div class="corps"><div class="intitule">${ech(x.libelle) || (c ? ech(c.nom) : "Dépense")}</div>
        <div class="meta">${c && x.libelle ? `<span class="puce">${ech(c.nom)}</span>` : ""}
          ${x.rembourser && !x.rembourse ? `<span class="puce ctx">à rembourser</span>` : ""}
          ${x.rembourse ? `<span class="puce">remboursé</span>` : ""}</div></div>
      <div class="somme">${euro(x.montant,2)}</div>
      <div class="outils">
        <button class="ico ${x.rembourser?"actif":""}" data-act="marquerRemb"
          title="${x.rembourser?"Ne plus attendre de remboursement":"À se faire rembourser"}">⟲</button>
        <button class="ico" data-act="editer">✎</button>
        <button class="ico sup" data-act="jeter">✕</button></div></div>`;
    }))}`;
  }).join(""));

  if(jours.length && aVenirMois.length)
    h.push(`<p class="petit-detail" style="margin:10px 0 0">À venir sur d'autres mois : ${
      aVenirMois.map(n => `<button class="lien-mois" data-saut="${n}"
        title="${dateMoyenne(debutPeriode(n))} → ${dateMoyenne(finPeriode(debutPeriode(n)))}">${nomDeLaPeriode(n)}</button>`
      ).join(" · ")}</p>`);

  if(b.dep.length){
    const tot = {};
    b.dep.forEach(x => tot[x.categorie_id || "?"] = (tot[x.categorie_id || "?"] || 0) + x.montant);
    const lignes = Object.entries(tot).sort((a,c) => c[1] - a[1]);
    const max = lignes[0][1];
    h.push(`<div class="oeil">Répartition</div><div class="fiche" style="padding:6px 0">
      ${lignes.map(([id,v]) => `<div class="barre-cat">
        <span class="nom">${ech(cdepDe(id)?.nom || "Sans catégorie")}</span>
        <span class="tige"><i style="width:${(v/max)*100}%"></i></span>
        <span class="v">${euro(v,0)}</span></div>`).join("")}</div>`);
  }

  /* ---------- 6. Factures et abonnements : une seule liste ---------- */
  const factures = toutesLignes().map(({ l, d }) => {
    const p = PERIODES[l.periodicite];
    const dates = datesPrelevement(l, b.deb, b.fin);
    return { l, d, mensuelle: p === 1, dates,
             tombe: dates.length > 0,
             quand: dates[0] || null,
             reel: p === 1 ? l.montant : l.montant * dates.length,
             lisse: parMois(l) };
  }).sort((a,c) =>
    (c.tombe?1:0) - (a.tombe?1:0)
    || (a.quand || "9").localeCompare(c.quand || "9")
    || (a.l.jour || 99) - (c.l.jour || 99)
    || c.lisse - a.lisse);

  const sansMois = factures.filter(x => !x.mensuelle && !x.l.mois);
  const totalReel = factures.reduce((s,x) => s + x.reel, 0);

  const encoreDu = resteAPrelever(b.deb, b.fin);
  h.push(`<div class="oeil">Factures et abonnements<span class="a-droite">${euro(totalCharges(),2)} / mois</span></div>`);
  if(b.courante)
    h.push(`<p class="petit-detail" style="margin:0 0 8px">${
      encoreDu > 0
        ? `Reste ${euro(encoreDu,2)} à prélever d'ici le ${dateMoyenne(b.fin)}.`
        : "Tout est prélevé pour ce mois-ci."}</p>`);

  if(sansMois.length)
    h.push(`<div class="bandeau alerte" style="margin:0 0 10px"><div class="g">
      ${sansMois.length === 1 ? "Une facture n'a pas de mois de prélèvement" : sansMois.length + " factures n'ont pas de mois de prélèvement"} :
      ${sansMois.map(x => ech(x.l.libelle)).join(" · ")}. Tant qu'il manque, aucun mois ne les voit tomber.
      </div><button class="btn mini creux" data-dossier="${sansMois[0].d.id}" data-act="ouvrir">Corriger</button></div>`);

  if(!factures.length)
    h.push(vide("Aucune facture enregistrée",
      "Loyer, mutuelle, abonnements : ouvrez le dossier concerné dans Suivi et ajoutez-le dans « Charges »."));
  else{
    h.push(enFiche(factures.map(({ l, d, mensuelle, tombe, quand, reel, lisse }) => {
      const passe = quand && quand < j;
      const jourAffiche = quand ? String(versDate(quand).getDate()).padStart(2,"0")
                                : (l.jour ? String(l.jour).padStart(2,"0") : "—");
      const meta = [`<span class="puce doss">${ech(d.nom)}</span>`,
                    `<span class="puce">${ech(l.periodicite)}</span>`];
      if(!mensuelle){
        if(tombe) meta.push(`<span class="puce ctx">${euro(l.montant,0)} le ${dateMoyenne(quand)}</span>`);
        else if(l.mois) meta.push(`<span class="puce">${euro(l.montant,0)} le ${l.jour} ${MOIS[l.mois-1]}</span>`);
        else meta.push(`<span class="puce chaud">mois à préciser</span>`);
      }
      if(quand) meta.push(`<span class="puce">${passe ? "prélevé" : "à venir"}</span>`);
      return `<div class="ligne" data-dossier="${d.id}">
        <div class="jour-prel ${passe || !quand ? "passe" : ""}">${jourAffiche}</div>
        <div class="corps">
          <button class="nom" data-act="ouvrir" style="background:none;border:0;padding:0;text-align:left;font-weight:540">${ech(l.libelle)}</button>
          <div class="meta">${meta.join("")}</div></div>
        <div class="somme">${reel > 0 ? euro(reel,2) : `<span style="color:var(--encre-3)">${euro(lisse,2)}</span>`}</div>
      </div>`;
    })));
    h.push(`<p class="petit-detail" style="margin:8px 0 0">
      ${euro(totalReel,2)} partent réellement du compte ${b.courante ? "ce mois-ci" : "sur " + nomPeriode} ;
      ${euro(totalCharges(),2)} sont comptés chaque mois dans le calcul.
      Les montants en gris sont des parts lissées, ceux en noir des prélèvements du mois.</p>`);
  }

  if(!totalRevenus())
    h.push(`<div class="bandeau" style="margin:22px 0 0"><div class="g">Aucun revenu saisi : sans lui, le calcul n'a pas de sens. Il se renseigne dans Réglages.</div>
      <button class="btn mini creux" data-aller="reglages">Réglages</button></div>`);

  h.push(`<button class="fab" data-act="depenseRapide" title="Nouvelle dépense" aria-label="Nouvelle dépense">+</button>`);
  return h.join("");
}

/* ---- Suivi ---- */
function vueSuivi(){
  if(vue.dossier) return vueDossier();
  const h = [`<div class="entete-mob"><h1 class="titre">Suivi</h1><div class="jour">${dateCourte(jourISO())}</div></div>`,
    `<p class="sous">Un dossier par sujet : le van, la mutuelle, l'assurance. Notes, tâches et échéances au même endroit.</p>`,
    `<div style="margin-bottom:16px"><button class="btn" data-act="nouveauDossier">Nouveau dossier</button></div>`];
  if(!db.dossiers.length) return h.join("") + vide("Aucun dossier", "Commencez par le sujet qui vous occupe le plus.");
  const tri = [...db.dossiers].sort((a,b) =>
    (catDe(a.categorie_id)?.nom||"zz").localeCompare(catDe(b.categorie_id)?.nom||"zz") || a.nom.localeCompare(b.nom));
  const info = d => {
    const p = prochaineDe(d.id);
    /* Le compte doit correspondre à ce que la fiche montrera réellement,
       sinon on annonce 21 tâches et on en affiche zéro. */
    const n = duDossier(d.id).filter(passeSphere).length;
    return { p, n, c:catDe(d.categorie_id),
      lien: d.url ? `<a class="lien" href="${ech(d.url)}" target="_blank" rel="noopener">Ouvrir ↗</a>` : `<span style="color:var(--encre-3)">—</span>`,
      cout: parMoisDossier(d) ? `${euro(parMoisDossier(d),2)} / mois` : "—" };
  };
  h.push(`<div class="fiche"><table class="tab"><thead><tr>
    <th>Dossier</th><th>Catégorie</th><th>Accès</th><th>Identifiant</th><th>N° contrat</th><th>Coût</th><th>Prochaine</th><th>Tâches</th><th></th>
    </tr></thead><tbody>${tri.map(d => { const x = info(d); return `<tr data-dossier="${d.id}">
      <td><button class="nom" data-act="ouvrir">${ech(d.nom)}</button>
        ${d.notes ? `<span class="note-min">${ech(d.notes.split("\n")[0])}</span>` : ""}</td>
      <td>${x.c ? ech(x.c.nom) : "—"}</td><td>${x.lien}</td>
      <td class="num">${ech(d.identifiant) || "—"}</td><td class="num">${ech(d.contrat) || "—"}</td>
      <td class="num">${x.cout}</td><td class="num">${x.p ? dateCourte(x.p) : "—"}</td>
      <td class="num">${x.n || "—"}</td>
      <td><span class="outils" style="opacity:1">
        <button class="ico" data-act="editer" title="Modifier">✎</button>
        <button class="ico sup" data-act="jeter" title="Corbeille">✕</button></span></td>
    </tr>`; }).join("")}</tbody></table></div>`);
  h.push(`<div class="fiche liste cartes">${tri.map(d => { const x = info(d); return `<div class="ligne" data-dossier="${d.id}">
    <div class="corps"><button class="nom" data-act="ouvrir" style="font-weight:580;background:none;border:0;padding:0;text-align:left">${ech(d.nom)}</button>
      <div class="meta">${x.c ? `<span class="puce">${ech(x.c.nom)}</span>` : ""}
        ${x.n ? `<span class="puce">${x.n} tâche${x.n>1?"s":""}</span>` : ""}
        ${parMoisDossier(d) ? `<span class="puce date">${x.cout}</span>` : ""}
        ${x.p ? `<span class="puce date">${dateCourte(x.p)}</span>` : ""}</div>
      ${d.notes ? `<span class="note-min">${ech(d.notes.split("\n")[0])}</span>` : ""}</div>
    <div class="outils"><button class="ico" data-act="editer">✎</button><button class="ico sup" data-act="jeter">✕</button></div>
  </div>`; }).join("")}</div>`);

  /* Récapitulatif mensuel par catégorie */
  const parCat = {};
  toutesLignes().forEach(({ l, d }) => {
    const k = d.categorie_id || "?";
    parCat[k] = (parCat[k] || 0) + parMois(l);
  });
  const rangs = Object.entries(parCat).sort((a,c) => c[1] - a[1]);
  if(rangs.length){
    const total = rangs.reduce((s,[,v]) => s + v, 0), max = rangs[0][1];
    h.push(`<div class="oeil">Charges par catégorie<span class="a-droite">${euro(total,2)} / mois</span></div>
      <div class="fiche" style="padding:6px 0">${rangs.map(([id,v]) => `<div class="barre-cat">
        <span class="nom">${ech(catDe(id)?.nom || "Sans catégorie")}</span>
        <span class="tige"><i style="width:${(v/max)*100}%"></i></span>
        <span class="v">${euro(v,0)}</span></div>`).join("")}</div>
      <p style="margin:9px 0 0;font-size:12.5px;color:var(--encre-3)">
        Montants lissés au mois : une charge annuelle compte pour un douzième.</p>`);
  }
  return h.join("");
}

function vueDossier(){
  const d = dossDe(vue.dossier);
  if(!d){ vue.dossier = null; return vueSuivi(); }
  const c = catDe(d.categorie_id);
  const tousDuDossier = db.taches.filter(t => t.dossier_id === d.id);
  const toutes = tousDuDossier.filter(passeSphere);
  const masquees = tousDuDossier.length - toutes.length;
  const ech_ = toutes.filter(t => t.statut !== "done" && t.date_due).sort((a,b) => a.date_due.localeCompare(b.date_due));
  const todo = toutes.filter(t => t.statut !== "done" && !t.date_due);
  const fait = toutes.filter(t => t.statut === "done").sort((a,b) => (b.fait_le||"").localeCompare(a.fait_le||""));
  const meta = [];
  if(c) meta.push(`<span class="puce">${ech(c.nom)}</span>`);
  if(d.identifiant) meta.push(`<span class="puce">id ${ech(d.identifiant)}</span>`);
  if(d.contrat) meta.push(`<span class="puce">n° ${ech(d.contrat)}</span>`);
  if(parMoisDossier(d)) meta.push(`<span class="puce date">${euro(parMoisDossier(d),2)} par mois</span>`);
  if(d.url) meta.push(`<a class="lien" href="${ech(d.url)}" target="_blank" rel="noopener">Ouvrir le site ↗</a>`);

  const h = [`<button class="retour" data-act="fermerDossier">← Suivi</button>`,
    `<div class="entete-d"><h1 class="titre">${ech(d.nom)}</h1>
      <button class="btn mini creux" data-dossier="${d.id}" data-act="editer">Modifier la fiche</button></div>`,
    meta.length ? `<div class="meta" style="margin:0 0 22px">${meta.join("")}</div>` : `<div style="height:16px"></div>`];

  const lgs = lignesDe(d);
  if(masquees) h.push(`<button class="filet-rappel doux" data-sphere="${sphere()==="travail"?"perso":"travail"}"
      style="margin:0 0 14px">${masquees} tâche${masquees>1?"s":""} ${sphere()==="travail"?"perso":"de travail"}
      ${masquees>1?"sont masquées":"est masquée"} — passer en ${sphere()==="travail"?"perso":"travail"}</button>`);

  h.push(`<div class="oeil">Charges${lgs.length?` <span class="cpt">${euro(parMoisDossier(d),2)} / mois</span>`:""}</div>`);
  h.push(lgs.length ? enFiche(lgs.map(l => `<div class="ligne" data-charge="${l.id}" data-dossier="${d.id}">
      <div class="jour-prel">${l.jour ? String(l.jour).padStart(2,"0") : "—"}</div>
      <div class="corps"><div class="intitule">${ech(l.libelle)}</div>
        <div class="meta"><span class="puce">${ech(l.periodicite)}</span>
          ${PERIODES[l.periodicite] > 1 ? `<span class="puce date">${euro(l.montant,2)}${
            l.mois ? ` · le ${l.jour} ${MOIS[l.mois-1]}` : ""}</span>` : ""}
          ${PERIODES[l.periodicite] > 1 && !l.mois ? `<span class="puce chaud">mois à préciser</span>` : ""}</div></div>
      <div class="somme">${euro(parMois(l),2)}</div>
      <div class="outils"><button class="ico" data-act="editerCharge">✎</button>
        <button class="ico sup" data-act="jeterCharge">✕</button></div></div>`))
    : vide("Aucune charge", "Un dossier « Assurances » peut porter plusieurs lignes : auto, van, habitation."));
  h.push(`<div style="margin:9px 0 0"><button class="btn mini creux" data-act="nouvelleCharge" data-dossier="${d.id}">Ajouter une charge</button></div>`);

  h.push(`<div class="oeil">Échéances${ech_.length?` <span class="cpt">${ech_.length}</span>`:""}</div>`);
  h.push(ech_.length ? enFiche(ech_.map(t => ligneTache(t, { sansDossier:true, veille:true })))
    : vide("Aucune échéance", "Contrôle technique, renouvellement, révision…"));

  h.push(`<div class="oeil">À faire${todo.length?` <span class="cpt">${todo.length}</span>`:""}</div>`);
  /* Les mêmes filtres de contexte que dans l'onglet Tâches : dans un gros
     dossier, savoir ce qui se fait au téléphone ou dehors change tout. */
  const ctxPresents = db.contextes.filter(c => todo.some(t => t.contexte_id === c.id));
  if(ctxPresents.length > 1){
    h.push(`<div class="filtres">
      <button class="filtre ${!vue.filtreCtxDoss?"on":""}" data-fctxdoss="">Tout <span class="n">${todo.length}</span></button>
      ${ctxPresents.map(c => `<button class="filtre ${vue.filtreCtxDoss===c.id?"on":""}" data-fctxdoss="${c.id}">${ech(c.nom)}
        <span class="n">${todo.filter(t => t.contexte_id === c.id).length}</span></button>`).join("")}
    </div>`);
  }
  h.push(`<div class="saisie" style="margin-top:0">
    <input id="saisieDoss" data-dossier="${d.id}" placeholder="Ajouter au dossier…" autocomplete="off" enterkeyhint="done">
    <button class="btn" data-act="ajouterDoss" data-dossier="${d.id}">Ajouter</button></div>`);
  const todoVus = todo.filter(t => !vue.filtreCtxDoss || t.contexte_id === vue.filtreCtxDoss);
  h.push(todoVus.length ? enFiche(todoVus.map(t => ligneTache(t, { sansDossier:true })))
    : vide(todo.length ? "Rien dans ce contexte" : "Liste vide",
           todo.length ? "Choisissez « Tout » pour revoir l'ensemble." : "La flèche ↑ remonte une tâche dans l'inbox."));

  if(fait.length){
    const jj = jourISO();
    const duJour = fait.filter(t => t.fait_le === jj);
    h.push(`<div class="oeil" style="cursor:pointer" data-act="basculerFaites">Historique <span class="cpt">${fait.length}</span> ${vue.voirFaites?"−":"+"}</div>`);
    /* Ce qui vient d'être réglé reste visible sans avoir à déplier :
       une tâche cochée ne doit jamais sembler s'être volatilisée. */
    if(vue.voirFaites) h.push(enFiche(fait.slice(0,40).map(t => ligneTache(t, { sansDossier:true, reglee:true }))));
    else if(duJour.length) h.push(enFiche(duJour.map(t => ligneTache(t, { sansDossier:true, reglee:true }))));
  }

  /* Les notes ferment la fiche : c'est la zone la plus libre, elle a donc
     besoin de place, et rien ne doit être repoussé au-delà. */
  h.push(`<div class="oeil">Notes</div>
    <div class="bloc-notes grand"><textarea id="notesDoss" data-dossier="${d.id}"
      placeholder="">${ech(d.notes)}</textarea></div>`);
  return h.join("");
}

/* ---- Réglages ---- */
function vueReglages(){
  const j = jourISO();
  const listeMod = (titre, items, genre) => `<div class="bloc">
    <div class="oeil">${titre}</div>
    <div class="fiche liste">${items.map(x => `<div class="ligne" data-${genre}="${x.id}">
      <div class="corps"><div class="intitule">${ech(x.nom)}</div>
      ${x.alias?.length ? `<div class="meta"><span class="repousse">@${x.alias.join(" · @")}</span></div>` : ""}</div>
      <div class="outils"><button class="ico" data-act="editer">✎</button></div></div>`).join("")}</div>
    <div style="margin-top:9px"><button class="btn mini creux" data-act="ajouter-${genre}">Ajouter</button></div></div>`;

  const c = Sync.lireCfg(), es = Sync.lireEtat();
  const motEtat = { off:"inactive", attente:"modifications en attente", occupe:"en cours…",
                    ok:"à jour", conflit:"deux versions différentes", erreur:"erreur" }[es.statut] || "";
  const blocSync = `<div class="bloc"><div class="oeil">Synchronisation
      <span class="a-droite">${Sync.estActif() ? motEtat : "inactive"}</span></div>
    <div class="fiche" style="padding:14px">
      ${Sync.estActif() ? `
        <p style="margin:0 0 10px;font-size:13.5px;color:var(--encre-2)">
          Dépôt <b>${ech(c.owner)}/${ech(c.repo)}</b>, fichier <b>${ech(c.chemin)}</b> sur <b>${ech(c.branche)}</b>.
          Chaque modification part en commit quelques secondes après votre dernière saisie.</p>
        ${es.message ? `<p style="margin:0 0 10px;font-size:12.5px;color:var(--rouge)">${ech(es.message)}</p>` : ""}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn mini" data-act="syncMaintenant">Synchroniser maintenant</button>
          <button class="btn mini danger" data-act="syncDeconnecter">Déconnecter</button></div>`
      : `
        <p style="margin:0 0 12px;font-size:13.5px;color:var(--encre-2)">
          Le carnet devient un fichier JSON dans un dépôt privé. Tous vos appareils lisent et écrivent le même fichier,
          et chaque écriture est un commit — donc un historique complet et un retour en arrière possible.</p>
        <div class="duo">
          <label class="champ"><span>Propriétaire</span><input id="gh-owner" placeholder="votre-pseudo" autocomplete="off"></label>
          <label class="champ"><span>Dépôt</span><input id="gh-repo" placeholder="carnet" autocomplete="off"></label>
        </div>
        <div class="duo">
          <label class="champ"><span>Chemin du fichier</span><input id="gh-chemin" value="carnet.json" autocomplete="off"></label>
          <label class="champ"><span>Branche</span><input id="gh-branche" value="main" autocomplete="off"></label>
        </div>
        <label class="champ"><span>Jeton d'accès</span>
          <input id="gh-jeton" type="password" placeholder="github_pat_…" autocomplete="off"></label>
        <button class="btn" data-act="syncConnecter">Connecter</button>
        <p style="margin:12px 0 0;font-size:12.5px;color:var(--encre-3)">
          Créez un jeton <b>fine-grained</b> limité à ce seul dépôt, avec l'autorisation <b>Contents : Read and write</b>.

let dernierEcran = { onglet:null, dossier:null, mois:null, decalage:null, sphere:null };

function rendre(){
  figerSaisieEnCours();
  rendreNav();
  const cible = document.getElementById("vue");
  /* On ne remonte en haut que si l'on a changé d'écran. */
  const memeEcran = dernierEcran.onglet === vue.onglet && dernierEcran.dossier === vue.dossier
    && dernierEcran.mois === vue.moisAgenda && dernierEcran.decalage === vue.decalage
    && dernierEcran.sphere === sphere();
  const y = window.scrollY || window.pageYOffset || 0;
  dernierEcran = { onglet:vue.onglet, dossier:vue.dossier, mois:vue.moisAgenda,
                   decalage:vue.decalage, sphere:sphere() };
  const a = document.activeElement;
  const gardes = ["saisie","saisieDoss","notesDoss","dep-montant","dep-libelle"];
  const memo = a && gardes.includes(a.id) ? { id:a.id, val:a.value, pos:a.selectionStart } : null;

  cible.innerHTML = ({ accueil:vueAccueil, taches:vueTaches, echeances:vueEcheances, agenda:vueAgenda,
                       budget:vueBudget, suivi:vueSuivi, reglages:vueReglages })[vue.onglet]();

  if(memo){
    const e = document.getElementById(memo.id);
    if(e){ e.value = memo.val; e.focus(); try{ e.setSelectionRange(memo.pos, memo.pos); }catch(x){} }
  }else if(memeEcran){
    /* On reste au même endroit : cocher une tâche en bas de liste ne doit
       pas renvoyer en haut de page. */
    window.scrollTo({ top:y, behavior:"instant" });
  }else{
    window.scrollTo({ top:0, behavior:"instant" });
  }
  /* On amène l'écran sur l'élément qu'on vient de créer et on le fait
     clignoter une seconde : plus de doute sur « est-ce que c'est enregistré ». */
  if(vue.surligne){
    const n = document.querySelector(`[data-tache="${vue.surligne}"], [data-rdv="${vue.surligne}"],
      [data-rentree="${vue.surligne}"], [data-dossier="${vue.surligne}"], [data-depense="${vue.surligne}"]`);
    vue.surligne = null;
    if(n){
      n.classList.add("neuf");
      /* On ne défile que si l'élément est hors de vue : sinon le simple fait
         d'ajouter une tâche visible ferait bouger la page pour rien. */
      try{
        const r = n.getBoundingClientRect();
        if(r.top < 60 || r.bottom > (window.innerHeight || 800) - 60)
          n.scrollIntoView({ block:"center", behavior:"smooth" });
      }catch(e){}
      setTimeout(() => n.classList.remove("neuf"), 1600);
    }
  }
  rafraichirBadge();
}

const dlg = document.getElementById("dlg");
function formulaire(titre, champs, valeurs, onOk, onSup){
  const ligne = c => {
    const v = valeurs[c.cle] ?? c.defaut ?? "";
    if(c.type === "select")
      return `<label class="champ"><span>${c.nom}</span><select name="${c.cle}">
        ${c.options.map(o => `<option value="${ech(o.v)}" ${String(o.v)===String(v)?"selected":""}>${ech(o.n)}</option>`).join("")}</select></label>`;
    if(c.type === "textarea")
      return `<label class="champ"><span>${c.nom}</span><textarea name="${c.cle}" placeholder="${ech(c.ph||"")}">${ech(v)}</textarea></label>`;
    return `<label class="champ"><span>${c.nom}</span><input name="${c.cle}" type="${c.type||"text"}"
      ${c.step?`step="${c.step}"`:""} ${c.min!=null?`min="${c.min}"`:""} ${c.mode?`inputmode="${c.mode}"`:""}
      value="${ech(v)}" placeholder="${ech(c.ph||"")}"></label>`;
  };
  const corps = [];
  for(let i = 0; i < champs.length; i++){
    if(champs[i].duo && champs[i+1]){ corps.push(`<div class="duo">${ligne(champs[i])}${ligne(champs[i+1])}</div>`); i++; }
    else corps.push(ligne(champs[i]));
  }
  dlg.innerHTML = `<form method="dialog">
    <div class="dlg-t">${ech(titre)}</div>
    <div class="dlg-c">${corps.join("")}</div>
    <div class="dlg-p">
      ${onSup ? `<button type="button" class="btn mini danger esp" id="dlgSup">Supprimer</button>` : ""}
      <button type="button" class="btn mini creux" id="dlgNon">Annuler</button>
      <button type="submit" class="btn mini">Enregistrer</button>
    </div></form>`;
  const f = dlg.querySelector("form");
  f.onsubmit = ev => { ev.preventDefault();
    const d = {}; new FormData(f).forEach((v,k) => d[k] = typeof v === "string" ? v.trim() : v);
    dlg.close(); onOk(d); };
  dlg.querySelector("#dlgNon").onclick = () => dlg.close();
  if(onSup) dlg.querySelector("#dlgSup").onclick = () => { dlg.close(); onSup(); };
  /* Si une fenêtre est restée ouverte, showModal() échoue en silence et le
     formulaire ne paraît pas : il fallait alors s'y reprendre plusieurs fois. */
  try{ if(dlg.open) dlg.close(); dlg.showModal(); }
  catch(e){ try{ dlg.close(); dlg.showModal(); }catch(x){} }
  setTimeout(() => dlg.querySelector("input,select,textarea")?.focus(), 40);
}

/* Saisie de l'heure au clavier : « 9h30 », « 9:30 », « 930 », « 9h » → 09:30 */
function lireHeure(v){
  const t = String(v||"").trim().toLowerCase().replace(/\s/g,"");
  if(!t) return "";
  let m = t.match(/^(\d{1,2})[h:.,]?(\d{2})?$/);
  if(!m){ m = t.match(/^(\d{2})(\d{2})$/); if(m) m = [t, m[1], m[2]]; }
  if(!m) return null;
  const H = +m[1], M = m[2] ? +m[2] : 0;
  if(H > 23 || M > 59) return null;
  return String(H).padStart(2,"0") + ":" + String(M).padStart(2,"0");
}

function ajouterDepuis(champ, dossierId){
  const s = document.getElementById(champ);
  if(!s || !s.value.trim()) return;
  const a = analyser(s.value);
  if(!a.intitule) return;
  const nouvelle = tacheNeuve({
    intitule:a.intitule,
    contexte_id:a.ctxId || vue.filtreCtx || null,
    dossier_id:dossierId || a.dossId || vue.filtreDoss || null,
    date_due:a.date || null,
    suivant_le:a.suivant ? jourISO() : null,
    /* Depuis un dossier on ne bascule pas ; ailleurs, la boîte Travail décide,
       et le filtre en cours sert de repli. */
    travail: dossierId ? false : destinationTravail(),
  });

function tamponner(elt, texte, apres){
  const t = document.createElement("span");
  t.className = "tampon"; t.textContent = texte;
  elt.appendChild(t);
  setTimeout(apres, matchMedia("(prefers-reduced-motion: reduce)").matches ? 120 : 640);
}

function basculerFait(t, elt){
  if(t.statut === "done"){ t.statut = "inbox"; t.fait_le = null; return maj(); }
  const j = jourISO();
  if(t.n > 0 && t.date_due){
    (t.journal = t.journal || []).unshift(j);
    t.journal = t.journal.slice(0,12);
    let d = ajouterPeriode(t.date_due, t.n, t.unite), garde = 0;
    while(d <= j && garde++ < 300) d = ajouterPeriode(d, t.n, t.unite);
    t.date_due = d; t.suivant_le = null; t.reports = 0; t.en_inbox = false;
    sauver(); elt.classList.add("faite");
    return tamponner(elt, `Réglé · ${dateCourte(j)}`, rendre);
  }
  t.statut = "done"; t.fait_le = j; t.suivant_le = null;
  sauver(); elt.classList.add("faite");
  tamponner(elt, `Fait · ${dateCourte(j)}`, rendre);
}

function exporter(){
  db.reglages.dernier_export = jourISO();
  const paquet = { ...db, exporte_le:new Date().toISOString(), version_schema:VERSION_SCHEMA };
  const blob = new Blob([JSON.stringify(paquet, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `carnet-${jourISO()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  maj();
}

function importer(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const l = new FileReader();
    l.onload = () => {
      let d;
      try{ d = JSON.parse(l.result); }catch(e){ alert("Fichier illisible : ce n'est pas du JSON valide."); return; }
      if(!d || !Array.isArray(d.taches)){ alert("Fichier non reconnu : il ne contient pas de carnet."); return; }
      if((d.version_schema ?? 1) > VERSION_SCHEMA){
        alert(`Ce fichier vient d'une version plus récente (${d.version_schema}). Mettez d'abord l'application à jour.`); return;
      }
      const m = migrer(d);
      const n = (m.taches?.length||0) + (m.dossiers?.length||0) + (m.depenses?.length||0);
      if(!confirm(`Remplacer le carnet actuel par ce fichier (${n} éléments) ? L'état actuel sera perdu.`)) return;
      db = Object.assign(etatNeuf(), m);
      db.version_schema = VERSION_SCHEMA;
      db.taches = db.taches.map(t => tacheNeuve(t));
      bascule(); purgerCorbeille(); vue.dossier = null; maj();
    };
    l.readAsText(f);
  };
  inp.click();
}

const trouver = (c, attr) => { const e = c.closest(`[data-${attr}]`); return e ? { elt:e, id:e.getAttribute(`data-${attr}`) } : null; };

document.addEventListener("click", ev => {
  const c = ev.target;

  const bO = c.closest("[data-onglet]");
  if(bO){ vue.onglet = bO.dataset.onglet; if(vue.onglet !== "suivi") vue.dossier = null; return rendre(); }
  const bA = c.closest("[data-aller]");
  if(bA){ vue.onglet = bA.dataset.aller; return rendre(); }
  const bC = c.closest("[data-fctx]");
  if(bC){ vue.filtreCtx = bC.dataset.fctx || null; return rendre(); }
  const bD = c.closest("[data-fdoss]");
  if(bD){ vue.filtreDoss = bD.dataset.fdoss || null; return rendre(); }
  const bPr = c.closest("[data-prelev]");
  if(bPr){ db.reglages.compter_prelevements = bPr.dataset.prelev === "1"; return maj(); }
  const bArch = c.closest("[data-archiver]");
  if(bArch) return archiver(bArch.dataset.archiver);
  const bFD = c.closest("[data-fctxdoss]");
  if(bFD){ vue.filtreCtxDoss = bFD.dataset.fctxdoss || null; return rendre(); }
  const bH = c.closest("[data-hab]");
  if(bH){ basculerHabitude(bH.dataset.hab, bH.dataset.hjour); return maj(); }
  const bS = c.closest("[data-sphere]");
  if(bS){ db.reglages.sphere = bS.dataset.sphere; vue.saisieTravail = null; return maj(); }
  const bT = c.closest("[data-teinte]");
  if(bT){ db.reglages.accent = bT.dataset.teinte; appliquerTeinte(); return maj(); }
  const bCat = c.closest("[data-catdep]");
  if(bCat){
    vue.catDep = vue.catDep === bCat.dataset.catdep ? null : bCat.dataset.catdep;
    const z = document.getElementById("catsEclair");
    if(z && dlg.__chips) z.innerHTML = dlg.__chips();
    return;
  }
  const bK = c.closest("[data-cdep]");
  if(bK){ vue.catDep = vue.catDep === bK.dataset.cdep ? null : bK.dataset.cdep; return rendre(); }
  const bM = c.closest("[data-mois]");
  if(bM){ decalerMois(+bM.dataset.mois); return rendre(); }
  const bJ = c.closest("[data-saut]");
  if(bJ){ vue.decalage = +bJ.dataset.saut; return rendre(); }
  const bP = c.closest("[data-periode]");
  if(bP){ const v = +bP.dataset.periode;
    vue.decalage = v === 0 ? 0 : vue.decalage + v; return rendre(); }

  /* Traité avant le garde-fou ci-dessous : une ligne de résultat ne porte
     pas de data-act, elle serait sinon purement et simplement ignorée. */
  const lres0 = c.closest("[data-res]");
  if(lres0){
    const x = resultatsCourants[+lres0.dataset.res];
    if(x){ dlg.close(); x.aller(); return rendre(); }
    return;
  }

  const b = c.closest("[data-act]");
  if(!b){
    const lj = c.closest("[data-jourdate]");
    if(lj && vue.onglet === "agenda" && !c.closest("[data-rdv]") && !c.closest("[data-tache]"))
      return editerRdv(null, lj.dataset.jourdate);
    return;
  }
  const act = b.dataset.act;

  if(act === "ajouter") return ajouterDepuis("saisie", null);
  if(act === "ajouterDoss") return ajouterDepuis("saisieDoss", b.dataset.dossier);
  if(act === "ajouterDepense") return ajouterDepense();
  if(act === "exporter") return exporter();
  if(act === "importer") return importer();
  if(act === "syncMaintenant") return Sync.synchroniser(true);
  if(act === "syncDeconnecter"){
    if(!confirm("Déconnecter la synchronisation ? Le carnet reste sur cet appareil et le fichier reste sur GitHub.")) return;
    return Sync.deconnecter();
  }
  if(act === "syncConnecter"){
    const v = id => (document.getElementById(id)?.value || "").trim();
    const owner = v("gh-owner"), repo = v("gh-repo"), jeton = v("gh-jeton");
    if(!owner || !repo || !jeton){ alert("Propriétaire, dépôt et jeton sont nécessaires."); return; }
    Sync.connecter({ owner, repo, jeton,
      chemin: v("gh-chemin") || "carnet.json",
      branche: v("gh-branche") || "main" }).then(rendre);
    return;
  }
  if(act === "nouvelleEcheance") return editerTache(null, true);
  if(act === "nouveauDossier") return editerDossier(null);
  if(act === "nouveauRevenu") return editerRevenu(null);
  if(act === "nouvelleRentree") return editerRentree(null);
  if(act === "nouvelleCharge"){
    const d = dossDe(b.dataset.dossier); if(d) return editerCharge(d, null);
    return;
  }
  if(act === "nouveauRdv") return editerRdv(null, (vue.moisAgenda || jourISO().slice(0,7)) + "-01");
  if(act === "nouvelAnniversaire") return editerAnniversaire(null);
  if(act === "nouvellesVacances") return editerVacances(null);
  if(act === "nouvelleHabitude") return editerHabitude(null);
  if(act === "recherche") return ouvrirRecherche();
  if(act === "ajoutRapide") return ouvrirAjoutRapide();
  if(act === "depenseRapide") return ouvrirDepenseRapide();
  if(act === "saisiePerso"){ vue.saisieTravail = false; return rendre(); }
  if(act === "saisieTravail"){ vue.saisieTravail = true; return rendre(); }
  if(act === "eclairPerso" || act === "eclairTravail"){
    vue.eclairTravail = act === "eclairTravail";
    const z = document.getElementById("segEclair");
    if(z) z.innerHTML = `<button class="seg ${!vue.eclairTravail?"on":""}" data-act="eclairPerso">Perso</button>
      <button class="seg ${vue.eclairTravail?"on":""}" data-act="eclairTravail">Travail</button>`;
    return;
  }
  if(act === "viderCorbeille"){
    if(!confirm(`Vider la corbeille ? ${db.corbeille.length} élément(s) définitivement perdus.`)) return;
    db.corbeille = [];
    return maj();
  }
  if(act === "rdvJour"){
    const l = c.closest("[data-jourdate]");
    return editerRdv(null, l ? l.dataset.jourdate : jourISO());
  }
  if(act === "fermerDossier"){ vue.dossier = null; vue.voirFaites = false; return rendre(); }
  if(act === "ajouter-contexte") return editerListe("contexte", null);
  if(act === "ajouter-categorie") return editerListe("categorie", null);
  if(act === "ajouter-cdepense") return editerListe("cdepense", null);
  if(act === "basculerFaites"){ vue.voirFaites = !vue.voirFaites; return rendre(); }
  if(act === "voirArgent"){ vue.voirArgent = !vue.voirArgent; return rendre(); }
  if(act === "voirRevenus"){ vue.voirRevenus = !vue.voirRevenus; return rendre(); }
  if(act === "voirExplication"){ vue.voirExplication = !vue.voirExplication; return rendre(); }
  if(act === "toutReglees"){ vue.toutReglees = !vue.toutReglees; return rendre(); }
  if(act === "viderReglees"){
    const n = reglees().length;
    if(!n) return;
    if(!confirm(`Supprimer définitivement ${n} tâche${n>1?"s":""} réglée${n>1?"s":""} ? Elles ne passeront pas par la corbeille.`)) return;
    db.taches.filter(t => t.statut === "done").forEach(t => oublier(t.id));
    db.taches = db.taches.filter(t => t.statut !== "done");
    vue.toutReglees = false;
    return maj();
  }
  if(act === "viderExemples"){
    db.taches.filter(t => t.demo).forEach(t => oublier(t.id));
    db.dossiers.filter(d => d.demo).forEach(d => oublier(d.id));
    db.taches = db.taches.filter(t => !t.demo);
    db.dossiers = db.dossiers.filter(d => !d.demo);
    db.reglages.exemples = false; vue.dossier = null;
    return maj();
  }
  if(act === "toutEffacer"){
    if(!confirm("Effacer la totalité du carnet ? Cette action est définitive.")) return;
    if(!confirm("Dernière confirmation : tout sera perdu, y compris la corbeille.")) return;
    db = etatNeuf(); db.reglages.exemples = false;
    db.taches = []; db.dossiers = []; db.depenses = []; db.revenus = []; vue.dossier = null;
    return maj();
  }

  const lt = trouver(c, "tache");
  if(lt){
    const t = db.taches.find(x => x.id === lt.id); if(!t) return;
    if(act === "fait"){ touche(t); return basculerFait(t, lt.elt); }
    if(act === "suivant"){
      t.suivant_le = t.suivant_le ? null : jourISO();
      touche(t);
      if(!t.suivant_le) t.reports = 0;
      /* Cocher depuis un dossier remonte aussi la tâche dans l'inbox : sans
         cela, la décocher la renverrait aussitôt dans son dossier et elle
         semblerait disparaître de l'onglet Tâches. */
      else if(t.dossier_id) t.en_inbox = true;
      return maj();
    }
    if(act === "urgent"){ t.urgent = !t.urgent; touche(t); return maj(); }
    if(act === "rapatrier"){ t.en_inbox = true; touche(t); return maj(); }
    if(act === "renvoyer"){ t.en_inbox = false; t.suivant_le = null; touche(t); return maj(); }
    if(act === "remettre"){ t.statut = "inbox"; t.fait_le = null; if(t.dossier_id) t.en_inbox = true; touche(t); return maj(); }
    if(act === "supprimerDef"){
      if(!confirm(`Supprimer définitivement « ${t.intitule} » ? Elle ne passera pas par la corbeille.`)) return;
      oublier(t.id); db.taches = db.taches.filter(x => x.id !== t.id); return maj();
    }
    if(act === "editer") return editerTache(t);
    if(act === "jeter"){ jeter("tâche", t); db.taches = db.taches.filter(x => x.id !== t.id); return maj(); }
  }

  const lch = trouver(c, "charge");
  if(lch && (act === "editerCharge" || act === "jeterCharge")){
    const dd = dossDe(lch.elt.dataset.dossier);
    const l = dd && lignesDe(dd).find(y => y.id === lch.id);
    if(!l) return;
    if(act === "editerCharge") return editerCharge(dd, l);
    jeter("charge", { ...l, dossier_id:dd.id });
    dd.lignes = dd.lignes.filter(y => y.id !== l.id);
    return maj();
  }

  const lv = trouver(c, "rdv");
  if(lv){
    const r = (db.rendez_vous||[]).find(y => y.id === lv.id); if(!r) return;
    if(act === "jeter"){
      const jourVise = lv.elt.dataset.rdvjour || null;
      if(r.repete && jourVise){
        const debut = debutOccurrence(r, jourVise) || jourVise;
        return choisirPortee(r, debut);
      }
      jeter("rendez-vous", r); db.rendez_vous = db.rendez_vous.filter(y => y.id !== r.id); return maj();
    }
    if(act === "editerRdv") return editerRdv(r);
    return;
  }
  const lhab = trouver(c, "habitude");
  if(lhab && act === "editer"){
    const x = (db.habitudes||[]).find(y => y.id === lhab.id);
    if(x) return editerHabitude(x);
  }
  const lvac = trouver(c, "vac");
  if(lvac && act === "editer"){
    const v = (db.vacances||[]).find(y => y.id === lvac.id);
    if(v) return editerVacances(v);
  }
  const la = trouver(c, "anniv");
  if(la){
    const a = (db.anniversaires||[]).find(y => y.id === la.id);
    if(a && act === "editer") return editerAnniversaire(a);
  }

  const lx = trouver(c, "depense");
  if(lx){
    const x = db.depenses.find(y => y.id === lx.id); if(!x) return;
    if(act === "editer") return editerDepense(x);
    if(act === "marquerRemb"){
      x.rembourser = !x.rembourser;
      if(!x.rembourser) x.rembourse = false;
      touche(x);
      return maj();
    }
    if(act === "rembourser") return encaisserRemboursement(x);
    if(act === "jeter"){ jeter("dépense", x); db.depenses = db.depenses.filter(y => y.id !== x.id); return maj(); }
  }

  const lrt = trouver(c, "rentree");
  if(lrt){
    const r = (db.rentrees||[]).find(y => y.id === lrt.id); if(!r) return;
    if(act === "encaisser"){
      if(r.recu){ r.recu = false; touche(r); return maj(); }
      /* On ne peut encaisser sans savoir combien : si le montant était
         inconnu, c'est le moment de le renseigner. */
      if(r.montant == null) return encaisserRentree(r);
      r.recu = true;
      if(!r.date) r.date = jourISO();
      touche(r);
      return maj();
    }
    if(act === "editer") return editerRentree(r);
    if(act === "jeter"){ jeter("rentrée", r); db.rentrees = db.rentrees.filter(y => y.id !== r.id); return maj(); }
  }

  const lr = trouver(c, "revenu");
  if(lr){
    const r = db.revenus.find(y => y.id === lr.id); if(!r) return;
    if(act === "editer") return editerRevenu(r);
    if(act === "jeter"){ jeter("revenu", r); db.revenus = db.revenus.filter(y => y.id !== r.id); return maj(); }
  }

  const ld = trouver(c, "dossier");
  if(ld){
    const d = dossDe(ld.id); if(!d) return;
    if(act === "ouvrir"){ vue.onglet = "suivi"; vue.dossier = d.id; vue.voirFaites = false;
      vue.filtreCtxDoss = null; return rendre(); }
    if(act === "editer") return editerDossier(d);
    if(act === "jeter"){
      if(!confirm(`Mettre « ${d.nom} » à la corbeille ? Ses tâches seront détachées, pas supprimées.`)) return;
      jeter("dossier", d);
      db.dossiers = db.dossiers.filter(x => x.id !== d.id);
      db.taches.forEach(t => { if(t.dossier_id === d.id){ t.dossier_id = null; t.en_inbox = false; } });
      if(vue.dossier === d.id) vue.dossier = null;
      return maj();
    }
  }

  for(const genre of ["contexte","categorie","cdepense"]){
    const l = trouver(c, genre);
    if(l && act === "editer"){
      const tas = { contexte:"contextes", categorie:"categories", cdepense:"categories_depense" }[genre];
      const item = db[tas].find(x => x.id === l.id);
      if(item) return editerListe(genre, item);
    }
  }

  const lc = trouver(c, "corbeille");
  if(lc && act === "detruire"){
    db.corbeille = db.corbeille.filter(x => x.id !== lc.id);
    return maj();
  }
  if(lc && act === "restaurer"){
    const i = db.corbeille.findIndex(x => x.id === lc.id); if(i < 0) return;
    const x = db.corbeille[i];
    /* Une charge ne vit pas dans une collection à part : elle appartient
       aux lignes de son dossier. Sans ce cas particulier, la restaurer
       la faisait simplement disparaître. */
    if(x.genre === "charge"){
      const d = dossDe(x.obj.dossier_id);
      if(!d){ alert("Le dossier de cette charge n'existe plus."); return; }
      const { dossier_id, ...ligne } = x.obj;
      (d.lignes = d.lignes || []).push(ligne);
    }else{
      const cible = { "tâche":"taches", "dossier":"dossiers", "contexte":"contextes", "categorie":"categories",
                      "cdepense":"categories_depense", "dépense":"depenses", "revenu":"revenus",
                      "rendez-vous":"rendez_vous", "anniversaire":"anniversaires", "vacances":"vacances",
                      "rentrée":"rentrees", "habitude":"habitudes" }[x.genre];
      if(cible) db[cible].push(x.obj);
    }
    db.supprimes = (db.supprimes||[]).filter(y => y.id !== (x.obj && x.obj.id));
    db.corbeille.splice(i,1);
    return maj();
  }
});

document.addEventListener("keydown", ev => {
  const saisie = /^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName);
  if((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "k"){ ev.preventDefault(); return ouvrirRecherche(); }
  if(ev.key === "/" && !saisie){ ev.preventDefault(); return ouvrirRecherche(); }
  if(ev.key !== "Enter") return;
  if(ev.target.id === "saisie"){ ev.preventDefault(); ajouterDepuis("saisie", null); }
  if(ev.target.id === "saisieDoss"){ ev.preventDefault(); ajouterDepuis("saisieDoss", ev.target.dataset.dossier); }
  if(ev.target.id === "dep-montant" || ev.target.id === "dep-libelle"){ ev.preventDefault(); ajouterDepense(); }
});

document.addEventListener("input", ev => {
  Sync.noterGeste();
  if(ev.target.id === "notesDoss"){
    const d = dossDe(ev.target.dataset.dossier);
    if(d){ d.notes = ev.target.value; d.demo = false; touche(d); sauver(); }
  }
});

/* Filet de sécurité : avant tout redessin, on recopie dans les données ce
   qui est en cours de frappe dans une zone de texte. Sans cela, un rendu
   déclenché au mauvais moment pouvait ne garder qu'une partie de la phrase. */
function figerSaisieEnCours(){
  const z = document.getElementById("notesDoss");
  if(!z || !z.dataset) return;
  const d = dossDe(z.dataset.dossier);
  if(d && typeof z.value === "string" && d.notes !== z.value){
    d.notes = z.value; d.demo = false; touche(d); sauver();
  }
}
document.addEventListener("change", ev => {
  const a = ev.target.dataset?.act;
  if(a === "preavis"){ db.reglages.preavis_defaut = Math.max(0, Number(ev.target.value) || 0); sauver(); }
  if(a === "jourDebut"){ db.reglages.jour_debut_mois = Math.min(28, Math.max(1, Number(ev.target.value) || 1)); maj(); }
});

function decalerMois(v){
  if(v === 0){ vue.moisAgenda = jourISO().slice(0,7); return; }
  const [a,m] = (vue.moisAgenda || jourISO().slice(0,7)).split("-").map(Number);
  const d = new Date(a, m - 1 + v, 1);
  vue.moisAgenda = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

/* Balayage horizontal pour changer de mois dans l'agenda. On exige un geste
   franc et surtout plus horizontal que vertical, faute de quoi un simple
   défilement de la page ferait sauter d'un mois. */
let toucheDebut = null;
document.addEventListener("touchstart", ev => {
  if(vue.onglet !== "agenda" || ev.touches.length !== 1 || dlg.open){ toucheDebut = null; return; }
  const t = ev.touches[0];
  toucheDebut = { x:t.clientX, y:t.clientY, quand:Date.now() };
}, { passive:true });

document.addEventListener("touchend", ev => {
  if(!toucheDebut || vue.onglet !== "agenda") return;
  const t = ev.changedTouches[0];
  const dx = t.clientX - toucheDebut.x, dy = t.clientY - toucheDebut.y;
  const rapide = Date.now() - toucheDebut.quand < 700;
  toucheDebut = null;
  if(rapide && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8){
    decalerMois(dx < 0 ? 1 : -1);
    rendre();
  }
}, { passive:true });

function verifierJour(){
  const avant = db.reglages.dernier_bascule;
  bascule();
  if(avant !== db.reglages.dernier_bascule) maj();
}
document.addEventListener("visibilitychange", () => { if(!document.hidden){ verifierJour(); Sync.auRetour(); } });
window.addEventListener("online", () => Sync.auRetour());
setInterval(verifierJour, 60000);

/* =====================================================================
   10. DÉMARRAGE
   ===================================================================== */
(async function demarrer(){
  await Stockage.init();
  const sauve = await Stockage.lire();
  const m = migrer(sauve);
  const vierge = !(m && Array.isArray(m.taches));
  db = vierge ? etatNeuf() : Object.assign(etatNeuf(), m);
  /* Un appareil qui découvre l'appli affiche des exemples pour ne pas être
     vide. Tant qu'on n'y a rien saisi, ce carnet n'a aucune valeur : à la
     première synchro il s'efface devant la version distante au lieu de
     déverser ses exemples dans le carnet partagé. */
  db.vierge = vierge;
  db.version_schema = VERSION_SCHEMA;
  db.corbeille = db.corbeille || [];
  db.dossiers = db.dossiers || [];
  db.revenus = db.revenus || [];
  db.depenses = db.depenses || [];
  db.rendez_vous = db.rendez_vous || [];
  db.rentrees = db.rentrees || [];
  db.habitudes = db.habitudes || [];
  db.habitudes_faites = db.habitudes_faites || [];
  db.dossiers.forEach(d => { d.lignes = d.lignes || []; });
  db.vacances = (db.vacances && db.vacances.length) ? db.vacances : vacancesNeuves();
  db.anniversaires = (db.anniversaires && db.anniversaires.length) ? db.anniversaires : anniversairesNeufs();
  db.categories_depense = db.categories_depense?.length ? db.categories_depense : etatNeuf().categories_depense;
  db.taches = db.taches.map(t => tacheNeuve(t));
  if(!db.modifie_le) db.modifie_le = new Date().toISOString();
  appliquerTeinte();
  bascule(); purgerCorbeille();
  if(db.reglages.archive_avant) appliquerCoupure(db, db.reglages.archive_avant);
  if(dedoublonner()) sauver();   /* une réparation compte comme une modification */
  else sauver(false);
  rendre();
  await Sync.charger();
  rendre();
  Sync.synchroniser(false);
  Sync.lancerVeille();
})();
</script>
