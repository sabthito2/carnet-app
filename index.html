  h.push(`<button class="fab" data-act="ajoutRapide" title="Nouvelle tâche" aria-label="Nouvelle tâche">+</button>`);
  return h.join("");
}

/* ---- Échéances ---- */
function vueEcheances(){
  const j = jourISO(), l = datees().filter(passeSphere);
  const seau = t => { const n = ecartJours(j, t.date_due); return n < 0 ? 0 : n <= 10 ? 1 : n <= 90 ? 2 : 3; };
  const noms = ["En retard","10 jours","3 mois","Plus tard"];
  const h = [`<div class="entete-mob"><h1 class="titre">Échéances</h1><div class="jour">${dateCourte(j)}</div></div>`,
    `<div style="margin-bottom:6px"><button class="btn" data-act="nouvelleEcheance">Nouvelle échéance</button></div>`];
  const FAB = `<button class="fab" data-act="ajoutRapide" title="Nouvelle tâche" aria-label="Nouvelle tâche">+</button>`;
  if(!l.length) return h.join("") + vide("Aucune échéance") + FAB;
  for(let s = 0; s < 4; s++){
    const g = l.filter(t => seau(t) === s);
    if(g.length) h.push(groupe(noms[s], g.length, enFiche(g.map(t => ligneTache(t, { veille:true })))));
  }
  h.push(piedAide([
    "Toutes les tâches qui portent une date.",
    "Chacune remonte dans l'inbox au moment de son <b>préavis</b>, et se reconduit seule si elle est récurrente.",
  ]));
  h.push(FAB);
  return h.join("");
}


/* ---- Agenda ----
   Semaines entières : la page démarre au lundi de la semaine du 1er et finit
   au dimanche de la semaine du dernier jour. Aucune semaine n'est coupée,
   les jours débordants apparaissent en gris. */
const LETTRES = ["D","L","M","M","J","V","S"];
function grilleMois(annee, mois){
  const premier = new Date(annee, mois, 1);
  const debut = new Date(premier);
  debut.setDate(debut.getDate() - ((premier.getDay() + 6) % 7));
  const dernier = new Date(annee, mois + 1, 0);
  const fin = new Date(dernier);
  fin.setDate(fin.getDate() + (7 - ((dernier.getDay() + 6) % 7) - 1));
  const jours = [];
  for(let d = new Date(debut); d <= fin; d.setDate(d.getDate() + 1)) jours.push(jourISO(d));
  return jours;
}

function vueAgenda(){
  if(vue.semestre) return vueSemestre();
  if(vue.edt) return vueEdt();
  if(vue.semaineCondensee) return vueSemaineCondensee();
  const j = jourISO();
  if(!vue.moisAgenda) vue.moisAgenda = j.slice(0,7);
  const [an, mo] = vue.moisAgenda.split("-").map(Number);
  const jours = grilleMois(an, mo - 1);
  const h = [`<div class="entete-mob"><h1 class="titre">${MOIS[mo-1]} ${an}</h1><div class="jour">${dateCourte(j)}</div></div>`];

  const navMois = `<div class="nav-mois">
    <button class="btn mini creux" data-mois="-1">←</button>
    <button class="btn mini creux" data-mois="0">Today</button>
    <button class="btn mini creux" data-mois="1">→</button>
    <button class="btn mini" data-act="nouveauRdv">+ Rendez-vous</button>
    <button class="btn mini creux" data-act="ouvrirEdt" title="Emploi du temps de la semaine">▦</button>
    <button class="btn mini creux" data-act="ouvrirSemaineCondensee" title="Cette semaine, en un coup d'œil">7</button>
    <button class="btn mini creux" data-act="ouvrirSemestre" title="Vue sur six mois">▤</button>${
      (db.reglages.google_client_id && db.reglages.google_api_key)
        ? `<button class="btn mini ${googleVisible ? "" : "creux"}" data-act="actualiserGoogle"
             title="${googleVisible ? "Masquer mes événements Google (sans redemander à Google)" : "Afficher / rafraîchir mes événements Google (Pro)"}">
             ${googleEtat === "chargement" ? "…" : "G"}</button>` : ""}</div>`;
  h.push(navMois);
  if(googleEtat === "erreur" && googleMessage)
    h.push(`<p style="margin:-10px 0 16px;font-size:12.5px;color:var(--rouge)">Google Agenda : ${ech(googleMessage)}</p>`);

  const lignes = [];
  let semaine = -1;
  jours.forEach((iso, i) => {
    const d = versDate(iso), dow = d.getDay();
    const horsMois = +iso.slice(5,7) !== mo;
    const we = dow === 0 || dow === 6;
    const ferie = ferieDe(iso), vac = vacanceDe(iso), auj = iso === j;
    if(i % 7 === 0 && i > 0) lignes.push(`<div class="sep-sem"></div>`);

    const marques = [];
    anniDu(iso).forEach(a => marques.push(
      `<span class="anniv">${iconeAnniv(a)} ${ech(a.nom)}</span>`));
    if(ferie) marques.push(`<span class="ferie">${ech(ferie)}</span>`);

    const bloc = cote => rdvDu(iso).filter(r => (r.cote || "perso") === cote).map(r =>
      `<div class="rdv" data-rdv="${r.id}" data-rdvjour="${iso}" data-act="editerRdv" title="Modifier">
         <span class="${r.couleur ? "surl surl-" + r.couleur : ""}">${
           (r.duree || 1) > 1 ? `<i class="jalon">${rangRdv(r, iso)}/${r.duree}</i> ` : ""
         }${r.heure && rangRdv(r, iso) === 1 ? `<b>${ech(r.heure)}</b> ` : ""}${ech(r.intitule)}${
           r.repete ? ` <i class="jalon">↻</i>` : ""}${r.notes ? ` <i class="jalon">✎</i>` : ""}</span>
         <button class="ico sup" data-act="jeter" title="Supprimer">✕</button></div>`).join("");

    const taches = cote => cote === "perso" ? tachesDu(iso).map(t =>
      `<div class="rdv tache" data-tache="${t.id}">◷ ${ech(t.intitule)}</div>`).join("") : "";

    const google = cote => (cote === "pro" && googleVisible) ? evenementsGoogleDu(iso).map(g =>
      `<div class="rdv google" title="Google Agenda — lecture seule">
         <span>${g.heure ? `<b>${ech(g.heure)}</b> ` : ""}${ech(g.resume)}</span></div>`).join("") : "";

    lignes.push(`<div class="jour-l ${we?"we":""} ${horsMois?"hors":""} ${auj?"auj":""} ${vac?"envac":""}"
      data-jourdate="${iso}"${vac?` title="Vacances ${ech(vac)}"`:""}>
      <div class="date-c">
        <span class="lettre">${LETTRES[dow]}</span>
        <span class="num">${d.getDate()}</span>
        <button class="plus" data-act="rdvJour" title="Ajouter un rendez-vous">+</button>
      </div>
      <div class="col perso">${bloc("perso")}${taches("perso")}${marques.length?`<div class="marques">${marques.join("")}</div>`:""}</div>
      <div class="col pro">${bloc("pro")}${google("pro")}</div>
    </div>`);
  });

  h.push(`<div class="fiche agenda">
    <div class="entete-cols"><span></span><span>Perso</span><span>Pro</span></div>
    ${lignes.join("")}</div>`);
  /* Les mêmes flèches en bas : après avoir parcouru le mois, on ne veut pas
     remonter en haut pour passer au suivant. */
  h.push(`<div style="margin-top:14px">${navMois}</div>`);
  h.push(piedAide([
    "Sur téléphone, balayez vers la gauche ou la droite pour changer de mois.",
    "Un clic sur une journée y ajoute un rendez-vous. Le bouton <b>▦</b> ouvre l'emploi du temps de la semaine.",
    "Les échéances apparaissent en gris pâle, les vacances par un liseré à gauche.",
    (db.reglages.google_client_id && db.reglages.google_api_key)
      ? "Le bouton <b>G</b> bascule : un clic affiche/rafraîchit vos événements Google du mois (Pro, en italique) ; un second clic les masque sans rien redemander à Google." : null,
  ].filter(Boolean)));
  return h.join("");
}



/* ---- Vue semestrielle ----
   Six mois côte à côte, trente et un jours en lignes : le format des
   plannings muraux. On y lit d'un coup les dates de l'année qui comptent,
   sans le détail du quotidien — ni anniversaires, ni tâches. */
function vueSemestre(){
  const j = jourISO();
  const base = vue.semestre || j.slice(0,7);
  const [an0, mo0] = base.split("-").map(Number);
  const mois = Array.from({ length:6 }, (_, k) => {
    const d = new Date(an0, mo0 - 1 + k, 1);
    return { an:d.getFullYear(), mo:d.getMonth() };
  });
  const lettres = ["D","L","M","M","J","V","S"];

  const h = [`<button class="retour" data-act="fermerSemestre">← Agenda</button>`,
    `<div class="nav-mois">
      <button class="btn mini creux" data-sem="-6">←</button>
      <button class="btn mini creux" data-sem="0">Now</button>
      <button class="btn mini creux" data-sem="6">→</button>
      <span class="boite-note">${MOIS[mois[0].mo]} ${mois[0].an} → ${MOIS[mois[5].mo]} ${mois[5].an}</span>
    </div>`];

  const colonnes = mois.map(m => {
    const dim = new Date(m.an, m.mo + 1, 0).getDate();
    const cases = [];
    for(let d = 1; d <= 31; d++){
      if(d > dim){ cases.push(`<div class="sem-case hors"></div>`); continue; }
      const iso = jourISO(new Date(m.an, m.mo, d));
      const dow = new Date(m.an, m.mo, d).getDay();
      const we = dow === 0 || dow === 6;
      const ferie = ferieDe(iso), vac = vacanceDe(iso);
      const rdv = rdvDu(iso);
      const classes = ["sem-case"];
      if(we) classes.push("we");
      if(ferie) classes.push("ferie");
      if(vac) classes.push("vac");
      if(iso === j) classes.push("auj");
      cases.push(`<div class="${classes.join(" ")}" data-jourdate="${iso}"
        ${ferie ? `title="${ech(ferie)}"` : (vac ? `title="Vacances ${ech(vac)}"` : "")}>
        <span class="sem-jour">${lettres[dow]}${d}</span>
        <span class="sem-evts">${rdv.map(r => {
          const estPro = (r.cote||"perso") === "pro";
          /* Dans cette vue précise, le Pro garde un seul et unique fond,
             quel que soit le surligneur choisi — trop de couleurs à la fois
             rend la lecture d'ensemble plus difficile. Seul l'italique
             « carnet de bord » n'est pas une couleur : il reste appliqué. */
          const classeCouleur = r.couleur && (!estPro || r.couleur === "carnet") ? "surl-" + r.couleur : "";
          return `<b class="sem-e ${estPro ? "pro" : "perso"} ${classeCouleur}"
             data-rdv="${r.id}" data-rdvjour="${iso}" data-act="editerRdv">${ech(r.intitule)}</b>`;
        }).join("")}</span>
      </div>`);
    }
    return `<div class="sem-col">
      <div class="sem-titre">${MOIS[m.mo].slice(0,4)} ${String(m.an).slice(2)}</div>
      ${cases.join("")}</div>`;
  });

  h.push(`<div class="sem-cadre"><div class="sem-grille">${colonnes.join("")}</div></div>`);
  h.push(piedAide([
    "Six mois d'un coup d'œil. Un clic sur un jour y ajoute un rendez-vous, un clic sur un intitulé l'ouvre en entier.",
    "Les jours fériés sont en rose, les vacances portent un liseré à gauche, les week-ends sont grisés.",
    "Les anniversaires et les échéances n'y figurent pas : cette vue sert aux dates qui structurent le semestre.",
  ]));
  return h.join("");
}

/* ---- Semaine type ----
   Une grille horaire qui se répète chaque semaine : cours, activités,
   entraînements. Elle vit à part de l'agenda, qui reste réservé aux
   rendez-vous datés — trente heures de cours par semaine y noieraient
   tout le reste. */
const JOURS_EDT = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const enMinutes = h => { const [a,b] = String(h||"0:0").split(":").map(Number); return a*60 + (b||0); };

/* ---- Cette semaine, condensée ---- */
/* Ce qu'on regarde le lundi matin sans avoir à ouvrir trois onglets :
   rendez-vous et échéances des sept jours, et le budget en une ligne. */
function vueSemaineCondensee(){
  const j = jourISO();
  const sem = semaineDe(j);
  const semSuiv = semaineDe(jourISO(new Date(versDate(sem[6]).getTime() + 86400000)));
  const h = [`<button class="retour" data-act="fermerSemaineCondensee">← Agenda</button>`,
    `<div class="entete-d"><h1 class="titre">Cette semaine</h1>${
      (db.reglages.google_client_id && db.reglages.google_api_key)
        ? `<button class="btn mini ${googleVisible ? "" : "creux"}" data-act="actualiserGoogleSemaine"
             title="${googleVisible ? "Masquer mes événements Google (sans redemander à Google)" : "Afficher / rafraîchir mes événements Google (Pro)"}">
             ${googleEtat === "chargement" ? "…" : "G"}</button>` : ""}</div>`,
    `<div style="height:8px"></div>`];
  if(googleEtat === "erreur" && googleMessage)
    h.push(`<p style="margin:-4px 0 14px;font-size:12.5px;color:var(--rouge)">Google Agenda : ${ech(googleMessage)}</p>`);

  const blocSemaine = jours => `<div class="fiche liste">${jours.map((iso,k) => {
    const rdv = rdvDu(iso);
    const tas = datees().filter(t => passeSphere(t) && t.date_due === iso && t.statut !== "done");
    const goog = googleVisible ? evenementsGoogleDu(iso) : [];
    const estAuj = iso === j;
    const morceaux = [
      ...rdv.map(r => `${r.heure ? ech(r.heure)+" " : ""}${ech(r.intitule)}`),
      ...tas.map(t => `◷ ${ech(t.intitule)}`),
      ...goog.map(g => `<span style="font-style:italic;color:var(--encre-3)">${g.heure ? ech(g.heure)+" " : ""}${ech(g.resume)}</span>`),
    ];
    return `<div class="ligne">
      <div class="corps">
        <div class="intitule">${estAuj?"<b>":""}${JOURS_EDT[k]} ${versDate(iso).getDate()}${estAuj?"</b>":""}</div>
        ${morceaux.length
          ? morceaux.map(m => `<div style="font-size:13.5px;color:var(--encre-3);line-height:1.4;margin-top:3px">${m}</div>`).join("")
          : `<div class="note-min">-</div>`}
      </div>
    </div>`;
  }).join("")}</div>`;

  h.push(blocSemaine(sem));
  h.push(`<div class="oeil" style="margin-top:18px">Semaine prochaine</div>`);
  h.push(blocSemaine(semSuiv));

  h.push(piedAide([
    "Semaine du lundi au dimanche, celle en cours puis la suivante.",
    (db.reglages.google_client_id && db.reglages.google_api_key)
      ? "Le bouton <b>G</b> affiche vos événements Google (en italique) pour les deux semaines ; un second clic les masque sans rien redemander." : null,
  ].filter(Boolean)));
  return h.join("");
}

function vueEdt(){
  const edt = (db.emplois || []).find(x => x.id === vue.edt);
  if(!edt){ vue.edt = null; return vueAgenda(); }
  const entrees = (edt.entrees || []).slice()
    .sort((a,b) => a.jour - b.jour || enMinutes(a.debut) - enMinutes(b.debut));

  /* Les bornes de la journée sont choisies, pas déduites : c'est l'heure
     d'arrivée le matin et celle de sortie qui structurent la grille. */
  const hDebut = enMinutes(edt.debut_journee || "08:00");
  const hFin   = enMinutes(edt.fin_journee || "20:00");
  const lignes = Math.max(2, Math.round((hFin - hDebut) / 30));
  const rang = m => Math.min(lignes + 2, Math.max(2, Math.round((m - hDebut) / 30) + 2));

  const h = [`<button class="retour" data-act="fermerEdt">← Agenda</button>`,
    `<div class="entete-d"><h1 class="titre">${ech(edt.nom)}</h1></div>`,
    `<div class="meta" style="margin:0 0 16px">
      <span class="puce date">${ech(edt.debut_journee || "08:00")} → ${ech(edt.fin_journee || "20:00")}</span>
      <button class="btn mini creux" data-edt="${edt.id}" data-act="editerEdt">Régler</button>
      <button class="btn mini" data-edt="${edt.id}" data-act="nouveauCreneau">+ Créneau</button>
    </div>`];

  const cases = [];
  for(let k = 0; k < lignes; k++){
    const m = hDebut + k * 30;
    if(m % 60 === 0) cases.push(`<span class="edt-heure" style="grid-row:${k+2}">${String(Math.floor(m/60)).padStart(2,"0")}h</span>`);
    cases.push(`<span class="edt-fond ${m % 60 === 0 ? "pleine" : ""}"
      style="grid-row:${k+2};grid-column:2 / 9"></span>`);
  }
  entrees.forEach(e => {
    const d = enMinutes(e.debut), f = Math.max(enMinutes(e.fin), d + 30);
    if(f <= hDebut || d >= hFin) return;   /* hors des bornes affichées */
    cases.push(`<div class="edt-bloc ${e.couleur ? "surl-" + e.couleur : ""}"
      data-creneau="${e.id}" data-edt="${edt.id}" data-act="editerCreneau"
      style="grid-column:${e.jour + 2};grid-row:${rang(d)} / ${rang(f)}">
      <b>${ech(e.intitule)}</b>
      <i>${ech(e.debut)}–${ech(e.fin)}${e.lieu ? " · " + ech(e.lieu) : ""}</i></div>`);
  });

  h.push(`<div class="edt-cadre"><div class="edt-grille"
    style="grid-template-rows:22px repeat(${lignes}, 20px)">
    <span class="edt-coin"></span>
    ${JOURS_EDT.map((j,i) => `<span class="edt-jour" style="grid-column:${i+2};grid-row:1">${j.slice(0,3)}</span>`).join("")}
    ${cases.join("")}
  </div></div>`);

  const dehors = entrees.filter(e => enMinutes(e.fin) <= hDebut || enMinutes(e.debut) >= hFin);
  if(dehors.length)
    h.push(`<p class="petit-detail" style="margin:8px 2px 0">
      ${dehors.length} créneau${dehors.length>1?"x":""} hors des horaires affichés :
      ${dehors.map(e => ech(e.intitule)).join(" · ")}. Élargissez la journée pour les voir.</p>`);

  if(!entrees.length)
    h.push(`<p class="petit-detail" style="margin:10px 2px 0">
      Grille vide. Ajoutez un premier créneau : un cours, un entraînement, une activité.</p>`);
  h.push(piedAide([
    "Cette semaine se répète à l'identique et n'apparaît pas dans l'agenda, réservé aux rendez-vous datés.",
    "Le bouton <b>Régler</b> fixe le début et la fin de journée affichés.",
  ]));
  return h.join("");
}

/* ---- Bilan annuel ---- */
function vueBilanAnnuel(){
  const anBase = vue.anneeBilan ?? anneeBilanCourante();
  const { libelle } = periodeBilanAnnuel(anBase);
  const r = calculerBilanAnnuel(anBase);
  const estCourante = anBase === anneeBilanCourante();

  const h = [`<button class="retour" data-act="fermerBilanAnnuel">← Budget</button>`,
    `<div class="entete-d"><h1 class="titre">Bilan annuel</h1></div>`,
    `<div class="barre-mois">
      <button class="btn mini creux" data-anbilan="-1">←</button>
      <div class="titre-mois"><span class="nom">${ech(libelle)}</span></div>
      <button class="btn mini creux" data-anbilan="1">→</button>
      ${!estCourante ? `<button class="btn mini creux" data-anbilan="0">Année en cours</button>` : ""}
    </div>`];

  if(!r.dep.length && !r.rentrees.length && !r.tachesFaites){
    h.push(vide("Rien sur cette période", "Aucune dépense, rentrée ou tâche accomplie n'est datée dans cet intervalle."));
    return h.join("");
  }

  h.push(`<div class="compteur" style="margin-top:16px">
    <div class="cpt-l"><span class="cpt-n">Total dépensé</span><span class="cpt-v">${euro(r.total,0)}</span></div>
    ${r.totalRentrees ? `<div class="cpt-l"><span class="cpt-n">Rentrées ponctuelles reçues</span><span class="cpt-v">${euro(r.totalRentrees,0)}</span></div>` : ""}
    <div class="cpt-l"><span class="cpt-n">Tâches accomplies</span><span class="cpt-v">${r.tachesFaites}</span></div>
  </div>`);

  if(r.moisTries.length){
    const [moisMax, vMax] = r.moisTries[0];
    const [an,mo] = moisMax.split("-").map(Number);
    h.push(`<p class="petit-detail" style="margin:14px 0 0">Mois le plus dépensier : ${MOIS[mo-1]} ${an} (${euro(vMax,0)}).</p>`);
  }

  if(Object.keys(r.parCategorie).length){
    const lignes = Object.entries(r.parCategorie).sort((a,b) => b[1] - a[1]);
    const max = lignes[0][1];
    h.push(`<div class="oeil" style="margin-top:18px">Répartition par catégorie</div>
      <div class="fiche" style="padding:6px 0">${lignes.map(([id,v]) => `<div class="barre-cat">
        <span class="nom">${ech(cdepDe(id)?.nom || "Sans catégorie")}</span>
        <span class="tige"><i style="width:${(v/max)*100}%"></i></span>
        <span class="v">${euro(v,0)}</span></div>`).join("")}</div>`);
  }

  h.push(`<div class="oeil" style="margin-top:18px">Charges et solde, mois par mois</div>`);
  h.push(`<div class="fiche liste">${r.parMoisFige.map(m => {
    const [an,mo] = m.cle.split("-").map(Number);
    return `<div class="ligne">
      <div class="corps"><div class="intitule">${MOIS[mo-1]} ${an}</div>
        <div class="meta">
          <span class="puce">${euro(m.charges,0)} de charges${m.chargesFigees ? "" : " (estimation actuelle)"}</span>
          <span class="puce ${m.solde<0?"chaud":""}">${euro(m.solde,0)} de solde</span>
        </div>
      </div>
    </div>`;
  }).join("")}</div>`);

  h.push(piedAide([
    "Les revenus réguliers n'apparaissent pas en détail : réglés comme un taux mensuel actuel plutôt qu'un historique daté, un total sur douze mois serait trompeur.",
    "Les <b>charges</b> sont figées à la première ouverture du carnet après la fin de chaque mois — modifier un prix plus tard ne change plus ce chiffre-là. Sans instantané pour ce mois (trop tôt, ou mois en cours), c'est le tarif actuel qui s'affiche à la place, sans garantie.",
    "Le <b>solde</b>, lui, n'est jamais figé : il se recalcule toujours avec les dépenses telles qu'elles sont aujourd'hui — pour rester juste même si certaines ont été rentrées en retard.",
  ]));
  return h.join("");
}

function vueBudget(){
  if(vue.pageBilanAnnuel) return vueBilanAnnuel();
  const b = bilan(vue.decalage), j = jourISO();
  const nomPeriode = nomDeLaPeriode(vue.decalage);
  const h = [`<div class="entete-mob"><h1 class="titre">Budget</h1><div class="jour">${dateCourte(j)}</div></div>`];

  /* ---------- 1. Le mois consulté ---------- */
  h.push(`<div class="barre-mois ${b.courante ? "" : "ailleurs"}">
    <button class="btn mini creux" data-periode="-1">←</button>
    <div class="titre-mois">
      <span class="nom">${nomPeriode}</span>
      <span class="plage">${dateMoyenne(b.deb)} → ${dateMoyenne(b.fin)}${
        b.courante ? "" : (vue.decalage < 0 ? " · mois passé" : " · mois à venir")}</span>
    </div>
    <button class="btn mini creux" data-periode="1">→</button>
    ${vue.decalage !== 0 ? `<button class="btn mini creux" data-periode="0">Revenir au mois en cours</button>` : ""}
  </div>`);
  h.push(`<div style="margin:-8px 0 16px"><button class="btn mini creux" data-act="ouvrirBilanAnnuel">📅 Bilan annuel</button></div>`);

  /* ---------- 2. Ce qu'il reste ---------- */
  if(!b.revenus && !b.charges && !db.depenses.length){
    h.push(vide("Le budget est vide",
      "Commencez par renseigner vos revenus dans Réglages. Vos factures et abonnements se saisissent dans les dossiers du Suivi."));
  }else{
    /* Trois groupes courts, en chiffres discrets : le solde, ce qui sort
       encore, puis d'où vient le calcul. Aucun grand nombre. */
    const aPrel = resteAPrelever(b.deb, b.fin);
    const ligne = (nom, valeur, note, cl) => `<div class="cpt-l">
      <span class="cpt-n">${nom}</span>
      <span class="cpt-v ${cl||""}">${valeur}</span>
      ${note ? `<span class="cpt-note">${note}</span>` : ""}</div>`;

    h.push(`<button class="oeil" data-act="basculerRecap"
      style="width:100%;border:0;background:none;cursor:pointer;text-align:left;padding:0">
      Récap ${vue.recapOuvert ? "▾" : "▸"}</button>`);
    if(vue.recapOuvert) h.push(`<div class="compteur">
      ${ligne(b.courante ? "Solde" : "Solde sur " + nomPeriode, euro(b.reste,0),
              b.courante ? `soit ${euro(b.reste / b.encore, 0)} par jour pendant ${b.encore} jours` : "",
              b.reste < 0 ? "neg" : "")}
      ${aPrel > 0 && b.courante ? ligne("Encore à prélever", euro(aPrel,0), "déjà retirés") : ""}
      ${b.sortiePonctuelle > 0 ? ligne("Facture annuelle du mois", euro(b.sortiePonctuelle,0), "retirée en plus") : ""}
      <div class="cpt-filet"></div>
      ${ligne("Dépenses du mois", euro(b.depense,0), b.especes > 0 ? `+ ${euro(b.especes,0)} en espèces, déjà décomptés` : "")}
      <div class="cpt-filet"></div>
      ${ligne("Budget initial", euro(b.disponible,0))}
      ${ligne("Charges retirées", euro(b.charges,0))}
    </div>`);
  }

  /* ---------- 5. Les dépenses saisies ---------- */
  /* Les factures annuelles qui tombent ce mois-ci figurent parmi les
     dépenses : ce jour-là, l'argent quitte réellement le compte, et le
     réglage « compter deux fois » les retire effectivement du reste. */
  /* Une facture qui tombe ce mois-ci se voit toujours : qu'elle soit
     comptée en plus ou seulement lissée est une affaire de calcul, pas
     une raison de la cacher. */
  const ponctuelsDuMois = b.ponctuels;
  const comptes = compterPrelevements();
  const parJour = {};
  b.dep.forEach(x => (parJour[x.date] = parJour[x.date] || []).push({ genre:"dep", x }));
  ponctuelsDuMois.forEach(p => (parJour[p.date] = parJour[p.date] || []).push({ genre:"prel", p }));
  const jours = Object.keys(parJour).sort().reverse();
  const totalMois = b.depense + (comptes ? b.sortiePonctuelle : 0);
  /* Le renvoi vers les mois à venir ne doit pas disparaître dès qu'une
     dépense est saisie : c'est justement là qu'on cherche où tombe la
     prochaine facture annuelle. */
  const aVenirMois = moisAvecMouvement()
    .filter(n => n > 0 && n !== vue.decalage)
    .sort((a,z) => a - z)
    .slice(0, 6);
  h.push(`<div class="oeil">Dépenses ${b.courante ? "" : "de " + nomPeriode}
    ${jours.length?`<span class="cpt">${euro(totalMois,2)}</span>`:""}</div>`);
  if(ponctuelsDuMois.length){
    const somme = ponctuelsDuMois.reduce((s,p) => s + (p.l.montant || 0), 0);
    const liste = ponctuelsDuMois.map(p => `${ech(p.l.libelle)} le ${versDate(p.date).getDate()}`).join(" · ");
    h.push(`<p class="petit-detail" style="margin:0 0 8px">${comptes
      ? `Dont ${euro(somme,2)} de facture annuelle prélevée ${b.courante ? "ce mois-ci" : "sur " + nomPeriode} : ${liste}.`
      : `${euro(somme,2)} de facture annuelle sont aussi prélevés ${b.courante ? "ce mois-ci" : "sur " + nomPeriode} — ${liste} —
         mais déjà comptés de façon lissée, ils ne s'ajoutent pas au total.`}</p>`);
  }
  if(!jours.length){
    /* On ne propose que les mois à venir : une facture annuelle a autant
       d'occurrences passées que futures, et les remonter n'aide en rien. */
    const ailleurs = aVenirMois;
    h.push(vide(b.courante ? "Aucune dépense ce mois-ci" : `Aucune dépense en ${nomPeriode}`,
      ailleurs.length
        ? `À venir sur d'autres mois :<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:8px">${ailleurs.map(n =>
            `<button class="lien-mois" data-saut="${n}" title="${dateMoyenne(debutPeriode(n))} → ${dateMoyenne(finPeriode(debutPeriode(n)))}">${nomDeLaPeriode(n)} <b>${euro(montantMouvementDuMois(n),2)}</b></button>`
          ).join("")}</div>`
        : "La première saisie se fait en deux gestes : un montant, une catégorie."));
  }
  else h.push(jours.map(d => {
    const l = parJour[d];
    const s = l.reduce((t,e) => t + (e.genre === "dep" ? e.x.montant : e.p.l.montant), 0);
    return `<div class="oeil" style="margin:14px 0 6px">${d===j?"Aujourd'hui":dateLongue(d)}<span class="a-droite">${euro(s,2)}</span></div>
    ${enFiche(l.map(e => {
      if(e.genre === "prel"){
        const { l:lg, d:dos } = e.p;
        return `<div class="ligne" data-dossier="${dos.id}">
          <div class="corps"><div class="intitule">${ech(lg.libelle)}</div>
            <div class="meta"><span class="puce doss">${ech(dos.nom)}</span>
              <span class="puce ctx">prélèvement ${ech(lg.periodicite)}</span>
              ${comptes ? "" : `<span class="puce">déjà lissé</span>`}</div></div>
          <div class="somme"${comptes ? "" : ` style="color:var(--encre-3)"`}>${euro(lg.montant,2)}</div>
          <div class="outils"><button class="ico" data-act="ouvrir" title="Ouvrir le dossier">↗</button></div></div>`;
      }
      const x = e.x, c = cdepDe(x.categorie_id);
      return `<div class="ligne" data-depense="${x.id}">
      <div class="corps"><div class="intitule">${ech(x.libelle) || (c ? ech(c.nom) : "Dépense")}</div>
        <div class="meta">${c && x.libelle ? `<span class="puce">${ech(c.nom)}</span>` : ""}
          ${x.moyen && x.moyen !== MOYEN_DEFAUT ? `<span class="puce">${nomMoyen(x.moyen)}</span>` : ""}
          ${enEspeces(x) ? `<span class="puce">déjà décompté</span>` : ""}
          ${x.rembourser && !x.rembourse ? `<span class="puce ctx">à rembourser</span>` : ""}
          ${x.rembourse ? `<span class="puce">remboursé</span>` : ""}</div>
        ${x.note ? `<div class="petit-detail" style="margin-top:2px">${ech(x.note)}</div>` : ""}</div>
      <div class="somme"${enEspeces(x) ? ` style="color:var(--encre-3)"` : ""}>${euro(x.montant,2)}</div>
      <div class="outils">
        <button class="ico ${x.rembourser?"actif":""}" data-act="marquerRemb"
          title="${x.rembourser?"Ne plus attendre de remboursement":"À se faire rembourser"}">⟲</button>
        <button class="ico" data-act="editer">✎</button>
        <button class="ico sup" data-act="jeter">✕</button></div></div>`;
    }))}`;
  }).join(""));

  /* ---------- Ce que l'on attend ---------- */
  /* Juste après les dépenses du jour, avant les mois à venir : c'est ce
     qui concerne le mois en cours, pas un aperçu d'un autre mois. */
  if(b.attente.length){
    const age = ecartJours(b.attente[0].date, j);
    h.push(`<div class="oeil">En attente de remboursement<span class="a-droite">${euro(b.avances,0)} avancés</span></div>`);
    h.push(`<p class="petit-detail" style="margin:0 0 8px">
      ${b.attente.length} dépense${b.attente.length>1?"s":""} · la plus ancienne remonte à ${age} jour${age>1?"s":""}.</p>`);
    h.push(enFiche(b.attente.map(x => { const c = cdepDe(x.categorie_id); return `<div class="ligne" data-depense="${x.id}">
      <div class="cases"><button class="case carre" data-act="rembourser"
        title="J'ai été remboursé" aria-label="Encaisser le remboursement">${CHECK}</button></div>
      <div class="corps"><div class="intitule">${ech(x.libelle) || (c ? ech(c.nom) : "Dépense")}</div>
        <div class="meta"><span class="puce date">avancé le ${dateCourte(x.date)}</span>
          ${c && x.libelle ? `<span class="puce">${ech(c.nom)}</span>` : ""}</div></div>
      <div class="somme">${euro(x.montant,2)}</div>
      <div class="outils"><button class="ico" data-act="marquerRemb" title="Retirer de l'attente">⟲</button></div></div>`; })));
  }

  if(jours.length && aVenirMois.length)
    h.push(`<div class="petit-detail" style="margin:12px 0 0">À venir sur d'autres mois :</div>
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:6px">${
      aVenirMois.map(n => `<button class="lien-mois" data-saut="${n}"
        title="${dateMoyenne(debutPeriode(n))} → ${dateMoyenne(finPeriode(debutPeriode(n)))}">${nomDeLaPeriode(n)} <b>${euro(montantMouvementDuMois(n),2)}</b></button>`
      ).join("")}</div>`);

  if(b.dep.length){
    const tot = {};
    b.dep.forEach(x => tot[x.categorie_id || "?"] = (tot[x.categorie_id || "?"] || 0) + x.montant);
    const lignes = Object.entries(tot).sort((a,c) => c[1] - a[1]);
    const max = lignes[0][1];
    h.push(`<div class="oeil">Répartition</div><div class="fiche" style="padding:6px 0">
      ${lignes.map(([id,v]) => `<div class="barre-cat">
        <span class="nom">${ech(cdepDe(id)?.nom || "Sans catégorie")}</span>
        <span class="tige"><i style="width:${(v/max)*100}%"></i></span>
        <span class="v">${euro(v,0)}</span></div>`).join("")}</div>`);
  }

  const rentrees = [...(db.rentrees||[])].sort((a,c) =>
    (a.recu?1:0) - (c.recu?1:0) || (a.date||"9").localeCompare(c.date||"9"));
  h.push(`<div class="oeil">Rentrées ponctuelles${b.attendues ? `<span class="a-droite">${euro(b.attendues,0)} à venir</span>` : ""}</div>`);
  h.push(rentrees.length ? enFiche(rentrees.map(r => `<div class="ligne" data-rentree="${r.id}">
      <div class="cases"><button class="case carre ${r.recu?"coche":""}" data-act="encaisser"
        title="${r.recu?"Encaissé":"Marquer comme encaissé"}" aria-label="Encaisser">${CHECK}</button></div>
      <div class="corps"><div class="intitule">${ech(r.libelle)}</div>
        <div class="meta">${r.recu
          ? `<span class="puce date">encaissé le ${dateCourte(r.date)}</span>`
          : `<span class="puce ctx">${r.date ? "prévu le " + dateCourte(r.date) : "à venir"}</span>`}</div></div>
      <div class="somme">${r.montant == null ? "?" : euro(r.montant,2)}</div>
      <div class="outils"><button class="ico" data-act="editer">✎</button>
        <button class="ico sup" data-act="jeter">✕</button></div></div>`))
    : vide("Aucune rentrée"));
  h.push(`<div style="margin:9px 0 14px"><button class="btn mini creux" data-act="nouvelleRentree">Ajouter une rentrée</button></div>`);

  /* ---------- 6. Factures et abonnements : une seule liste ---------- */
  const factures = toutesLignes().map(({ l, d }) => {
    const p = PERIODES[l.periodicite];
    const dates = datesPrelevement(l, b.deb, b.fin);
    return { l, d, mensuelle: p === 1, dates,
             tombe: dates.length > 0,
             quand: dates[0] || null,
             reel: p === 1 ? l.montant : l.montant * dates.length,
             lisse: parMois(l) };
  }).sort((a,c) =>
    (c.tombe?1:0) - (a.tombe?1:0)
    || (a.quand || "9").localeCompare(c.quand || "9")
    || (a.l.jour || 99) - (c.l.jour || 99)
    || c.lisse - a.lisse);

  const sansMois = factures.filter(x => !x.mensuelle && !x.l.mois);
  const totalReel = factures.reduce((s,x) => s + x.reel, 0);

  const encoreDu = resteAPrelever(b.deb, b.fin);
  if(jours.length) h.push(`<div style="margin:4px 0 -10px">
    <button class="btn mini creux" data-act="exporterCSVBudget">Export CSV — ${ech(nomPeriode)}</button></div>`);
  h.push(`<div class="oeil">Charges<span class="a-droite">${euro(totalCharges(),2)} / mois</span></div>`);
  if(toutesLignes().length) h.push(`<div style="margin:-8px 0 12px">
    <button class="btn mini creux" data-act="exporterCSVCharges">Export CSV — Charges</button></div>`);
  if(b.courante)
    h.push(`<p class="petit-detail" style="margin:0 0 8px">${
      encoreDu > 0
        ? `Reste ${euro(encoreDu,2)} à prélever d'ici le ${dateMoyenne(b.fin)}.`
        : "Tout est prélevé pour ce mois-ci."}</p>`);

  if(sansMois.length)
    h.push(`<div class="bandeau alerte" style="margin:0 0 10px"><div class="g">
      ${sansMois.length === 1 ? "Une facture n'a pas de mois de prélèvement" : sansMois.length + " factures n'ont pas de mois de prélèvement"} :
      ${sansMois.map(x => ech(x.l.libelle)).join(" · ")}. Tant qu'il manque, aucun mois ne les voit tomber.
      </div><button class="btn mini creux" data-dossier="${sansMois[0].d.id}" data-act="ouvrir">Corriger</button></div>`);

  if(!factures.length)
    h.push(vide("Aucune facture enregistrée",
      "Ouvrez le dossier concerné dans Suivi et ajoutez la ligne dans « Charges »."));
  else{
    h.push(enFiche(factures.map(({ l, d, mensuelle, tombe, quand, reel, lisse }) => {
      const passe = quand && quand < j;
      const jourAffiche = quand ? String(versDate(quand).getDate()).padStart(2,"0")
                                : (l.jour ? String(l.jour).padStart(2,"0") : "—");
      const meta = [`<span class="puce doss">${ech(d.nom)}</span>`,
                    `<span class="puce">${ech(l.periodicite)}</span>`];
      if(!mensuelle){
        if(tombe) meta.push(`<span class="puce ctx">${euro(l.montant,0)} le ${dateMoyenne(quand)}</span>`);
        else if(l.mois) meta.push(`<span class="puce">${euro(l.montant,0)} le ${l.jour} ${MOIS[l.mois-1]}</span>`);
        else meta.push(`<span class="puce chaud">mois à préciser</span>`);
      }
      if(quand) meta.push(`<span class="puce">${passe ? "prélevé" : "à venir"}</span>`);
      return `<div class="ligne" data-dossier="${d.id}">
        <div class="jour-prel ${passe || !quand ? "passe" : ""}">${jourAffiche}</div>
        <div class="corps">
          <button class="nom" data-act="ouvrir" style="background:none;border:0;padding:0;text-align:left;font-weight:540">${ech(l.libelle)}</button>
          <div class="meta">${meta.join("")}</div></div>
        <div class="somme">${reel > 0 ? euro(reel,2) : `<span style="color:var(--encre-3)">${euro(lisse,2)}</span>`}</div>
      </div>`;
    })));
    h.push(`<p class="petit-detail" style="margin:8px 0 0">
      ${euro(totalReel,2)} partent réellement du compte ${b.courante ? "ce mois-ci" : "sur " + nomPeriode} ;
      ${euro(totalCharges(),2)} sont comptés chaque mois dans le calcul.
      Les montants en gris sont des parts lissées, ceux en noir des prélèvements du mois.</p>`);
  }

  if(!totalRevenus())
    h.push(`<div class="bandeau" style="margin:22px 0 0"><div class="g">Aucun revenu saisi : sans lui, le calcul n'a pas de sens. Il se renseigne dans Réglages.</div>
      <button class="btn mini creux" data-aller="reglages">Réglages</button></div>`);

  h.push(piedAide([
    "Le <b>solde</b> part de vos revenus, retire les factures, puis les dépenses du mois.",
    "« Ce qu'il y avait au départ » (Budget initial), ce sont vos revenus une fois les factures et abonnements retirés ; vos dépenses du quotidien viennent s'y soustraire au fil du mois.",
    "Une facture annuelle est étalée sur douze mois ; le mois où elle tombe, elle est aussi retirée en entier — comptée deux fois par sécurité, modifiable dans Réglages.",
    "Une dépense en <b>espèces</b> n'est pas recomptée : elle a déjà été décomptée au retrait. Elle sert à savoir où l'argent est parti.",
    "Une dépense <b>à rembourser</b> est bien retirée du solde, comme n'importe quelle dépense — le montant « avancé » affiché est juste un repère, pas un ajout au solde. Le solde remonte seulement une fois le remboursement encaissé.",
  ]));
  h.push(`<button class="fab" data-act="depenseRapide" title="Nouvelle dépense" aria-label="Nouvelle dépense">+</button>`);
  return h.join("");
}

/* ---- Suivi ---- */
function vueSuivi(){
  if(vue.noteOuverte) return vueNoteOuverte();
  if(vue.dossier) return vueDossier();
  if(vue.liste) return vueListeOuverte();
  if(vue.pageListes) return vueListesPage();
  if(vue.projet) return vueProjetOuvert();
  if(vue.pageProjets) return vueProjetsPage();
  if(vue.pageCommandes) return vueCommandesPage();
  if(vue.pageGaranties) return vueGarantiesPage();
  if(vue.pageAstronomie) return vueAstronomiePage();
  if(vue.pageCoherence) return vueCoherencePage();
  const alerteGaranties = db.garanties.filter(g => ecartJours(jourISO(), ajouterPeriode(g.date_achat, g.duree_mois || 12, "mois")) <= 60).length;
  const h = [`<div class="entete-mob"><h1 class="titre">Suivi</h1><div class="jour">${dateCourte(jourISO())}</div></div>`,
    `<div style="margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap">
       <button class="btn" data-act="nouveauDossier">Nouveau dossier</button>
       <button class="btn creux" data-act="ouvrirListes">Listes${db.listes.length ? ` <span class="cpt">${db.listes.length}</span>` : ""}</button>
       <button class="btn creux" data-act="ouvrirProjets">Projets${db.projets.length ? ` <span class="cpt">${db.projets.length}</span>` : ""}</button>
       <button class="btn creux" data-act="ouvrirCommandes">Commandes${db.commandes.filter(c=>!c.recue).length ? ` <span class="cpt">${db.commandes.filter(c=>!c.recue).length}</span>` : ""}</button>
       <button class="btn creux" data-act="ouvrirGaranties">Garanties${alerteGaranties ? ` <span class="cpt">${alerteGaranties}</span>` : ""}</button>
       <button class="btn creux" data-act="ouvrirAstronomie">Astronomie</button>
       <button class="btn creux" data-act="ouvrirCoherence" title="Cohérence cardiaque" aria-label="Cohérence cardiaque" style="display:inline-flex;align-items:center;justify-content:center;padding:9px 17px">${SVG_COEUR}</button>
     </div>`];
  if(!db.dossiers.length) return h.join("") + vide("Aucun dossier", "Commencez par le sujet qui vous occupe le plus.");
  const tri = [...db.dossiers].sort((a,b) =>
    (catDe(a.categorie_id)?.nom||"zz").localeCompare(catDe(b.categorie_id)?.nom||"zz") || a.nom.localeCompare(b.nom));
  const info = d => {
    const p = prochaineDe(d.id);
    /* Le compte doit correspondre à ce que la fiche montrera réellement,
       sinon on annonce 21 tâches et on en affiche zéro. */
    const vues = duDossier(d.id).filter(passeSphere);
    /* Les échéances sont déjà suivies dans leur propre onglet : on les compte
       à part, pour que le nombre restant soit celui des tâches qui dorment. */
    const avecDate = vues.filter(t => t.date_due);
    const remontees = vues.filter(t => !t.date_due && (t.en_inbox || t.suivant_le)).length;
    const n = vues.length - avecDate.length - remontees;
    const ech = avecDate.map(t => t.date_due).sort().slice(0,3);
    const nEch = avecDate.length;
    return { p, n, c:catDe(d.categorie_id),
      lien: d.url ? `<a class="lien" href="${ech(d.url)}" target="_blank" rel="noopener">Ouvrir ↗</a>` : `<span style="color:var(--encre-3)">—</span>`,
      remontees, ech, nEch,
      cout: parMoisDossier(d) ? `${euro(parMoisDossier(d),2)} / mois` : "—" };
  };
  h.push(`<div class="fiche"><table class="tab"><thead><tr>
    <th>Dossier</th><th>Catégorie</th><th>Accès</th><th>Identifiant</th><th>N° contrat</th><th>Coût</th><th>Échéances</th><th>Tâches</th><th></th>
    </tr></thead><tbody>${tri.map(d => { const x = info(d); return `<tr data-dossier="${d.id}">
      <td><button class="nom" data-act="ouvrir">${ech(d.nom)}</button>
        ${(d.mur||[]).length ? `<span class="note-min">${(d.mur||[]).length} note${(d.mur||[]).length>1?"s":""}</span>` : ""}</td>
      <td>${x.c ? ech(x.c.nom) : "—"}</td><td>${x.lien}</td>
      <td class="num">${ech(d.identifiant) || "—"}</td><td class="num">${ech(d.contrat) || "—"}</td>
      <td class="num">${x.cout}</td>
      <td class="num">${x.ech.length ? x.ech.map(dateCourte).join(" · ") : "—"}</td>
      <td class="num">${x.n || x.remontees || x.nEch
        ? `${x.n ? `<span class="marque-tache">▪ ${x.n}</span>` : ""}${
            x.remontees ? ` <span style="color:var(--encre-3)">↑${x.remontees}</span>` : ""}${
            x.nEch ? ` <span style="color:var(--encre-3)">◷${x.nEch}</span>` : ""}`
        : "—"}</td>
      <td><span class="outils" style="opacity:1">
        <button class="ico" data-act="editer" title="Modifier">✎</button>
        <button class="ico sup" data-act="jeter" title="Corbeille">✕</button></span></td>
    </tr>`; }).join("")}</tbody></table></div>`);
  h.push(`<div class="fiche liste cartes">${tri.map(d => { const x = info(d); return `<div class="ligne" data-dossier="${d.id}">
    <div class="corps"><button class="nom" data-act="ouvrir" style="font-weight:580;background:none;border:0;padding:0;text-align:left">${ech(d.nom)}</button>
      <div class="meta">${x.c ? `<span class="puce">${ech(x.c.nom)}</span>` : ""}
        ${parMoisDossier(d) ? `<span class="puce date">${x.cout}</span>` : ""}</div>
      ${x.ech.length ? `<div class="note-min" style="max-width:none">Échéances ${x.ech.map(dateCourte).join(" · ")}</div>` : ""}
      ${x.n || x.remontees || x.nEch ? `<div class="marque-tache ligne-seule">${
        [x.n ? `▪ ${x.n} tâche${x.n>1?"s":""}` : "",
         x.remontees ? `${x.remontees} remontée${x.remontees>1?"s":""}` : "",
         x.nEch ? `${x.nEch} échéance${x.nEch>1?"s":""}` : ""].filter(Boolean).join(", ")}</div>` : ""}
      ${(d.mur||[]).length ? `<span class="note-min">${(d.mur||[]).length} note${(d.mur||[]).length>1?"s":""}</span>` : ""}</div>
    <div class="outils"><button class="ico" data-act="editer">✎</button><button class="ico sup" data-act="jeter">✕</button></div>
  </div>`; }).join("")}</div>`);

  h.push(piedAide([
    "Le <b>▪</b> signale les tâches qui dorment dans un dossier, sans échéance ni remontée.",
  ]));

  /* Récapitulatif mensuel par catégorie */
  const parCat = {};
  toutesLignes().forEach(({ l, d }) => {
    const k = d.categorie_id || "?";
    parCat[k] = (parCat[k] || 0) + parMois(l);
  });
  const rangs = Object.entries(parCat).sort((a,c) => c[1] - a[1]);
  if(rangs.length){
    const total = rangs.reduce((s,[,v]) => s + v, 0), max = rangs[0][1];
    h.push(`<div class="oeil">Charges par catégorie<span class="a-droite">${euro(total,2)} / mois</span></div>
      <div class="fiche" style="padding:6px 0">${rangs.map(([id,v]) => `<div class="barre-cat">
        <span class="nom">${ech(catDe(id)?.nom || "Sans catégorie")}</span>
        <span class="tige"><i style="width:${(v/max)*100}%"></i></span>
        <span class="v">${euro(v,0)}</span></div>`).join("")}</div>
      <p style="margin:9px 0 0;font-size:12.5px;color:var(--encre-3)">
        Montants lissés au mois : une charge annuelle compte pour un douzième.</p>`);
  }
  return h.join("");
}

function vueDossier(){
  const d = dossDe(vue.dossier);
  if(!d){ vue.dossier = null; return vueSuivi(); }
  if(typeof d.notes === "string"){
    if(d.notes.trim()) (d.mur = d.mur || []).push({ id:uid(), titre:"", texte:d.notes });
    delete d.notes;
  }
  d.mur = d.mur || [];
  const c = catDe(d.categorie_id);
  const tousDuDossier = db.taches.filter(t => t.dossier_id === d.id);
  const toutes = tousDuDossier.filter(passeSphere);
  const masquees = tousDuDossier.length - toutes.length;
  const ech_ = toutes.filter(t => t.statut !== "done" && t.date_due).sort((a,b) => a.date_due.localeCompare(b.date_due));
  const todo = toutes.filter(t => t.statut !== "done" && !t.date_due);
  const fait = toutes.filter(t => t.statut === "done").sort((a,b) => (b.fait_le||"").localeCompare(a.fait_le||""));
  const meta = [];
  if(c) meta.push(`<span class="puce">${ech(c.nom)}</span>`);
  if(d.identifiant) meta.push(`<span class="puce">id ${ech(d.identifiant)}</span>`);
  if(d.contrat) meta.push(`<span class="puce">n° ${ech(d.contrat)}</span>`);
  if(parMoisDossier(d)) meta.push(`<span class="puce date">${euro(parMoisDossier(d),2)} par mois</span>`);
  if(d.url) meta.push(`<a class="lien" href="${ech(d.url)}" target="_blank" rel="noopener">Ouvrir le site ↗</a>`);

  const h = [`<button class="retour" data-act="fermerDossier">← Suivi</button>`,
    `<div class="entete-d"><h1 class="titre">${ech(d.nom)}</h1>
      <button class="btn mini creux" data-dossier="${d.id}" data-act="editer">Modifier la fiche</button></div>`,
    meta.length ? `<div class="meta" style="margin:0 0 22px">${meta.join("")}</div>` : `<div style="height:16px"></div>`];

  const lgs = lignesDe(d);
  if(masquees) h.push(`<button class="filet-rappel doux" data-sphere="${sphere()==="travail"?"perso":"travail"}"
      style="margin:0 0 14px">${masquees} tâche${masquees>1?"s":""} ${sphere()==="travail"?"perso":"de travail"}
      ${masquees>1?"sont masquées":"est masquée"} — passer en ${sphere()==="travail"?"perso":"travail"}</button>`);

  h.push(`<div class="oeil">Charges${lgs.length?` <span class="cpt">${euro(parMoisDossier(d),2)} / mois</span>`:""}</div>`);
  h.push(lgs.length ? enFiche(lgs.map(l => `<div class="ligne" data-charge="${l.id}" data-dossier="${d.id}">
      <div class="jour-prel">${l.jour ? String(l.jour).padStart(2,"0") : "—"}</div>
      <div class="corps"><div class="intitule">${ech(l.libelle)}</div>
        <div class="meta"><span class="puce">${ech(l.periodicite)}</span>
          ${PERIODES[l.periodicite] > 1 ? `<span class="puce date">${euro(l.montant,2)}${
            l.mois ? ` · le ${l.jour} ${MOIS[l.mois-1]}` : ""}</span>` : ""}
          ${PERIODES[l.periodicite] > 1 && !l.mois ? `<span class="puce chaud">mois à préciser</span>` : ""}</div></div>
      <div class="somme">${euro(parMois(l),2)}</div>
      <div class="outils"><button class="ico" data-act="editerCharge">✎</button>
        <button class="ico sup" data-act="jeterCharge">✕</button></div></div>`))
    : vide("Aucune charge", "Un même dossier peut porter plusieurs lignes distinctes."));
  h.push(`<div style="margin:9px 0 0"><button class="btn mini creux" data-act="nouvelleCharge" data-dossier="${d.id}">Ajouter une charge</button></div>`);

  h.push(`<div class="oeil">Échéances${ech_.length?` <span class="cpt">${ech_.length}</span>`:""}</div>`);
  h.push(ech_.length ? enFiche(ech_.map(t => ligneTache(t, { sansDossier:true, veille:true })))
    : vide("Aucune échéance"));

  h.push(`<div class="oeil">À faire${todo.length?` <span class="cpt">${todo.length}</span>`:""}</div>`);
  /* Les mêmes filtres de contexte que dans l'onglet Tâches : dans un gros
     dossier, savoir ce qui se fait au téléphone ou dehors change tout. */
  const ctxPresents = db.contextes.filter(c => todo.some(t => t.contexte_id === c.id));
  if(ctxPresents.length > 1){
    h.push(`<div class="filtres">
      <button class="filtre ${!vue.filtreCtxDoss?"on":""}" data-fctxdoss="">Tout <span class="n">${todo.length}</span></button>
      ${ctxPresents.map(c => `<button class="filtre ${vue.filtreCtxDoss===c.id?"on":""}" data-fctxdoss="${c.id}">${ech(c.nom)}
        <span class="n">${todo.filter(t => t.contexte_id === c.id).length}</span></button>`).join("")}
    </div>`);
  }
  h.push(`<div class="saisie" style="margin-top:0">
    <input id="saisieDoss" data-dossier="${d.id}" placeholder="Ajouter au dossier…" autocomplete="off" enterkeyhint="done">
    <button class="btn" data-act="ajouterDoss" data-dossier="${d.id}">Ajouter</button></div>`);
  const todoVus = todo.filter(t => !vue.filtreCtxDoss || t.contexte_id === vue.filtreCtxDoss);
  h.push(todoVus.length ? enFiche(todoVus.map(t => ligneTache(t, { sansDossier:true })))
    : vide(todo.length ? "Rien dans ce contexte" : "Liste vide",
           todo.length ? "Choisissez « Tout » pour revoir l'ensemble." : "La flèche ↑ remonte une tâche dans l'inbox."));

  if(fait.length){
    const jj = jourISO();
    const duJour = fait.filter(t => t.fait_le === jj);
    h.push(`<div class="oeil" style="cursor:pointer" data-act="basculerFaites">Historique <span class="cpt">${fait.length}</span> ${vue.voirFaites?"−":"+"}</div>`);
    /* Ce qui vient d'être réglé reste visible sans avoir à déplier :
       une tâche cochée ne doit jamais sembler s'être volatilisée. */
    if(vue.voirFaites) h.push(enFiche(fait.slice(0,40).map(t => ligneTache(t, { sansDossier:true, reglee:true }))));
    else if(duJour.length) h.push(enFiche(duJour.map(t => ligneTache(t, { sansDossier:true, reglee:true }))));
  }

  /* Le mur de notes ferme la fiche : mêmes cartes titrées que dans un
     Projet — un dossier comme le van peut avoir sa fiche entretien, sa
     fiche kilométrage, etc. */
  d.mur = d.mur || [];
  h.push(`<div class="oeil">Notes</div>`);
  h.push(`<div class="mur-notes">${d.mur.map(n => `
    <button class="carte-note" data-act="ouvrirNoteGrand" data-genre="dossier" data-parent="${d.id}" data-note="${n.id}">
      ${n.titre ? `<b>${n.piece_jointe ? "📎 " : ""}${ech(n.titre)}</b>` : (n.piece_jointe ? `<b>📎</b>` : "")}<p>${ech(n.texte)}</p>
    </button>`).join("")}
    <button class="carte-note carte-note-plus" data-act="ouvrirNoteGrand" data-genre="dossier" data-parent="${d.id}" title="Nouvelle note" aria-label="Nouvelle note">+</button>
  </div>`);
  return h.join("");
}

/* ---- Listes pense-bêtes ---- */
/* Une liste vit pour elle-même : cocher une case n'a aucun effet sur le
   texte, qui reste en place. C'est un aide-mémoire visuel — pas une tâche
   qui se range. Seule la flèche ↑, explicitement, fait naître une vraie
   tâche dans « À faire ». Une ligne tapée en terminant par « : » devient un
   titre de section plutôt qu'une case à cocher. */
function vueListesPage(){
  const h = [`<button class="retour" data-act="fermerListes">← Suivi</button>`,
    `<div class="entete-d"><h1 class="titre">Listes</h1>
      <button class="btn mini" data-act="nouvelleListe">Nouvelle liste</button></div>`,
    `<div style="height:16px"></div>`];
  if(!db.listes.length)
    return h.join("") + vide("Aucune liste", "Créez une liste pense-bête : courses, voyage, sport…");
  h.push(`<div class="fiche liste rangeable-listes">${[...db.listes].sort((a,b) => (a.ordre ?? 1e9) - (b.ordre ?? 1e9)).map(l => {
    const items = (l.items||[]).filter(i => !i.titre);
    const coches = items.filter(i => i.coche).length;
    return `<div class="ligne" data-liste="${l.id}">
      ${db.listes.length > 1 ? `<button class="poignee" data-glisserliste="${l.id}" title="Glisser pour réordonner" aria-label="Déplacer">⠿</button>` : ""}
      <div class="corps">
        <button class="nom" data-act="ouvrirListe" style="font-weight:580;background:none;border:0;padding:0;text-align:left">${ech(l.nom)}</button>
        ${items.length ? `<div class="marque-tache ligne-seule">${coches}/${items.length} coché${coches>1?"s":""}</div>`
                        : `<div class="note-min">Vide</div>`}
      </div>
      <div class="outils"><button class="ico" data-act="editerNomListe">✎</button>
        <button class="ico sup" data-act="jeterListe">✕</button></div>
    </div>`;
  }).join("")}</div>`);
  h.push(piedAide([
    "Ouvrez une liste pour cocher au fil de l'eau ; une ligne tapée en terminant par <b>:</b> devient un titre de section.",
    db.listes.length > 1 ? "La poignée <b>⠿</b> glisse une carte pour changer l'ordre des listes." : null,
  ].filter(Boolean)));
  return h.join("");
}

function vueListeOuverte(){
  const l = (db.listes||[]).find(x => x.id === vue.liste);
  if(!l){ vue.liste = null; return vueListesPage(); }
  l.items = l.items || [];
  const items = l.items.filter(i => !i.titre);
  const coches = items.filter(i => i.coche).length;
  /* Une case tapée après avoir touché un titre rejoint cette section plutôt
     que la fin de la liste — sinon retrouver un oubli sous « Papiers » des
     mois plus tard obligeait à tout retaper au bon endroit à la main. */
  const cible = vue.sectionActive ? l.items.find(i => i.titre && i.id === vue.sectionActive) : null;
  if(!cible) vue.sectionActive = null;

  const h = [`<button class="retour" data-act="fermerListe">← Listes</button>`,
    `<div class="entete-d"><h1 class="titre">${ech(l.nom)}</h1>
      <button class="btn mini creux" data-liste="${l.id}" data-act="editerNomListe">Renommer</button></div>`,
    items.length ? `<div class="meta" style="margin:0 0 18px">
        <span class="puce">${coches}/${items.length} coché${coches>1?"s":""}</span></div>`
      : `<div style="height:16px"></div>`];

  h.push(`<div class="saisie">
    <input id="itemListeSaisie" data-liste="${l.id}"
      placeholder="${cible ? `Ajouter dans « ${ech(cible.texte)} »…` : "Ajouter un élément… (terminez par : pour un titre)"}"
      autocomplete="off" enterkeyhint="done">
    <button class="btn" data-act="ajouterItemListe" data-liste="${l.id}">Ajouter</button></div>`);

  const filets = [];
  if(cible) filets.push(`<button class="btn mini creux" data-act="choisirSectionListe" data-liste="${l.id}" data-item="${cible.id}">
      Ajout dans « ${ech(cible.texte)} » — revenir en fin de liste</button>`);
  if(coches > 0) filets.push(`<button class="btn mini creux" data-liste="${l.id}" data-act="toutDecocherListe">Tout décocher</button>`);
  if(filets.length) h.push(`<div style="margin:0 0 14px;display:flex;gap:8px;flex-wrap:wrap">${filets.join("")}</div>`);

  if(!l.items.length){
    h.push(vide("Liste vide", "Tapez un élément puis Entrée : il rejoint la liste ci-dessous."));
    return h.join("");
  }

  h.push(`<div class="fiche liste rangeable-items">${l.items.map(it => {
    if(it.titre){
      const actif = vue.sectionActive === it.id;
      return `<div class="ligne" data-item="${it.id}" data-liste="${l.id}">
      <div class="corps">
        <button class="intitule" data-act="choisirSectionListe" title="Ajouter la suite ici"
          style="font-weight:650;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:${actif?"var(--accent)":"inherit"}">
          ${ech(it.texte)}${actif ? " · ajout ici" : ""}</button>
      </div>
      <div class="outils">
        <button class="ico" data-act="editerItem" title="Renommer">✎</button>
        <button class="ico sup" data-act="supprimerItem" title="Supprimer le titre">✕</button>
      </div>
    </div>`;
    }
    return `<div class="ligne ${it.coche?"faite":""}" data-item="${it.id}" data-liste="${l.id}">
      <button class="poignee" data-glisseritem="${it.id}" title="Glisser pour réordonner" aria-label="Déplacer">⠿</button>
      <div class="cases">
        <button class="case carre ${it.coche?"coche":""}" data-act="basculerItem" title="Cocher" aria-label="Cocher">${CHECK}</button>
        <button class="case fleche" data-act="remonterItem" title="Faire remonter dans « À faire »" aria-label="Faire remonter dans À faire">↑</button>
      </div>
      <div class="corps"><div class="intitule">${ech(it.texte)}</div></div>
      <div class="outils">
        <button class="ico" data-act="editerItem" title="Renommer">✎</button>
        <button class="ico sup" data-act="supprimerItem" title="Supprimer">✕</button>
      </div>
    </div>`;
  }).join("")}</div>`);

  h.push(piedAide([
    "Cocher ne change rien d'autre : le texte reste en place, c'est un simple repère visuel.",
    "La flèche <b>↑</b> crée une tâche dans « À faire » — utile pour ce qu'il manque encore.",
    "Touchez un titre pour y ajouter la suite ; touchez-le à nouveau pour revenir en fin de liste.",
    "La poignée <b>⠿</b> déplace un élément par glisser-déposer, y compris vers une autre section.",
  ]));
  return h.join("");
}

/* ---- Projets ---- */
/* Un projet suit un coût qui s'accumule (van à construire, voyage à
   anticiper) — à ne jamais confondre avec un Dossier, qui lui suit une
   charge réelle déjà en cours. Ses lignes n'ont donc aucune périodicité et
   ne passent jamais par toutesLignes()/totalCharges() : ce total n'entre
   jamais dans le calcul du budget réel. */
const totalProjet = p => (p.lignes||[]).reduce((s,l) => s + (l.montant||0), 0);

function vueProjetsPage(){
  const h = [`<button class="retour" data-act="fermerProjets">← Suivi</button>`,
    `<div class="entete-d"><h1 class="titre">Projets</h1>
      <button class="btn mini" data-act="nouveauProjet">Nouveau projet</button></div>`,
    `<div style="height:16px"></div>`];
  if(!db.projets.length)
    return h.join("") + vide("Aucun projet", "Suivez un coût qui s'accumule, sans qu'il compte dans votre budget réel.");
  h.push(`<div class="fiche liste rangeable-projets">${[...db.projets].sort((a,b) => (a.ordre ?? 1e9) - (b.ordre ?? 1e9)).map(p => {
    const t = totalProjet(p);
    return `<div class="ligne" data-projet="${p.id}">
      ${db.projets.length > 1 ? `<button class="poignee" data-glisserprojet="${p.id}" title="Glisser pour réordonner" aria-label="Déplacer">⠿</button>` : ""}
      <div class="corps">
        <button class="nom" data-act="ouvrirProjet" style="font-weight:580;background:none;border:0;padding:0;text-align:left">${ech(p.nom)}</button>
        <div class="note-min">${(p.lignes||[]).length ? `${(p.lignes||[]).length} ligne${(p.lignes||[]).length>1?"s":""} · ${euro(t,2)}` : "Vide"}</div>
      </div>
      <div class="outils"><button class="ico" data-act="editerNomProjet">✎</button>
        <button class="ico sup" data-act="jeterProjet">✕</button></div>
    </div>`;
  }).join("")}</div>`);
  h.push(piedAide([
    "Un projet suit un coût à part — jamais compté dans le budget réel du Suivi.",
    db.projets.length > 1 ? "La poignée <b>⠿</b> glisse une carte pour changer l'ordre des projets." : null,
  ].filter(Boolean)));
  return h.join("");
}

function vueProjetOuvert(){
  const p = (db.projets||[]).find(x => x.id === vue.projet);
  if(!p){ vue.projet = null; return vueProjetsPage(); }
  p.lignes = p.lignes || [];
  p.taches = p.taches || [];
  if(typeof p.notes === "string"){
    if(p.notes.trim()) (p.mur = p.mur || []).push({ id:uid(), titre:"", texte:p.notes });
    delete p.notes;
  }
  p.mur = p.mur || [];
  const t = totalProjet(p);
  const items = p.taches.filter(x => !x.titre);
  const nFaites = items.filter(x => x.coche).length;
  /* Même mécanique de section active que dans une Liste, mais sa propre
     variable : un projet et une liste ne partagent jamais leur cible. */
  const cible = vue.sectionActiveProjet ? p.taches.find(x => x.titre && x.id === vue.sectionActiveProjet) : null;
  if(!cible) vue.sectionActiveProjet = null;

  const h = [`<button class="retour" data-act="fermerProjet">← Projets</button>`,
    `<div class="entete-d"><h1 class="titre">${ech(p.nom)}</h1>
      <button class="btn mini creux" data-projet="${p.id}" data-act="editerNomProjet">Renommer</button></div>`,
    `<div class="meta" style="margin:0 0 18px"><span class="puce">${euro(t,2)} de dépenses</span>${
      items.length ? `<span class="puce">${nFaites}/${items.length} tâches</span>` : ""}</div>`];

  /* ---------- Dépenses ---------- */
  h.push(`<div class="oeil">Dépenses</div>`);
  h.push(`<div style="margin:0 0 12px"><button class="btn mini" data-projet="${p.id}" data-act="ajouterLigneProjet">+ Ajouter une dépense</button></div>`);
  if(!p.lignes.length){
    h.push(`<p class="petit-detail" style="margin:0 0 20px">Rien pour l'instant.</p>`);
  }else{
    h.push(`<div class="fiche liste" style="margin-bottom:20px">${[...p.lignes].sort((a,b) => (b.date||"").localeCompare(a.date||"")).map(l => `
      <div class="ligne" data-ligneprojet="${l.id}" data-projet="${p.id}">
        <div class="corps"><div class="intitule">${ech(l.libelle)}</div>
          ${l.date ? `<div class="meta"><span class="puce">${dateCourte(l.date)}</span></div>` : ""}</div>
        <div class="somme">${euro(l.montant,2)}</div>
        <div class="outils"><button class="ico" data-act="editerLigneProjet" title="Modifier">✎</button>
          <button class="ico sup" data-act="jeterLigneProjet" title="Supprimer">✕</button></div>
      </div>`).join("")}</div>`);
  }

  /* ---------- À faire ---------- */
  /* Même esprit que dans une Liste : cocher ne fait rien d'autre que
     visuel, la flèche ↑ seule crée une vraie tâche dans « À faire »,
     titres de section et glisser-déposer repris à l'identique. */
  h.push(`<div class="oeil">À faire</div>`);
  h.push(`<div class="saisie" style="margin-bottom:12px">
    <input id="tacheProjetSaisie" data-projet="${p.id}"
      placeholder="${cible ? `Ajouter dans « ${ech(cible.texte)} »…` : "Ajouter une tâche… (terminez par : pour un titre)"}"
      autocomplete="off" enterkeyhint="done">
    <button class="btn" data-act="ajouterTacheProjet" data-projet="${p.id}">Ajouter</button></div>`);

  if(cible) h.push(`<div style="margin:0 0 14px"><button class="btn mini creux" data-act="choisirSectionProjet" data-projet="${p.id}" data-tacheprojet="${cible.id}">
      Ajout dans « ${ech(cible.texte)} » — revenir en fin de liste</button></div>`);

  if(!p.taches.length){
    h.push(`<p class="petit-detail" style="margin:0 0 20px">Rien pour l'instant.</p>`);
  }else{
    h.push(`<div class="fiche liste rangeable-taches-projet" style="margin-bottom:20px">${p.taches.map(x => {
      if(x.titre){
        const actif = vue.sectionActiveProjet === x.id;
        return `<div class="ligne" data-tacheprojet="${x.id}" data-projet="${p.id}">
        <div class="corps">
          <button class="intitule" data-act="choisirSectionProjet" title="Ajouter la suite ici"
            style="font-weight:650;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:${actif?"var(--accent)":"inherit"}">
            ${ech(x.texte)}${actif ? " · ajout ici" : ""}</button>
        </div>
        <div class="outils">
          <button class="ico" data-act="editerTacheProjet" title="Renommer">✎</button>
          <button class="ico sup" data-act="supprimerTacheProjet" title="Supprimer le titre">✕</button>
        </div>
      </div>`;
      }
      return `<div class="ligne ${x.coche?"faite":""}" data-tacheprojet="${x.id}" data-projet="${p.id}">
        <button class="poignee" data-glissertacheprojet="${x.id}" title="Glisser pour réordonner" aria-label="Déplacer">⠿</button>
        <div class="cases">
          <button class="case carre ${x.coche?"coche":""}" data-act="basculerTacheProjet" title="Cocher" aria-label="Cocher">${CHECK}</button>
          <button class="case fleche" data-act="remonterTacheProjet" title="Faire remonter dans « À faire »" aria-label="Faire remonter dans À faire">↑</button>
        </div>
        <div class="corps"><div class="intitule">${ech(x.texte)}</div></div>
        <div class="outils">
          <button class="ico" data-act="editerTacheProjet" title="Renommer">✎</button>
          <button class="ico sup" data-act="supprimerTacheProjet" title="Supprimer">✕</button>
        </div>
      </div>`;
    }).join("")}</div>`);
  }

  /* ---------- Notes ---------- */
  /* Un mur de notes titrées plutôt qu'une seule zone de texte : plusieurs
     petites choses à noter (vol, contact, idée) valent mieux séparées que
     bout à bout dans un même pavé. */
  h.push(`<div class="oeil">Notes</div>`);
  h.push(`<div class="mur-notes">${p.mur.map(n => `
    <button class="carte-note" data-act="ouvrirNoteGrand" data-genre="projet" data-parent="${p.id}" data-note="${n.id}">
      ${n.titre ? `<b>${n.piece_jointe ? "📎 " : ""}${ech(n.titre)}</b>` : (n.piece_jointe ? `<b>📎</b>` : "")}<p>${ech(n.texte)}</p>
    </button>`).join("")}
    <button class="carte-note carte-note-plus" data-act="ouvrirNoteGrand" data-genre="projet" data-parent="${p.id}" title="Nouvelle note" aria-label="Nouvelle note">+</button>
  </div>`);

  h.push(piedAide([
    "Les dépenses de ce projet ne sont jamais comptées dans le budget réel — un projet vit à part.",
    "Cocher une tâche ne change rien d'autre ; la flèche ↑ seule crée une vraie tâche dans « À faire ».",
    "Touchez un titre pour y ajouter la suite ; la poignée ⠿ déplace une tâche, y compris vers une autre section.",
  ]));
  return h.join("");
}

/* ---- Commandes en cours ---- */
/* Une seule liste plate, triée par date estimée croissante (la plus proche
   en premier) : pas besoin d'un système à deux niveaux comme Listes/Projets
   puisqu'on ne suit qu'un seul ensemble de commandes à la fois. */
function vueCommandesPage(){
  const h = [`<button class="retour" data-act="fermerCommandes">← Suivi</button>`,
    `<div class="entete-d"><h1 class="titre">Commandes</h1>
      <button class="btn mini" data-act="nouvelleCommande">Nouvelle commande</button></div>`,
    `<div style="height:16px"></div>`];
  if(!db.commandes.length)
    return h.join("") + vide("Aucune commande en cours", "De quoi ne plus rouvrir dix mails pour vérifier où ça en est.");
  const tri = [...db.commandes].sort((a,b) => {
    if(!!a.recue !== !!b.recue) return a.recue ? 1 : -1;   // reçues en bas
    return (a.date_estimee||"9999").localeCompare(b.date_estimee||"9999");
  });
  h.push(`<div class="fiche liste">${tri.map(cmd => {
    const retard = !cmd.recue && cmd.date_estimee && cmd.date_estimee < jourISO();
    return `<div class="ligne ${cmd.recue?"faite":""}" data-commande="${cmd.id}" data-act="editerCommande">
      <button class="case carre ${cmd.recue?"coche":""}" data-act="basculerCommande" title="Marquer reçue" aria-label="Marquer reçue">${CHECK}</button>
      <div class="corps"><div class="intitule">${ech(cmd.nom)}</div>
        <div class="meta">
          ${cmd.boutique ? `<span class="puce ctx">${ech(cmd.boutique)}</span>` : ""}
          ${cmd.date_estimee ? `<span class="puce ${retard?"chaud":""}">${retard?"attendue le ":"prévue le "}${dateCourte(cmd.date_estimee)}</span>` : ""}
        </div></div>
      <div class="outils"><button class="ico" data-act="editerCommande" title="Modifier">✎</button>
        <button class="ico sup" data-act="jeterCommande" title="Supprimer">✕</button></div>
    </div>`;
  }).join("")}</div>`);
  h.push(piedAide([
    "Cocher marque la commande reçue sans la supprimer — elle passe simplement en bas, barrée.",
  ]));
  return h.join("");
}

/* ---- Garanties ---- */
/* Même esprit que Commandes : une liste courte, triée par urgence — ici la
   date de fin de garantie plutôt qu'une date de livraison. La pièce jointe
   (photo de la facture) est précisément ce qui rend cette liste utile le
   jour où on doit faire valoir une garantie. */
function vueGarantiesPage(){
  const j = jourISO();
  const h = [`<button class="retour" data-act="fermerGaranties">← Suivi</button>`,
    `<div class="entete-d"><h1 class="titre">Garanties</h1>
      <button class="btn mini" data-act="nouvelleGarantie">Nouvelle garantie</button></div>`,
    `<div style="height:16px"></div>`];
  if(!db.garanties.length)
    return h.join("") + vide("Aucune garantie enregistrée", "La facture agrafée ici, plus besoin de la retrouver le jour où elle sert.");

function rendreAstroJour(dateISO){
  const a = astroCache.jours[dateISO];

function rendreAstroPeriode(debut, fin){
  /* Un trait très discret sous une planète qui se lève en première partie
     de soirée (jusqu'à 23h30) — une planète qui se lève à 3h du matin est
     « visible », mais l'observer suppose de rester debout très tard, ce
     qui n'est pas très réaliste. Uniquement ici, dans la vue période :
     ni en Accueil, ni dans le détail d'un seul jour. */
  function levePremierePartieNuit(heureLever){
    if(!heureLever) return false;
    const [h, m] = heureLever.split(":").map(Number);
    return h >= 12 && (h < 23 || (h === 23 && m <= 30));
  }
  if(debut > fin) [debut, fin] = [fin, debut];
  const jours = [];
  let curseur = debut, garde = 0;
  while(curseur <= fin && garde++ < 62){ jours.push(curseur); curseur = ajouterPeriode(curseur, 1, "jour"); }
  if(garde >= 62) jours.push("…");
  return `<div class="fiche liste">${jours.map(d => {
    if(d === "…") return `<div class="ligne"><div class="corps"><div class="petit-detail">Période limitée à 62 nuits par affichage.</div></div></div>`;
    const a = astroCache.jours[d];
    if(!a) return `<div class="ligne"><div class="corps"><div class="intitule">${dateCourte(d)}</div>
      <div class="petit-detail">Pas de données</div></div></div>`;
    const visibles = PLANETES_ASTRO.filter(p => a.planetes[p]?.visible);
    return `<div class="ligne" data-act="astroVoirJourDepuisPeriode" data-jour="${d}">
      <div class="corps"><div class="intitule">${dateCourte(d)}</div></div>
      <div class="outils" style="display:flex;align-items:center;gap:6px;padding-bottom:11px">
        ${svgLune(a.lune.phase, 15)}
        ${visibles.length ? visibles.map(p => {
          const souligne = levePremierePartieNuit(a.planetes[p].lever);
          return souligne
            ? `<span class="astro-env" title="Se lève avant 23h30">${iconePlanete(p, 15)}<span class="astro-trait"></span></span>`
            : `<span class="astro-env">${iconePlanete(p, 15)}</span>`;
        }).join("") : `<span class="petit-detail">rien de notable</span>`}
      </div>
    </div>`;
  }).join("")}</div>
  <p class="petit-detail" style="margin:10px 2px 0">Un petit trait sous une planète signifie qu'elle se lève avant 23h30 — une observation plus réaliste que d'attendre tard dans la nuit.</p>`;
}

/* Remplace l'ancienne petite boîte de dialogue pour les notes de Projets et
   Dossiers : sur téléphone, un textarea de 74px dans une fenêtre modale
   était trop juste pour écrire confortablement. Ici, toute la page est à
   disposition, et tout s'enregistre au fil de la frappe — pas de bouton
   "Enregistrer" à chercher. */
function vueNoteOuverte(){
  const ref = vue.noteOuverte;
  const parentDe = () => ref.genre === "projet" ? (db.projets||[]).find(x => x.id === ref.parentId) : dossDe(ref.parentId);
  const retourVersParent = () => { vue.noteOuverte = null; return ref.genre === "projet" ? vueProjetOuvert() : vueDossier(); };
  const parent = parentDe();
  if(!parent) return retourVersParent();
  parent.mur = parent.mur || [];
  const n = ref.noteId ? parent.mur.find(x => x.id === ref.noteId) : null;
  if(ref.noteId && !n) return retourVersParent();
  const titre = n ? n.titre : "", texte = n ? n.texte : "";

  return `<button class="retour" data-act="fermerNote">← ${ech(parent.nom)}</button>
    <input id="noteTitreGrand" value="${ech(titre)}" placeholder="Titre de la note"
      data-genre="${ref.genre}" data-parent="${ref.parentId}" data-note="${ref.noteId || ""}"

let dernierEcran = { onglet:null, dossier:null, mois:null, decalage:null, sphere:null };

function rendre(){
  figerSaisieEnCours();
  rendreNav();
  const cible = document.getElementById("vue");
  /* On ne remonte en haut que si l'on a changé d'écran. */
  const memeEcran = dernierEcran.onglet === vue.onglet && dernierEcran.dossier === vue.dossier
    && dernierEcran.mois === vue.moisAgenda && dernierEcran.decalage === vue.decalage
    && dernierEcran.sphere === sphere();
  const y = window.scrollY || window.pageYOffset || 0;
  dernierEcran = { onglet:vue.onglet, dossier:vue.dossier, mois:vue.moisAgenda,
                   decalage:vue.decalage, sphere:sphere() };
  const a = document.activeElement;
  const gardes = ["saisie","saisieDoss","dep-montant","dep-libelle","tacheProjetSaisie","noteTitreGrand","noteTexteGrand"];
  const memo = a && gardes.includes(a.id) ? { id:a.id, val:a.value, pos:a.selectionStart } : null;

  cible.innerHTML = vue.coherenceSeance ? vueSeanceCoherence() : ({ accueil:vueAccueil, taches:vueTaches, echeances:vueEcheances, agenda:vueAgenda,
                       budget:vueBudget, suivi:vueSuivi, reglages:vueReglages })[vue.onglet]();

  if(memo){
    const e = document.getElementById(memo.id);
    if(e){ e.value = memo.val; e.focus(); try{ e.setSelectionRange(memo.pos, memo.pos); }catch(x){} }
  }else if(memeEcran){
    /* On reste au même endroit : cocher une tâche en bas de liste ne doit
       pas renvoyer en haut de page. */
    window.scrollTo({ top:y, behavior:"instant" });
  }else{
    window.scrollTo({ top:0, behavior:"instant" });
  }
  /* On amène l'écran sur l'élément qu'on vient de créer et on le fait
     clignoter une seconde : plus de doute sur « est-ce que c'est enregistré ». */
  if(vue.surligne){
    const n = document.querySelector(`[data-tache="${vue.surligne}"], [data-rdv="${vue.surligne}"],
      [data-rentree="${vue.surligne}"], [data-dossier="${vue.surligne}"], [data-depense="${vue.surligne}"],
      [data-jourdate="${vue.surligne}"]`);
    vue.surligne = null;
    if(n){
      n.classList.add("neuf");
      /* On ne défile que si l'élément est hors de vue : sinon le simple fait
         d'ajouter une tâche visible ferait bouger la page pour rien. */
      try{
        const r = n.getBoundingClientRect();
        /* Pendant un rangement, la page ne doit pas bouger sous le doigt. */
        if(!vue.rangement && (r.top < 60 || r.bottom > (window.innerHeight || 800) - 60))
          n.scrollIntoView({ block:"center", behavior:"smooth" });
      }catch(e){}
      setTimeout(() => n.classList.remove("neuf"), 1600);
    }
  }
  rafraichirBadge();
}

const dlg = document.getElementById("dlg");
const dlgApercu = document.getElementById("dlgApercu");
function formulaire(titre, champs, valeurs, onOk, onSup, extra){
  const ligne = c => {
    const v = valeurs[c.cle] ?? c.defaut ?? "";
    if(c.type === "select")
      return `<label class="champ"><span>${c.nom}</span><select name="${c.cle}">
        ${c.options.map(o => `<option value="${ech(o.v)}" ${String(o.v)===String(v)?"selected":""}>${ech(o.n)}</option>`).join("")}</select></label>`;
    if(c.type === "textarea")
      return `<label class="champ"><span>${c.nom}</span><textarea name="${c.cle}" placeholder="${ech(c.ph||"")}">${ech(v)}</textarea></label>`;
    return `<label class="champ"><span>${c.nom}</span><input name="${c.cle}" type="${c.type||"text"}"
      ${c.step?`step="${c.step}"`:""} ${c.min!=null?`min="${c.min}"`:""} ${c.mode?`inputmode="${c.mode}"`:""}
      value="${ech(v)}" placeholder="${ech(c.ph||"")}"></label>`;
  };
  const corps = [];
  for(let i = 0; i < champs.length; i++){
    if(champs[i].duo && champs[i+1]){ corps.push(`<div class="duo">${ligne(champs[i])}${ligne(champs[i+1])}</div>`); i++; }
    else corps.push(ligne(champs[i]));
  }
  dlg.innerHTML = `<form method="dialog">
    <div class="dlg-t">${ech(titre)}</div>
    <div class="dlg-c">${corps.join("")}${extra || ""}</div>
    <div class="dlg-p">
      ${onSup ? `<button type="button" class="btn mini danger esp" id="dlgSup">Supprimer</button>` : ""}
      <button type="button" class="btn mini creux" id="dlgNon">Annuler</button>
      <button type="submit" class="btn mini">Enregistrer</button>
    </div></form>`;
  const f = dlg.querySelector("form");
  f.onsubmit = ev => { ev.preventDefault();
    const d = {}; new FormData(f).forEach((v,k) => d[k] = typeof v === "string" ? v.trim() : v);
    dlg.close(); onOk(d); };
  dlg.querySelector("#dlgNon").onclick = () => dlg.close();
  if(onSup) dlg.querySelector("#dlgSup").onclick = () => { dlg.close(); onSup(); };
  /* Si une fenêtre est restée ouverte, showModal() échoue en silence et le
     formulaire ne paraît pas : il fallait alors s'y reprendre plusieurs fois. */
  try{ if(dlg.open) dlg.close(); dlg.showModal(); }
  catch(e){ try{ dlg.close(); dlg.showModal(); }catch(x){} }
  setTimeout(() => dlg.querySelector("input,select,textarea")?.focus(), 40);
}

/* Calculatrice simple : logique « pas à pas », pas d'évaluation de chaîne
   (pas d'eval), pour rester aussi sobre et sûr que le reste de l'appli.
   Câblée à la main comme formulaire(), en dehors du grand aiguillage des
   data-act, puisqu'elle vit entièrement dans son propre dialogue. */
function ouvrirCalculatrice(){
  let val = "0", precedent = null, operateur = null, nouveauNombre = true;

  const affiche = () => {
    const e = dlg.querySelector("#calcEcran");
    if(e) e.textContent = val.length > 12 ? Number(val).toExponential(6) : val;
  };
  const calc = (a, b, op) => {
    switch(op){
      case "+": return a + b;
      case "−": return a - b;
      case "×": return a * b;
      case "÷": return b === 0 ? NaN : a / b;
      default: return b;
    }
  };
  const chiffre = d => {
    if(nouveauNombre || val === "0"){ val = d; nouveauNombre = false; }
    else if(val.length < 15) val += d;
  };
  const point = () => {
    if(nouveauNombre){ val = "0."; nouveauNombre = false; return; }
    if(!val.includes(".")) val += ".";
  };
  const poserOperateur = op => {
    if(operateur && !nouveauNombre){
      const r = calc(precedent, Number(val), operateur);
      val = String(Number.isFinite(r) ? Math.round(r * 1e10) / 1e10 : "Erreur");
      precedent = Number(val);
    }else{
      precedent = Number(val);
    }
    operateur = op;
    nouveauNombre = true;
  };
  const egal = () => {
    if(operateur == null) return;
    const r = calc(precedent, Number(val), operateur);
    val = String(Number.isFinite(r) ? Math.round(r * 1e10) / 1e10 : "Erreur");
    operateur = null; precedent = null; nouveauNombre = true;
  };
  const effacer = () => { val = "0"; precedent = null; operateur = null; nouveauNombre = true; };
  const pourcent = () => { val = String(Number(val) / 100); nouveauNombre = true; };
  const signe = () => { if(val !== "0") val = val.startsWith("-") ? val.slice(1) : "-" + val; };

  const rangee = boutons => `<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px">
    ${boutons.join("")}</div>`;
  const bt = (label, calcAttr, style) => `<button type="button" class="btn ${style||"creux"}" data-calc="${calcAttr}"
    style="padding:14px 0;font-size:17px">${label}</button>`;

  dlg.innerHTML = `<form method="dialog">
    <div class="dlg-t">Calculatrice</div>
    <div class="dlg-c">
      <div id="calcEcran" style="font-family:var(--mono);font-size:30px;text-align:right;
        padding:16px 12px;background:var(--fiche);border-radius:var(--r);overflow-x:auto;
        white-space:nowrap;border:1px solid var(--filet)">0</div>
      ${rangee([bt("C","c"), bt("%","pourcent"), bt("±","signe"), bt("÷","op÷","")])}
      ${rangee([bt("7","7"), bt("8","8"), bt("9","9"), bt("×","op×","")])}
      ${rangee([bt("4","4"), bt("5","5"), bt("6","6"), bt("−","op−","")])}
      ${rangee([bt("1","1"), bt("2","2"), bt("3","3"), bt("+","op+","")])}
      <div style="display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin-top:8px">
        ${bt("0","0")}${bt(",","point")}${bt("=","egal","")}
      </div>
    </div>
    <div class="dlg-p"><button type="button" class="btn mini creux" id="dlgNon">Fermer</button></div>
  </form>`;

  dlg.querySelectorAll("[data-calc]").forEach(b => b.onclick = () => {
    const k = b.dataset.calc;
    if(k === "c") effacer();
    else if(k === "pourcent") pourcent();
    else if(k === "signe") signe();
    else if(k === "point") point();
    else if(k === "egal") egal();
    else if(k.startsWith("op")) poserOperateur(k.slice(2));
    else chiffre(k);
    affiche();
  });
  dlg.querySelector("#dlgNon").onclick = () => dlg.close();
  try{ if(dlg.open) dlg.close(); dlg.showModal(); }
  catch(e){ try{ dlg.close(); dlg.showModal(); }catch(x){} }
}
