<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E8E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<title>Carnet</title>
<style>
  :root{
    --papier:#E6E8E0; --fiche:#F1F2EC; --fiche-2:#E9EBE3;
    --encre:#1C2230; --encre-2:#5C6373; --encre-3:#8C93A0;
    --filet:#C7CABE; --filet-fort:#AEB2A4;
    --accent:#1E5A6E; --accent-pale:#DCE8EC;
    --rouge:#A8372B; --rouge-pale:#F6E3E0; --vert:#3D7A50;
    --r:10px;
    --ombre:0 1px 3px rgba(28,34,48,.07);
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    --btn-survol:#2A3144;
  }
  /* Mode nuit : on inverse juste la palette neutre (papier/encre/filet),
     l'accent choisi dans Réglages reste le même — pas une appli différente,
     la même, en sombre. */
  body.sombre{
    --papier:#1B1E23; --fiche:#24272D; --fiche-2:#2A2E34;
    --encre:#E7E8E3; --encre-2:#A3A9B1; --encre-3:#6E747C;
    --filet:#383C43; --filet-fort:#4B5058;
    --rouge:#D97767; --rouge-pale:#3A2620; --vert:#5FA876;
    --ombre:0 1px 3px rgba(0,0,0,.35);
    --btn-survol:#D5D6D0;
  }
  body.sombre dialog::backdrop{background:rgba(0,0,0,.55)}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--papier);color:var(--encre);font-family:var(--sans);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .app{display:flex;min-height:100dvh}
  .rail{width:196px;flex:none;border-right:1px solid var(--filet);padding:22px 0 22px 18px;position:sticky;top:0;height:100dvh}
  .marque{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--encre-2);margin-bottom:2px}
  .marque b{color:var(--accent);font-weight:700}
  /* Quatre teintes d'accent au choix, appliquées au chargement. */
  .jour{font-family:var(--mono);font-size:11.5px;color:var(--encre-3);margin-bottom:26px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav button{background:none;border:0;text-align:left;padding:7px 10px 7px 0;color:var(--encre-2);
    display:flex;align-items:baseline;gap:9px;border-radius:var(--r)}
  .nav button .n{font-family:var(--mono);font-size:10.5px;color:var(--encre-3)}
  .nav button .pastille{margin-left:auto;font-family:var(--mono);font-size:10.5px;
    background:var(--accent-pale);color:var(--accent);padding:0 5px;border-radius:8px}
  .nav button.on{color:var(--encre);font-weight:600}
  .nav button.on .n{color:var(--accent)}
  .nav button:hover{color:var(--encre)}

  main{flex:1;min-width:0;padding:26px 26px 90px;max-width:880px}
  .titre{font-size:26px;font-weight:640;letter-spacing:-.02em;margin:0 0 2px}
  .grand-jour{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:6px}
  .grand-jour .sem{font-size:19px;font-weight:500;color:var(--encre-2);text-transform:capitalize}
  .grand-jour .chiffre{font-family:var(--mono);font-size:46px;line-height:1;font-weight:500;
    letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .grand-jour .mois{font-size:22px;font-weight:400}
  .sous{color:var(--encre-2);font-size:13.5px;margin:0 0 22px}
  .oeil{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--encre-3);
    display:flex;align-items:center;gap:10px;margin:26px 0 9px}
  .oeil::after{content:"";flex:1;height:1px;background:var(--filet)}
  .oeil .cpt{color:var(--accent)}
  .oeil .a-droite{font-family:var(--mono);font-size:10.5px;color:var(--encre-3);order:3;letter-spacing:.06em}

  .fiche{background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r);box-shadow:var(--ombre)}
  .liste{display:flex;flex-direction:column}
  .liste>*+*{border-top:1px solid var(--filet)}

  .ligne{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;position:relative;background:var(--fiche)}
  .ligne:first-child{border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
  .ligne:last-child{border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}
  /* La poignée est le seul point de prise : ailleurs, le doigt fait défiler
     la page comme d'habitude. */
  /* Une prise assez large pour le pouce : sur téléphone, le mode rangement
     et ses flèches restent de toute façon le chemin le plus sûr. */
  .poignee{background:none;border:0;color:var(--filet-fort);font-size:19px;line-height:1;
    padding:10px 10px 10px 2px;flex:none;cursor:grab;touch-action:none;align-self:center}
  .poignee:hover{color:var(--encre-2)}
  .ligne.glisse{opacity:.55;background:var(--accent-pale)}
  .fleche-rang{background:var(--fiche-2);border:1.5px solid var(--filet-fort);border-radius:var(--r);
    color:var(--encre);font-size:15px;line-height:1;padding:9px 13px;margin-left:4px}
  .fleche-rang:hover{border-color:var(--accent);color:var(--accent)}
  .ligne.enrangement{background:var(--accent-pale)}
  .ligne.enrangement .outils{opacity:1}
  .cases{display:flex;gap:6px;padding-top:1px;flex:none}
  .case{width:22px;height:22px;border:1.5px solid var(--filet-fort);background:transparent;display:grid;place-items:center;
    padding:0;color:transparent;flex:none;border-radius:3px}
  .case:hover{border-color:var(--encre-2)}
  .case svg{width:12px;height:12px;display:block}
  .case.carre.coche{background:var(--vert);border-color:var(--vert);color:#fff}
  .case.fleche{color:var(--filet-fort);font-size:14px;line-height:1;font-weight:700;border-style:solid}
  .case.fleche:hover{color:var(--encre-2)}
  .case.fleche.coche{background:var(--accent);border-color:var(--accent);color:#fff}
  .corps{flex:1;min-width:0}
  /* Les outils passent sous le texte : sur téléphone, sept icônes en ligne
     ne laissaient que cinq caractères de large à l'intitulé. */
  /* Les métadonnées d'abord, sur toute la largeur, puis les outils seuls
     en dessous : ainsi ni l'intitulé ni les dates ne sont tronqués. */
  .ligne .bas{display:flex;flex-direction:column;gap:2px;margin-top:3px}
  .ligne .bas .meta{margin-top:0}
  .ligne .bas .outils{align-self:flex-end;margin-top:1px}
  .intitule{word-break:break-word}
  .ligne.faite .intitule{color:var(--encre-3);text-decoration:line-through;text-decoration-color:var(--filet-fort)}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:4px}
  /* Pastilles sans cadre : la couleur et le point suffisent à distinguer,
     et la place gagnée sert à agrandir le texte. */
  .puce{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;padding:0;
    color:var(--encre-2);background:none;border:0;display:inline-flex;align-items:center}
  .puce.ctx{color:var(--accent);font-weight:600}
  .puce.ctx::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
    display:inline-block;margin-right:5px;flex:none}
  .puce.trav{color:var(--encre);font-weight:600}
  .puce.trav::before{content:"";width:6px;height:6px;border-radius:1px;background:var(--encre);
    display:inline-block;margin-right:5px;flex:none}
  .puce.doss{color:var(--encre)}
  .puce.doss::before{content:"";width:6px;height:6px;border-radius:1px;background:var(--filet-fort);
    display:inline-block;margin-right:5px;flex:none}
  .puce.chaud{color:var(--rouge);font-weight:600}
  .puce.date{font-variant-numeric:tabular-nums}
  .puce.veille{color:var(--encre-3);font-style:italic}
  .repousse{font-family:var(--mono);font-size:11.5px;color:var(--encre-3);font-style:italic}
  .repousse.chaud{color:var(--rouge)}
  .outils{display:flex;gap:2px;flex:none;opacity:0;transition:opacity .12s}
  .ligne:hover .outils,.ligne:focus-within .outils{opacity:1}
  @media(hover:none){.outils{opacity:1}}
  .ico{background:none;border:0;color:var(--encre-3);padding:6px 8px;border-radius:var(--r);font-size:14px;line-height:1}
  .ico:hover{color:var(--encre);background:var(--fiche-2)}
  .ico.sup:hover{color:var(--rouge)}
  .ico.mont:hover{color:var(--accent)}
  .ico.actif{color:var(--accent)}
  .rdv-l{align-items:baseline}
  .heure-c{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none;
    width:44px;color:var(--accent);font-weight:600}
  .heure-c.ferie{color:var(--rouge)}
  .jour-prel{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;flex:none;
    width:26px;text-align:center;color:var(--accent);border:1px solid var(--accent);border-radius:2px;
    padding:1px 0;background:var(--accent-pale);height:20px;line-height:16px}
  .jour-prel.passe{color:var(--encre-3);border-color:var(--filet);background:transparent}
  .somme{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}

  .tampon{position:absolute;right:14px;top:50%;pointer-events:none;font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:2px;
    padding:2px 7px;background:rgba(235,227,247,.75);transform:translateY(-50%) rotate(-7deg);
    animation:tamponner .45s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes surgir{0%{background:var(--accent-pale)}100%{background:var(--fiche)}}
  .ligne.neuf{animation:surgir 1.6s ease-out}
  @media(prefers-reduced-motion:reduce){.ligne.neuf{animation:none;background:var(--accent-pale)}}
  /* Un anneau pour une date dépassée, un disque plein pour l'urgence :
     deux signaux rouges, mais qu'on distingue d'un coup d'œil. */
  .point-retard{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--rouge);
    margin-right:7px;vertical-align:0;flex:none}
  .point-urgent{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rouge);
    margin-right:7px;vertical-align:0;flex:none}
  .txt-urgent{font-weight:600}
  .ico.urg{color:var(--filet-fort)}
  .ico.urg:hover{color:var(--rouge)}
  .ico.urg.actif{color:var(--rouge)}
  @keyframes tamponner{0%{opacity:0;transform:translateY(-50%) rotate(-7deg) scale(2.4)}60%{opacity:1}
    100%{opacity:1;transform:translateY(-50%) rotate(-7deg) scale(1)}}
  @media(prefers-reduced-motion:reduce){.tampon{animation:none}}

  .saisie{display:flex;gap:8px;margin-bottom:14px}
  .saisie input{flex:1;background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r);padding:10px 12px;min-width:0}
  .saisie input:focus{border-color:var(--accent);outline:none}
  .aide{font-family:var(--mono);font-size:11px;color:var(--encre-3);margin:-8px 0 18px}
  .aide-pied{margin:32px 0 0;padding-top:14px;border-top:1px solid var(--filet);
    font-size:12px;color:var(--encre-3);line-height:1.5}
  .aide-pied p{margin:0 0 5px}
  .aide-pied b{color:var(--encre-2);font-weight:600}
  .aide b{color:var(--accent);font-weight:400}

  .btn{background:var(--encre);color:var(--papier);border:1px solid var(--encre);border-radius:var(--r);
    padding:9px 15px;font-size:14px;font-weight:500}
  .btn:hover{background:var(--btn-survol)}
  .btn.creux{background:transparent;color:var(--encre);border-color:var(--filet-fort)}
  .btn.creux:hover{background:var(--fiche);border-color:var(--encre-2)}
  .btn.mini{padding:5px 11px;font-size:12.5px}
  .btn.danger{color:var(--rouge);border-color:var(--rouge);background:transparent}
  .btn.danger:hover{background:var(--rouge-pale)}

  .filtres{display:flex;flex-wrap:wrap;gap:2px 20px;margin-bottom:14px}
  .filtres.spheres{gap:2px 18px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--filet)}
  .filtres.moyens{gap:2px 16px;margin-top:-4px}
  .filtres.moyens .filtre{font-size:13px}
  .boites{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:-6px 0 12px}
  .segments{display:inline-flex;border:1.5px solid var(--filet-fort);border-radius:var(--r);overflow:hidden}
  .seg{background:transparent;border:0;padding:6px 15px;font-size:13.5px;color:var(--encre-2)}
  .seg+.seg{border-left:1.5px solid var(--filet-fort)}
  .seg:hover{background:var(--fiche-2);color:var(--encre)}
  .seg.on{background:var(--accent);color:#fff;font-weight:600}
  .boite-note{font-size:11.5px;color:var(--encre-3);letter-spacing:.02em}
  .filtre{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
    padding:3px 0 4px;font-size:14.5px;color:var(--encre-3);display:flex;align-items:baseline;gap:6px}
  .filtre .n{font-family:var(--mono);font-size:11px;color:var(--encre-3)}
  .filtre:hover{color:var(--encre)}
  .filtre.on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
  .filtre.on .n{color:var(--accent)}
  .filtre.doss.on{color:var(--encre);border-bottom-color:var(--encre)}
  .filtre.doss.on .n{color:var(--encre-2)}
  /* Le rouge est le signal de l'urgence : le filtre porte la même couleur
     que le point qui marque les tâches. */
  .filtre.urgent-f{color:var(--rouge)}
  .filtre.urgent-f .pastille-urg{width:9px;height:9px;border-radius:50%;background:var(--rouge);
    display:inline-block;margin-right:7px}
  .filtre.urgent-f:hover{color:var(--rouge);opacity:.8}
  .filtre.urgent-f.on{color:var(--rouge);font-weight:600;border-bottom-color:var(--rouge)}
  .filtre.urgent-f.on .n{color:var(--rouge)}

  /* ---------- Budget ---------- */
  .compteur{border:1px solid var(--filet);background:var(--fiche);border-radius:var(--r);box-shadow:var(--ombre);
    padding:12px 15px;margin-bottom:18px}
  .cpt-l{display:flex;align-items:baseline;gap:10px;padding:3px 0;flex-wrap:wrap}
  .cpt-n{font-size:13.5px;color:var(--encre-2);flex:1;min-width:120px}
  .cpt-v{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;font-weight:600}
  .cpt-v.neg{color:var(--rouge)}
  .cpt-note{font-size:11.5px;color:var(--encre-3);flex-basis:100%}
  .cpt-filet{height:1px;background:var(--filet);margin:7px 0}
  /* Discret : lisible pour soi, difficile à déchiffrer par-dessus l'épaule. */
  .petit-detail{font-size:11.5px;color:var(--encre-3);line-height:1.4;margin-top:3px}
  .explique{font-size:12.5px;color:var(--encre-2);line-height:1.5;margin:6px 2px 4px;max-width:62ch;
    padding:9px 11px;background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r)}
  .aide-q{background:none;border:0;padding:4px 0;margin:5px 0 0;font-size:12px;color:var(--encre-3);
    text-decoration:underline;text-underline-offset:3px}
  .aide-q:hover{color:var(--accent)}
  .bilan{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--filet);border-radius:var(--r);background:var(--fiche);margin-bottom:6px}
  .bilan div{flex:1;min-width:132px;padding:11px 13px;border-right:1px solid var(--filet)}
  .bilan div:last-child{border-right:0}
  .bilan .e{font-size:11px;color:var(--encre-3);line-height:1.25}
  .bilan .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px}
  .bilan .v.moins{color:var(--rouge)}
  .bilan .v.plus{color:var(--vert)}
  .barre-cat{display:flex;align-items:center;gap:10px;padding:7px 12px}
  .barre-cat .nom{flex:0 0 33%;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barre-cat .tige{flex:1;height:9px;background:var(--fiche-2);border-radius:2px;overflow:hidden}
  .barre-cat .tige i{display:block;height:100%;background:var(--accent);opacity:.75}
  .barre-cat .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;flex:none;color:var(--encre-2)}
  .sync{cursor:pointer;font-size:15px;vertical-align:-1px;letter-spacing:0;padding:0 2px}
  .sync .heure{font-size:12px;letter-spacing:.02em;margin-left:2px}
  .sync.ok{color:var(--vert)}
  .sync.attente{color:var(--encre-3)}
  .sync.occupe{color:var(--accent);animation:pulser 1.1s ease-in-out infinite}
  .sync.conflit,.sync.erreur{color:var(--rouge)}
  @keyframes pulser{0%,100%{opacity:.35}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.sync.occupe{animation:none}}
  .teintes{display:flex;gap:10px;flex-wrap:wrap}
  .teinte{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0;
    box-shadow:inset 0 0 0 1px rgba(28,34,48,.12)}
  .teinte.on{border-color:var(--encre);box-shadow:inset 0 0 0 2px var(--papier)}
  .loupe{background:none;border:0;padding:2px 6px;color:var(--encre-2);font-size:22px;line-height:1;
    cursor:pointer;vertical-align:-4px;border-radius:var(--r)}
  .loupe:hover{color:var(--accent);background:var(--fiche-2)}
  .loupe.actif{color:var(--accent);background:var(--accent-pale)}
  .loupe[data-act="grossir"]{font-size:15px;font-weight:700;letter-spacing:-.03em}
  /* Un agrandissement global, sans toucher aux réglages du téléphone. */
  body.gros{zoom:1.18}
  @media(max-width:820px){ body.gros{zoom:1.22} }
  body.tres-gros{zoom:1.34}
  @media(max-width:820px){ body.tres-gros{zoom:1.4} }
  .champ-rech{width:100%;background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r);
    padding:11px 13px;font-size:16px}
  .champ-rech:focus{border-color:var(--accent);outline:none}
  .rech-vide{color:var(--encre-3);font-size:13px;margin:14px 2px;text-align:center}
  /* Suivi d'habitudes : sept ronds par ligne, assez gros pour le pouce. */
  .habitudes{padding:4px 10px 8px}
  .hab-entete,.hab-ligne{display:grid;grid-template-columns:1fr repeat(7, 30px);align-items:center;gap:2px}
  .hab-entete{font-family:var(--mono);font-size:10px;color:var(--encre-3);padding:5px 0 3px}
  .hab-entete span{text-align:center}
  .hab-entete span.auj{color:var(--accent);font-weight:700}
  .hab-ligne{padding:5px 0;border-top:1px solid var(--filet)}
  .hab-nom{font-size:13.5px;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hab-nom .serie{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--accent);margin-left:6px}
  .hab-nom .bilan-mois{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--encre-3);margin-left:6px}
  .rond{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--filet-fort);background:transparent;
    padding:0;justify-self:center}
  .rond:hover{border-color:var(--encre-2)}
  .rond.plein{background:var(--accent);border-color:var(--accent)}
  .rond.auj{border-width:2.5px}
  .rond.futur{opacity:.3;border-style:dashed}
  @media(max-width:820px){
    .hab-entete,.hab-ligne{grid-template-columns:1fr repeat(7, 32px)}
    .rond{width:27px;height:27px}
  }
  .pied{margin:34px 0 0;padding-top:16px;border-top:1px solid var(--filet);display:flex;justify-content:center}
  .pied{gap:14px;align-items:baseline}
  .pied button{background:none;border:0;color:var(--encre-3);font-size:13px;padding:8px 14px;border-radius:var(--r)}
  .pied button:hover{color:var(--accent);background:var(--fiche)}
  .pied-version{font-family:var(--mono);font-size:10.5px;color:var(--filet-fort);letter-spacing:.06em}
  .filet-rappel{background:none;border:0;padding:0;margin:-6px 0 16px;display:block;
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--encre-3);text-align:left}
  .filet-rappel:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .filet-rappel.doux{margin:-4px 0 14px;font-size:11px;color:var(--encre-2)}
  .filet-rappel.doux .point-retard{width:7px;height:7px;margin-right:6px;vertical-align:0}
  .lien-mois{background:var(--fiche);border:1px solid var(--filet);border-radius:20px;
    padding:6px 12px;color:var(--encre);font-size:13px;white-space:nowrap;display:inline-block}
  .lien-mois b{color:var(--accent);font-weight:600}
  .lien-mois:hover{border-color:var(--accent)}
  .astro-pill{display:inline-flex;align-items:center;gap:9px;font-size:14px;color:var(--encre-2);
    background:var(--fiche);border-radius:20px;padding:7px 8px 7px 14px;margin:-4px 0 16px}
  .astro-pill .sep{color:var(--filet-fort);font-size:12px}
  .astro-pill.astro-attn{color:var(--encre-3);font-size:12.5px;font-style:italic;padding:7px 14px}
  .astro-plus{width:24px;height:24px;border-radius:50%;border:1px solid var(--filet-fort);
    background:var(--papier);color:var(--encre-2);font-size:15px;line-height:1;
    display:inline-flex;align-items:center;justify-content:center;flex:none}
  .astro-plus:hover{border-color:var(--accent);color:var(--accent)}
  /* Trait discret sous une planète qui se lève tôt (voir rendreAstroPeriode).
     Hauteur de référence FIXE (15px, la plus grande icône) sur l'enveloppe :
     le trait part donc toujours du même niveau, quelle que soit la taille
     réelle de la planète dessinée à l'intérieur — sinon telluriques et
     géantes, dessinées à des tailles différentes, désalignent le trait. */
  .astro-env{position:relative;display:inline-flex;align-items:center;justify-content:center;
    height:15px;line-height:0}
  .astro-trait{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);
    width:8px;height:1.8px;background:var(--filet-fort);border-radius:2px}
  .coeur-svg{width:18px;height:18px}
  .sep-decalage{width:12px;flex:none}

  /* ---- Séance de cohérence cardiaque ---- */
  .coherence-ecran{display:flex;flex-direction:column;align-items:center;
    justify-content:space-between;min-height:70vh;padding:10px 0 20px;text-align:center}
  .coherence-haut{width:100%;display:flex;justify-content:space-between;align-items:center}
  .coherence-temps{font-family:var(--mono);color:var(--encre-2);font-size:14px}
  .coherence-zone{flex:1;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:24px}
  .coherence-cercle-ext{width:210px;height:210px;border-radius:50%;border:1px solid var(--filet);
    display:flex;align-items:center;justify-content:center;flex:none}
  .coherence-cercle{width:140px;height:140px;border-radius:50%;background:var(--accent-pale);
    border:1.5px solid var(--accent);transition:width 5s ease-in-out,height 5s ease-in-out;
    display:flex;align-items:center;justify-content:center}
  .coherence-cercle.grand{width:200px;height:200px}
  .coherence-mot{font-size:18px;color:var(--accent);font-weight:500}
  .coherence-souscription{color:var(--encre-3);font-size:12.5px}
  .btn-coherence-arreter{background:none;border:1px solid var(--filet-fort);color:var(--encre-2);
    border-radius:20px;padding:9px 22px;font-size:13.5px}
  #bandeauMaj{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--accent);
    color:#fff;font-size:13px;padding:10px 16px;display:flex;align-items:center;
    justify-content:center;gap:12px;box-shadow:0 -2px 8px rgba(0,0,0,.12)}
  #bandeauMaj button{background:#fff;color:var(--accent);border:0;border-radius:20px;
    padding:5px 13px;font-size:12.5px;font-weight:600}
  @media(min-width:900px){ #bandeauMaj{left:220px} }
  /* Détachée des rendez-vous : ce sont deux informations sans rapport,
     elles ne doivent pas se lire comme un même bloc. */
  .prive{display:inline-flex;align-items:baseline;gap:9px;border:1px solid var(--filet);background:transparent;
    border-radius:12px;padding:4px 13px;margin:26px 0 4px;font-family:var(--mono);font-size:11px;
    color:var(--encre-3);letter-spacing:.04em}
  .prive:hover{border-color:var(--filet-fort);color:var(--encre-2)}
  .prive .v{font-variant-numeric:tabular-nums;color:var(--encre-2)}
  .prive .v.neg{color:var(--rouge)}
  .prive .oeilleton{opacity:.55}

  .tab{width:100%;border-collapse:collapse;font-size:13.5px}
  .tab th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--encre-3);font-weight:400;padding:8px 11px;border-bottom:1px solid var(--filet-fort);white-space:nowrap}
  .tab td{padding:9px 11px;border-bottom:1px solid var(--filet);vertical-align:top}
  .tab tr:last-child td{border-bottom:0}
  .tab td.num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tab .nom{font-weight:560;background:none;border:0;padding:0;text-align:left;color:var(--encre)}
  .tab .nom:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .tab-aide{width:100%;border-collapse:collapse;font-size:13px}
  .tab-aide td{padding:3px 0;vertical-align:top;color:var(--encre-2)}
  .tab-aide td:first-child{width:96px;font-family:var(--mono);color:var(--accent);white-space:nowrap}
  .note-min{font-size:11.5px;color:var(--encre-3);margin-top:2px;display:block;max-width:230px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* Un carré coloré : dans une liste de dossiers, on repère d'un coup d'œil
     ceux qui attendent quelque chose. */
  .marque-tache{color:var(--accent);font-weight:600;font-family:var(--sans);font-size:12.5px}
  .marque-tache.ligne-seule{display:block;margin-top:4px}
  .lien{font-family:var(--mono);font-size:11px;text-decoration:none;border:1px solid var(--filet);border-radius:9px;
    padding:1px 8px;color:var(--accent);white-space:nowrap;display:inline-block}
  .lien:hover{background:var(--accent-pale);border-color:var(--accent)}
  .cartes{display:none}

  .retour{background:none;border:0;padding:0;color:var(--encre-2);font-family:var(--mono);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
  .retour:hover{color:var(--accent)}
  .entete-d{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .entete-d .titre{flex:1;min-width:0}
  .bloc-notes{background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r)}
  .bloc-notes textarea{width:100%;background:transparent;border:0;padding:12px 13px;min-height:96px;resize:vertical;
    font-family:var(--sans);font-size:14px;line-height:1.55;display:block}
  .bloc-notes.grand textarea{min-height:300px}
  #blocTexte{min-height:230px}
  @media(max-width:820px){ .bloc-notes.grand textarea{min-height:340px} }
  .bloc-notes textarea:focus{outline:none}
  .bloc-notes textarea::placeholder{color:var(--encre-3)}

  .vide{border:1px dashed var(--filet-fort);border-radius:var(--r);padding:26px 18px;text-align:center;
    color:var(--encre-2);font-size:13.5px;background:transparent}
  .vide b{display:block;color:var(--encre);font-weight:600;margin-bottom:3px;font-size:15px}
  /* Sur l'accueil, une journée libre ne doit pas coûter un écran de défilement. */
  .vide.mini{padding:9px 13px;text-align:left}
  .vide.mini b{display:inline;font-size:13.5px;font-weight:500;color:var(--encre-2);margin:0}
  .bandeau{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-pale);
    border-radius:var(--r);padding:10px 13px;margin-bottom:20px;font-size:13.5px;box-shadow:var(--ombre)}
  .bandeau.alerte{border-color:var(--rouge);background:var(--rouge-pale)}
  .bandeau .g{flex:1;min-width:180px}
  .bloc{margin-bottom:30px}
  .champ{display:block;margin-bottom:13px}
  .champ span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--encre-3);margin-bottom:4px}
  .champ input,.champ select,.champ textarea{width:100%;background:var(--fiche);border:1px solid var(--filet);
    border-radius:var(--r);padding:8px 10px}
  .champ textarea{min-height:74px;resize:vertical}
  .champ input:focus,.champ select:focus,.champ textarea:focus{border-color:var(--accent);outline:none}
  .duo{display:flex;gap:11px}
  .duo>*{flex:1;min-width:0}
  .segment{display:flex;background:var(--fiche);border-radius:var(--r);padding:3px;margin-bottom:13px;gap:3px}
  .segment button{flex:1;border:0;background:none;padding:9px;border-radius:7px;font-size:13.5px;color:var(--encre-2)}
  .segment button.actif{background:var(--papier);color:var(--encre);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}

  dialog{border:1px solid var(--filet-fort);border-radius:var(--r);background:var(--papier);color:var(--encre);padding:0;
    width:min(490px,calc(100vw - 28px));box-shadow:0 20px 50px rgba(28,34,48,.22);max-height:88dvh}
  dialog::backdrop{background:rgba(28,34,48,.34)}
  .dlg-t{padding:15px 17px 0;font-size:17px;font-weight:620}
  .dlg-c{padding:15px 17px;overflow:auto;max-height:62dvh}
  .dlg-p{display:flex;gap:8px;justify-content:flex-end;padding:0 17px 16px}
  .dlg-p .esp{margin-right:auto}

  /* Surligneur : teintes assez tenues pour rester lisibles sur le papier,
     assez franches pour se repérer en balayant le mois du regard. */
  .surl{border-radius:2px;padding:0 3px;margin:0 -2px;box-decoration-break:clone;
    -webkit-box-decoration-break:clone}
  .surl-jaune{background:#F0E39B}
  .surl-rose{background:#F3CFDA}
  .surl-vert{background:#C8E0C4}
  /* Carnet de bord : une petite note du jour (« route Toulon-Ajaccio »,
     « migraine »…) plutôt qu'un vrai rendez-vous — en italique, sans
     assombrir : la même couleur pleine que le texte normal, pour rester
     aussi lisible. Un seul nom de classe couvre les 4 endroits où un
     rendez-vous peut s'afficher (Accueil, Agenda, six mois, emploi du temps). */
  .surl-carnet{font-style:italic}
  /* En mode nuit, le texte hérite d'une couleur claire (--encre) : les
     mêmes pastels clairs deviendraient illisibles. On assombrit juste ces
     trois teintes-là plutôt que de figer la couleur du texte. */
  body.sombre .surl-jaune{background:#5C4E1E}
  body.sombre .surl-rose{background:#4D2C38}
  body.sombre .surl-vert{background:#2F4A32}

  /* ---------- Vue semestrielle ---------- */
  .sem-cadre{overflow-x:auto;border:1px solid var(--filet);border-radius:var(--r);background:var(--fiche)}
  .sem-grille{display:flex;min-width:760px}
  .sem-col{flex:1;min-width:126px;border-right:1px solid var(--filet)}
  .sem-col:last-child{border-right:0}
  .sem-titre{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--encre-3);text-align:center;padding:6px 0 5px;border-bottom:1px solid var(--filet-fort);
    position:sticky;top:0;background:var(--fiche);z-index:2}
  .sem-case{display:flex;gap:5px;align-items:flex-start;min-height:19px;padding:1px 4px;
    border-top:1px solid var(--fiche-2);cursor:pointer}
  .sem-case.hors{background:var(--papier);border-top-color:var(--papier);cursor:default}
  .sem-case.we{background:var(--fiche-2)}
  .sem-case.ferie{background:#F7E2E9}
  body.sombre .sem-case.ferie{background:#4A2530}
  .sem-case.vac{box-shadow:inset 3px 0 0 var(--accent)}
  .sem-case.auj{background:var(--accent-pale)}
  .sem-case.auj .sem-jour{color:var(--accent);font-weight:700}
  .sem-jour{font-family:var(--mono);font-size:9.5px;color:var(--encre-3);width:20px;flex:none;
    padding-top:2px;letter-spacing:-.02em}
  .sem-evts{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .sem-e{font-size:11px;font-weight:500;line-height:1.35;display:block;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:2px;padding:0 3px}
  .sem-e.perso{color:var(--encre)}
  .sem-e.pro{background:#D6D2C4;color:var(--encre);border-left:3px solid var(--encre-2)}
  body.sombre .sem-e.pro{background:#4A473C}
  .sem-e.surl-jaune{background:#F0E39B}
  .sem-e.surl-rose{background:#F3CFDA}
  .sem-e.surl-vert{background:#C8E0C4}
  body.sombre .sem-e.surl-jaune{background:#5C4E1E}
  body.sombre .sem-e.surl-rose{background:#4D2C38}
  body.sombre .sem-e.surl-vert{background:#2F4A32}

  /* ---------- Semaine type ---------- */
  .edt-cadre{overflow-x:auto;border:1px solid var(--filet);border-radius:var(--r);background:var(--fiche);padding:6px}
  .edt-grille{display:grid;gap:1px;min-width:430px;position:relative;
    grid-template-columns:34px repeat(7, minmax(52px, 1fr))}
  .edt-coin{grid-column:1;grid-row:1}
  .edt-jour{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--encre-3);text-align:center;align-self:center}
  .edt-heure{grid-column:1;font-family:var(--mono);font-size:9.5px;color:var(--encre-3);
    text-align:right;padding-right:5px;align-self:start;margin-top:-4px}
  .edt-fond{border-top:1px solid var(--fiche-2)}
  .edt-fond.pleine{border-top-color:var(--filet)}
  .edt-bloc{background:var(--accent-pale);border-left:3px solid var(--accent);border-radius:2px;
    padding:2px 5px;overflow:hidden;cursor:pointer;z-index:1;display:flex;flex-direction:column;justify-content:center}
  .edt-bloc:hover{filter:brightness(.97)}
  .edt-bloc b{font-size:11.5px;font-weight:600;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .edt-bloc i{font-family:var(--mono);font-style:normal;font-size:9.5px;color:var(--encre-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .edt-bloc.surl-jaune{background:#F0E39B;border-left-color:#C9A93A}
  .edt-bloc.surl-rose{background:#F3CFDA;border-left-color:#C2708D}
  .edt-bloc.surl-vert{background:#C8E0C4;border-left-color:#6E9E68}
  body.sombre .edt-bloc.surl-jaune{background:#5C4E1E;border-left-color:#D4B84A}
  body.sombre .edt-bloc.surl-rose{background:#4D2C38;border-left-color:#D488A3}
  body.sombre .edt-bloc.surl-vert{background:#2F4A32;border-left-color:#7FB578}

  /* ---------- Agenda ---------- */
  .nav-mois{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .barre-mois{display:flex;gap:11px;align-items:center;flex-wrap:wrap;margin-bottom:16px;
    padding:9px 12px;border:1px solid var(--filet);border-radius:var(--r);background:var(--fiche);box-shadow:var(--ombre)}
  .barre-mois.ailleurs{border-color:var(--accent);background:var(--accent-pale)}
  .titre-mois{display:flex;flex-direction:column;line-height:1.25}
  .titre-mois .nom{font-size:16px;font-weight:640;text-transform:capitalize}
  .titre-mois .plage{font-family:var(--mono);font-size:10.5px;color:var(--encre-3)}
  .barre-mois.ailleurs .titre-mois .nom{color:var(--accent)}
  .agenda{overflow:hidden}
  .entete-cols{display:grid;grid-template-columns:56px 1fr 1fr;border-bottom:1px solid var(--filet-fort);
    font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--encre-3)}
  .entete-cols span{padding:6px 9px}
  .entete-cols span+span{border-left:1px solid var(--filet)}
  .jour-l{display:grid;grid-template-columns:56px 1fr 1fr;border-bottom:1px solid var(--filet);min-height:34px}
  .jour-l:last-child{border-bottom:0}
  .jour-l.we{background:var(--fiche-2)}
  .jour-l.hors{opacity:.42}
  .jour-l.envac .date-c{box-shadow:inset 3px 0 0 var(--accent)}
  .jour-l.auj{background:var(--accent-pale)}
  .jour-l.auj .num{color:var(--accent);font-weight:700}
  .sep-sem{height:0;border-bottom:1px solid var(--filet-fort)}
  .date-c{display:flex;align-items:center;gap:5px;padding:5px 7px;font-family:var(--mono);
    font-variant-numeric:tabular-nums;position:relative}
  .date-c .lettre{font-size:10px;color:var(--encre-3);width:9px}
  .date-c .num{font-size:14px}
  .date-c .plus{margin-left:auto;background:none;border:0;color:var(--filet-fort);font-size:14px;
    line-height:1;padding:0 2px;opacity:0;transition:opacity .12s}
  .jour-l:hover .plus{opacity:1}
  @media(hover:none){.date-c .plus{opacity:.6}}
  .date-c .plus:hover{color:var(--accent)}
  .col{padding:4px 8px;border-left:1px solid var(--filet);min-width:0}
  .rdv{font-size:13px;line-height:1.35;padding:1px 0;display:flex;align-items:baseline;gap:5px;word-break:break-word}
  .rdv b{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}
  .rdv .ico{margin-left:auto;opacity:0;transition:opacity .12s;flex:none}
  .rdv:hover .ico{opacity:1}
  @media(hover:none){.rdv .ico{opacity:.5}}
  .rdv .jalon{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--encre-3);
    border:1px solid var(--filet);border-radius:2px;padding:0 3px}
  .note-rdv{font-size:12.5px;color:var(--encre-2);line-height:1.45;margin-top:4px;white-space:pre-wrap}
  .rdv.tache{color:var(--encre-3);font-size:11.5px;opacity:.55}
  .rdv.tache:hover{opacity:.9}
  /* Dans le Accueil (à l'intérieur d'une fiche liste), la tâche a besoin du
     même padding que les rendez-vous à côté d'elle — sinon elle colle aux
     bords du cadre. Dans l'Agenda, la cellule du jour a déjà son propre
     padding, donc on ne touche à rien là-bas. */
  .fiche.liste .rdv.tache{padding:10px 12px}
  .rdv.google{color:var(--encre-2);font-style:italic}
  .rdv.google b{color:var(--encre-2)}
  .marques{display:flex;flex-wrap:wrap;gap:4px 9px;margin-top:1px}
  .anniv,.ferie,.vac{font-size:11px;color:var(--encre-3);white-space:nowrap}
  .ferie{color:var(--rouge)}
  .vac{color:var(--accent)}

  /* Un carré, rien de plus : vide quand il n'y a rien, plein quand un mot
     attend. Placé près de la date, il ne réclame aucune place. */
  .mini-carre{width:17px;height:17px;border:1.5px solid var(--filet-fort);border-radius:2px;
    background:transparent;padding:0;vertical-align:-3px;margin-right:14px}
  .mini-carre:hover{border-color:var(--accent)}
  .mini-carre.rempli{background:var(--accent);border-color:var(--accent)}
  .fab{position:fixed;right:22px;bottom:26px;z-index:45;width:52px;height:52px;border-radius:50%;
    background:var(--accent);color:#fff;border:0;font-size:27px;line-height:1;font-weight:300;
    box-shadow:0 4px 14px rgba(28,34,48,.22);display:grid;place-items:center;padding:0 0 3px}
  .fab:hover{filter:brightness(1.12)}
  .fab:active{transform:scale(.94)}

  .barre{display:none}
  @media(max-width:820px){
    .rail{display:none}
    main{padding:18px 15px 96px;max-width:none}
    .titre{font-size:22px}
    .grand{font-size:22px}
    .tab{display:none}
    .cartes{display:flex;flex-direction:column}
    .barre{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:var(--fiche);
      border-top:1px solid var(--filet-fort);padding-bottom:env(safe-area-inset-bottom)}
    .barre button{flex:1;background:none;border:0;padding:9px 1px 11px;color:var(--encre-2);font-size:11px;
      display:flex;flex-direction:column;align-items:center;gap:4px;letter-spacing:-.01em}
    .barre button .g{font-size:21px;line-height:1}
    .barre button.on{font-weight:600}
    .barre button.on{color:var(--accent);position:relative}
    /* Un trait plein sous l'onglet actif : la couleur seule ne suffit pas

<script>
"use strict";

/* =====================================================================
   1. STOCKAGE — seule porte vers les données.
   Pour brancher une synchro un jour : réécrire lire() et ecrire().
   ===================================================================== */
const Stockage = (() => {
  const NOM = "carnet", MAG = "etat", CLE = "db", PIECES = "pieces";
  const VERSION_IDB = 2;
  let idb = null, memoire = {}, dispo = false;
  function ouvrir(){
    return new Promise(res => {
      if(!("indexedDB" in window)) return res(null);
      let r; try{ r = indexedDB.open(NOM, VERSION_IDB); }catch(e){ return res(null); }
      r.onupgradeneeded = () => {
        const base = r.result;
        if(!base.objectStoreNames.contains(MAG)) base.createObjectStore(MAG);
        /* Pièces jointes (photos, documents) : un magasin à part, jamais
           synchronisé — reste sur cet appareil, contrairement au reste. */
        if(!base.objectStoreNames.contains(PIECES)) base.createObjectStore(PIECES);
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      setTimeout(() => res(null), 2500);
    });
  }
  async function init(){
    idb = await ouvrir(); dispo = !!idb;
    if(dispo && navigator.storage?.persist){ try{ await navigator.storage.persist(); }catch(e){} }
    return dispo;
  }
  function lire(cle = CLE){
    return new Promise(res => {
      if(!idb) return res(memoire[cle] ?? null);
      try{ const t = idb.transaction(MAG,"readonly").objectStore(MAG).get(cle);
        t.onsuccess = () => res(t.result ?? null); t.onerror = () => res(null);
      }catch(e){ res(null); }
    });
  }
  function ecrire(v, cle = CLE){
    memoire[cle] = v;
    return new Promise(res => {
      if(!idb) return res(false);
      try{ const t = idb.transaction(MAG,"readwrite").objectStore(MAG).put(v, cle);
        t.onsuccess = () => res(true); t.onerror = () => res(false);
      }catch(e){ res(false); }
    });
  }
  function ecrirePiece(id, piece){
    return new Promise(res => {
      if(!idb) return res(false);
      try{ const t = idb.transaction(PIECES,"readwrite").objectStore(PIECES).put(piece, id);
        t.onsuccess = () => res(true); t.onerror = () => res(false);
      }catch(e){ res(false); }
    });
  }
  function lirePiece(id){
    return new Promise(res => {
      if(!idb || !id) return res(null);
      try{ const t = idb.transaction(PIECES,"readonly").objectStore(PIECES).get(id);
        t.onsuccess = () => res(t.result ?? null); t.onerror = () => res(null);
      }catch(e){ res(null); }
    });
  }
  function supprimerPiece(id){
    return new Promise(res => {
      if(!idb || !id) return res(false);
      try{ const t = idb.transaction(PIECES,"readwrite").objectStore(PIECES).delete(id);
        t.onsuccess = () => res(true); t.onerror = () => res(false);
      }catch(e){ res(false); }
    });
  }
  return { init, lire, ecrire, persistant: () => dispo, ecrirePiece, lirePiece, supprimerPiece };
})();

/* =====================================================================
   1 ter. ASTRONOMIE
   Un fichier JSON externe (coucher du soleil, phase de lune, visibilité
   des planètes), déposé sur le site public — pas de jeton nécessaire,
   rien de personnel dedans. Récupéré une fois par jour maximum, mis en
   cache en local (jamais dans le carnet synchronisé : c'est une donnée
   externe, pas une donnée personnelle), avec un repli silencieux hors
   connexion et une reprise automatique dès que le réseau revient.
   ===================================================================== */
const URL_ASTRO_JSON = "https://sabthito2.github.io/carnet-app/astro.json";
/* Soleil, phases de Lune, Jupiter et Saturne : dessinés sur mesure (gris
   pour la Lune, orange à bandes pour Jupiter, anneau fin pour Saturne,
   traits fins pour le Soleil) plutôt que les emoji, dont le rendu et les
   couleurs échappent à tout contrôle d'un appareil à l'autre. Mercure,
   Vénus et Mars sont dessinées aussi (même souci de taille cohérente),
   avec un rayon volontairement plus petit que les géantes. */
const SVG_SOLEIL = `<svg viewBox="0 0 24 24" width="15" height="15" style="vertical-align:-3px"><circle cx="12" cy="12" r="5" fill="none" stroke="#E0A548" stroke-width="1.4"/><g stroke="#E0A548" stroke-width="1.4" stroke-linecap="round"><line x1="12" y1="1.5" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22.5"/><line x1="1.5" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22.5" y2="12"/><line x1="4.5" y1="4.5" x2="6.2" y2="6.2"/><line x1="17.8" y1="17.8" x2="19.5" y2="19.5"/><line x1="19.5" y1="4.5" x2="17.8" y2="6.2"/><line x1="6.2" y1="17.8" x2="4.5" y2="19.5"/></g></svg>`;
function svgJupiter(taille){
  return `<svg viewBox="0 0 24 24" width="${taille}" height="${taille}" style="vertical-align:-3px"><defs><clipPath id="cj-${taille}"><circle cx="12" cy="12" r="10"/></clipPath></defs><circle cx="12" cy="12" r="10" fill="#D68A3C"/><g clip-path="url(#cj-${taille})" stroke="#B96F28" stroke-width="1.1" opacity="0.75"><line x1="2" y1="8" x2="22" y2="8"/><line x1="2" y1="11" x2="22" y2="11"/><line x1="2" y1="14.5" x2="22" y2="14.5"/><line x1="2" y1="17" x2="22" y2="17"/></g></svg>`;
}
function svgSaturne(taille){
  /* Même rayon de sphère que Jupiter (10 unités) : la largeur du cadre est
     élargie (34 au lieu de 24) pour loger l'anneau, sans jamais rapetisser
     la planète elle-même — sinon Saturne semble plus petite que les autres. */
  const largeur = Math.round(taille * 34/24);
  return `<svg viewBox="0 0 34 24" width="${largeur}" height="${taille}" style="vertical-align:-3px"><circle cx="17" cy="12" r="10" fill="#E8D9AE" stroke="#A8895A" stroke-width="1.3"/><line x1="2" y1="17.5" x2="32" y2="6.5" stroke="#A8895A" stroke-width="2.4" stroke-linecap="round"/></svg>`;
}
/* Telluriques : rayon 7 (contre 10 pour les géantes) — une hiérarchie de
   taille délibérée, qui correspond d'ailleurs à la réalité. */
const COULEURS_TELLURIQUES = { mercure:["#B9BCC2","#8E9199"], venus:["#E8A94A","#C4842F"], mars:["#D9483F","#B23A32"] };
function svgTellurique(cle, taille){
  const [fond, trait] = COULEURS_TELLURIQUES[cle];
  return `<svg viewBox="0 0 24 24" width="${taille}" height="${taille}" style="vertical-align:-3px"><circle cx="12" cy="12" r="7" fill="${fond}" stroke="${trait}" stroke-width="0.8"/></svg>`;
}
const SVG_PLUS = `<svg viewBox="0 0 24 24" width="12" height="12"><line x1="12" y1="4" x2="12" y2="20" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const SVG_COEUR = `<svg class="coeur-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.2C8.5 17.3 3 12.9 3 8.3 3 5.4 5.2 3.3 7.9 3.3c1.7 0 3.2 0.9 4.1 2.3 0.9-1.4 2.4-2.3 4.1-2.3C18.8 3.3 21 5.4 21 8.3c0 4.6-5.5 9-9 11.9z"/></svg>`;
/* Croissant/gibbeuse en gris, dessiné géométriquement (limbe + terminateur
   elliptique) — la même méthode que les widgets de phase lunaire usuels. */
function svgLune(phase, taille){
  const K = { nouvelle_lune:[0,1], premier_croissant:[0.25,1], premier_quartier:[0.5,1],
    gibbeuse_croissante:[0.75,1], pleine_lune:[1,1], gibbeuse_decroissante:[0.75,0],
    dernier_quartier:[0.5,0], dernier_croissant:[0.25,0] };
  const [k, croissante] = K[phase] || [0.5,1];
  const r = 10, rx = r * Math.abs(1 - 2*k);
  const sweepLimbe = croissante ? 1 : 0;
  const sweepTerm = k < 0.5 ? (croissante ? 0 : 1) : (croissante ? 1 : 0);
  const d = `M 12,2 A ${r},${r} 0 0 ${sweepLimbe} 12,22 A ${rx.toFixed(1)},${r} 0 0 ${sweepTerm} 12,2 Z`;
  return `<svg viewBox="0 0 24 24" width="${taille}" height="${taille}" style="vertical-align:-3px"><circle cx="12" cy="12" r="10" fill="#3A3D42"/><path d="${d}" fill="#B8BCC4"/></svg>`;
}
const LUNE_NOMS = { nouvelle_lune:"Nouvelle lune", premier_croissant:"Premier croissant",
  premier_quartier:"Premier quartier", gibbeuse_croissante:"Gibbeuse croissante",
  pleine_lune:"Pleine lune", gibbeuse_decroissante:"Gibbeuse décroissante",
  dernier_quartier:"Dernier quartier", dernier_croissant:"Dernier croissant" };
/* Ordre fixe Mercure→Saturne, toujours le même partout dans l'appli.
   Mercure/Vénus/Mars restent de simples puces de couleur (déjà sobres) ;
   Jupiter/Saturne utilisent les SVG dessinés ci-dessus. */
const PLANETES_ASTRO = ["mercure","venus","mars","jupiter","saturne"];
const PLANETE_NOMS = { mercure:"Mercure", venus:"Vénus", mars:"Mars", jupiter:"Jupiter", saturne:"Saturne" };
function iconePlanete(cle, taille){
  if(cle === "jupiter") return svgJupiter(taille);
  if(cle === "saturne") return svgSaturne(taille);
  return svgTellurique(cle, taille);
}

let astroCache = null, astroErreur = false;

async function initAstro(){
  try{ astroCache = await Stockage.lire("astro"); }catch(e){}
  await recupererAstro();
  rendre();
}

async function recupererAstro(force = false){
  const j = jourISO();
  let dernierFetch = null;
  try{ dernierFetch = await Stockage.lire("astro_dernier_fetch"); }catch(e){}
  if(!force && dernierFetch === j) return;
  try{
    const res = await fetch(URL_ASTRO_JSON, { cache:"no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    if(!data || !data.jours) throw new Error("format inattendu");
    astroCache = data;
    astroErreur = false;
    await Stockage.ecrire(data, "astro");
    await Stockage.ecrire(j, "astro_dernier_fetch");
  }catch(e){
    /* Hors connexion, ou fichier pas encore déposé : on garde le dernier
       cache connu (s'il existe) et on retentera au prochain retour réseau
       ou à la prochaine ouverture. Rien d'urgent, jamais bloquant. */
    astroErreur = !astroCache;
  }
}

function astroDuJour(){
  return (astroCache && astroCache.jours && astroCache.jours[jourISO()]) || null;
}

/* =====================================================================
   1 bis. SYNCHRONISATION GITHUB
   Le carnet est un fichier JSON dans un dépôt privé. Chaque écriture est
   un commit : on garde l'historique et la possibilité de revenir en arrière.
   Le jeton est rangé sous une autre clé que le carnet : il ne part donc
   jamais dans l'export.
   ===================================================================== */
const Sync = (() => {
  const CLE_CFG = "config_sync";
  let cfg = { actif:false, owner:"", repo:"", chemin:"carnet.json", branche:"main", jeton:"", sha:null, base:null };
  let etat = { statut:"off", message:"", quand:null };
  let minuteur = null, enCours = false, dernierPull = 0, redemande = false, veille = null;
  let dernierGeste = 0, retardataire = 0;
  const noterGeste = () => { dernierGeste = Date.now(); };

  const lireCfg = () => ({ ...cfg });
  const estActif = () => cfg.actif && !!cfg.jeton && !!cfg.owner && !!cfg.repo;
  const lireEtat = () => ({ ...etat });

  function poser(statut, message = ""){
    etat = { statut, message, quand: statut === "ok" ? Date.now() : etat.quand };
    if(typeof rafraichirBadge === "function") rafraichirBadge();
  }

  async function charger(){
    const c = await Stockage.lire(CLE_CFG);
    if(c) cfg = Object.assign(cfg, c);
    poser(estActif() ? "attente" : "off");
  }
  const enregistrerCfg = () => Stockage.ecrire({ ...cfg }, CLE_CFG);

  /* --- Base64 compatible UTF-8 --- */
  function versB64(s){
    const o = new TextEncoder().encode(s);
    let bin = "", pas = 0x8000;
    for(let i = 0; i < o.length; i += pas) bin += String.fromCharCode.apply(null, o.subarray(i, i+pas));
    return btoa(bin);
  }
  function depuisB64(s){
    const bin = atob(String(s).replace(/\s/g,""));
    const o = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(o);
  }

  const api = (chemin, opts = {}) => fetch("https://api.github.com" + chemin, Object.assign({}, opts, {
    headers: Object.assign({
      Authorization: "Bearer " + cfg.jeton,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
    }, opts.headers || {}),
  }));

  async function motErreur(r){
    let d = "";
    try{ d = (await r.json()).message || ""; }catch(e){}
    if(r.status === 401) return "Autorisation refusée — elle est peut-être expirée.";
    if(r.status === 403) return "Accès refusé — vérifiez les droits en écriture.";
    if(r.status === 404) return "Dépôt ou branche introuvable.";
    if(r.status === 409) return "Conflit de version côté GitHub.";
    return `${r.status} · ${d || "erreur inconnue"}`;
  }

  const urlFichier = () => `/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.chemin.replace(/^\/+/,"")}`;

  async function lireDistant(){
    const url = `${urlFichier()}?ref=${encodeURIComponent(cfg.branche)}`;
    const r = await api(url);
    if(r.status === 404) return { absent:true };
    if(!r.ok) throw new Error(await motErreur(r));
    const j = await r.json();
    /* GitHub n'inclut le contenu dans sa réponse que sous 1 Mo. Au-delà il
       renvoie une enveloppe vide : on redemande alors le fichier brut, dont
       la limite est cent fois plus haute. Sans cela, le carnet cesserait de
       se synchroniser au bout de deux ou trois ans d'usage. */
    if(j.content) return { sha:j.sha, donnees: JSON.parse(depuisB64(j.content)) };
    const brut = await api(url, { headers:{ Accept:"application/vnd.github.raw" } });
    if(!brut.ok) throw new Error(await motErreur(brut));
    return { sha:j.sha, donnees: JSON.parse(await brut.text()) };
  }

  async function ecrireDistant(){
    /* GitHub refuse l'écriture (409/422) si le fichier a changé depuis notre
       lecture. Plutôt que d'abandonner, on relit, on fusionne ce qui est
       arrivé entre-temps, et on réessaie. Trois tentatives suffisent
       largement : le cas ne se produit que si un autre appareil écrit
       exactement au même instant. */
    for(let essai = 1; essai <= 3; essai++){
      if(!db.modifie_le) db.modifie_le = new Date().toISOString();
      const instantane = db.modifie_le;
      const corps = {
        /* Sans indentation : sur dix ans, elle représenterait à elle seule
           près de deux mégaoctets. L'export téléchargé, lui, reste lisible. */
        message: `Carnet · ${nomAppareil()} · ${new Date().toLocaleString("fr-FR")}`,
        content: versB64(JSON.stringify(db)),
        branch: cfg.branche,
      };
      if(cfg.sha) corps.sha = cfg.sha;

      const r = await api(urlFichier(), { method:"PUT", body:JSON.stringify(corps) });

      if(r.ok){
        const j = await r.json();
        cfg.sha = j.content.sha;
        cfg.base = instantane;
        await enregistrerCfg();
        /* Une saisie est arrivée pendant l'envoi : on repart pour un tour. */
        if(db.modifie_le !== instantane) planifier();
        return;
      }

      if((r.status !== 409 && r.status !== 422) || essai === 3)
        throw new Error(await motErreur(r));

      const d = await lireDistant();
      if(d.absent){
        cfg.sha = null;               /* le fichier n'existe pas : on le crée */
      }else{
        cfg.sha = d.sha;
        adopter(fusionner(db, d.donnees));   /* on absorbe ce qui vient d'arriver */
      }
      await new Promise(res => setTimeout(res, 400 * essai));
    }
  }

  function adopter(donnees){
    const m = migrer(donnees);
    if(!m || !Array.isArray(m.taches)) throw new Error("Le fichier distant n'est pas un carnet.");
    /* Empreinte de l'état courant : si la version distante ne change rien,
       inutile de redessiner l'écran sous les yeux de l'utilisateur. */
    const empreinte = db ? JSON.stringify(db) : "";
    /* Une suppression est définitive : elle ne doit pas être oubliée parce
       qu'on adopte une version distante qui l'ignore. On conserve donc le
       registre local, on le réunit avec celui reçu, et on écarte des
       collections adoptées tout ce qui a été supprimé d'un côté ou de
       l'autre. Sans cela, un élément effacé ici revenait dès qu'un autre
       appareil renvoyait une version antérieure à sa suppression. */
    const registreLocal = (db && db.supprimes) || [];
    db = Object.assign(etatNeuf(), m);
    const vus = new Map();
    [...registreLocal, ...(db.supprimes || [])].forEach(x => {
      if(x && x.id && !vus.has(x.id)) vus.set(x.id, x);
    });
    db.supprimes = [...vus.values()].slice(-1000);
    COLLECTIONS.forEach(col => {
      if(Array.isArray(db[col])) db[col] = db[col].filter(x => !x || !vus.has(x.id));
    });
    db.version_schema = VERSION_SCHEMA;
    db.corbeille = db.corbeille || [];
    db.dossiers = db.dossiers || [];
    db.revenus = db.revenus || [];
    db.depenses = db.depenses || [];
    db.listes = db.listes || [];
    db.listes.forEach(l => { l.items = l.items || []; });
    db.sommeil = db.sommeil || [];
    db.projets = db.projets || [];
    db.projets.forEach(p => { p.lignes = p.lignes || []; p.taches = p.taches || [];
    if(typeof p.notes === "string"){ if(p.notes.trim()) (p.mur = p.mur || []).push({ id:uid(), titre:"", texte:p.notes }); delete p.notes; }
    p.mur = p.mur || []; });
    db.commandes = db.commandes || [];
    db.moyens = (db.moyens && db.moyens.length) ? db.moyens : MOYENS_SEED.map(m => ({ ...m }));
    db.garanties = db.garanties || [];
    db.bilans_mensuels = db.bilans_mensuels || {};
    db.coherence = db.coherence || [];
    db.taches = db.taches.map(t => tacheNeuve(t));
    delete db.vierge;
    appliquerTeinte(); appliquerTaille(); appliquerSombre();
    bascule(); purgerCorbeille(); dedoublonner();
    Stockage.ecrire(structuredClone(db));
    cfg.base = db.modifie_le || null;
    enregistrerCfg();
    if(typeof rendre === "function" && JSON.stringify(db) !== empreinte) rendre();
  }

  /* Décide seul dans les cas simples, demande à l'utilisateur si les deux
     côtés ont bougé depuis la dernière synchro. */
  async function synchroniser(manuel = false){
    if(!estActif()) return;
    if(enCours){ redemande = true; return; }
    /* Une adoption au milieu d'une saisie fait sauter l'écran : on laisse
       passer quelques secondes après le dernier geste. */
    if(!manuel && Date.now() - dernierGeste < 5000){ planifier(); return; }
    if(!navigator.onLine){ poser("erreur", "Hors ligne — la synchro reprendra au retour du réseau."); return; }
    enCours = true; redemande = false; poser("occupe");
    try{
      /* La lecture distante prend quelques secondes. Si l'utilisateur saisit
         pendant ce temps, la décision prise ensuite porterait sur un état
         périmé et effacerait sa saisie de l'écran — elle ne reviendrait
         qu'au tour de synchro suivant. On mémorise donc l'état d'avant. */
      const avant = db.modifie_le;
      const d = await lireDistant();
      const bougeEntreTemps = db.modifie_le !== avant;
      if(d.absent){ cfg.sha = null; await ecrireDistant(); poser("ok"); return; }
      cfg.sha = d.sha;
      /* Un appareil resté sur une version ancienne ne connaît pas les
         protections récentes : on le signale plutôt que de laisser
         l'utilisatrice chercher pourquoi ses saisies s'évaporent. */
      const vDistante = d.donnees.version_app || 0;
      retardataire = vDistante > 0 && vDistante < VERSION_APP ? vDistante : 0;

      const distant = d.donnees.modifie_le || null;
      const local = db.vierge ? null : (db.modifie_le || null);
      const base = cfg.base;
      /* Carnet encore vierge : on prend la version distante telle quelle,
         sans y verser les exemples de démonstration. */
      if(db.vierge && !bougeEntreTemps){ adopter(d.donnees); poser("ok"); return; }

      if(distant === local){ cfg.base = local; await enregistrerCfg(); poser("ok"); return; }
      /* Fichier distant sans horodatage : c'est notre propre écriture initiale,
         pas une modification concurrente. On le complète au lieu d'alerter. */
      if(!distant){ await ecrireDistant(); poser("ok"); return; }
      /* Appareil encore vierge : il adopte simplement ce qui existe. */
      if(!local && !bougeEntreTemps){ adopter(d.donnees); poser("ok"); return; }
      if(base && distant === base){ await ecrireDistant(); poser("ok"); return; }
      /* Même quand rien ne semble avoir bougé ici, on fusionne plutôt que
         d'adopter : c'est la seule façon de garantir qu'une saisie récente
         ne disparaisse pas, y compris si l'autre appareil tourne encore sur
         une version ancienne qui renverrait un carnet incomplet. */
      if(base && local === base && !bougeEntreTemps){
        adopter(fusionner(db, d.donnees)); poser("ok"); return;
      }

      /* Les deux côtés ont bougé : on réunit au lieu de choisir. */
      const fusion = fusionner(db, d.donnees);
      adopter(fusion);
      await ecrireDistant();
      poser("ok", "Versions réunies.");
    }catch(e){
      poser("erreur", e.message || String(e));
    }finally{
      enCours = false;
      dernierPull = Date.now();
      if(redemande){ redemande = false; setTimeout(() => synchroniser(false), 400); }
    }
  }

  function planifier(){
    if(!estActif()) return;
    poser("attente");
    clearTimeout(minuteur);
    minuteur = setTimeout(() => synchroniser(false), 2500);
  }

  /* Relève régulière tant que l'onglet est visible.
     Sans elle, un appareil resté ouvert ignore ce que l'autre a poussé et
     ne le découvre qu'au moment où l'on modifie quelque chose — c'est-à-dire
     une fois le conflit déjà créé. En allant chercher toutes les deux minutes,
     la version distante est adoptée en silence tant que rien n'a été saisi ici. */
  function lancerVeille(){
    clearInterval(veille);
    veille = setInterval(() => {
      if(document.hidden || !estActif() || enCours) return;
      if(dlg.open) return;
      synchroniser(false);
    }, 120000);
  }

  async function connecter(nouveau){
    cfg = Object.assign(cfg, nouveau, { actif:true, sha:null, base:null });
    await enregistrerCfg();
    poser("occupe");
    await synchroniser(true);
  }
  async function deconnecter(){
    cfg = { actif:false, owner:"", repo:"", chemin:"carnet.json", branche:"main", jeton:"", sha:null, base:null };
    await enregistrerCfg();
    poser("off");
    if(typeof rendre === "function") rendre();
  }

  function auRetour(){
    if(!estActif()) return;
    if(Date.now() - dernierPull < 8000) return;
    synchroniser(false);
  }

  const versionEnRetard = () => retardataire;
  return { charger, lireCfg, lireEtat, estActif, planifier, synchroniser, connecter, deconnecter,
           auRetour, lancerVeille, noterGeste, versionEnRetard };
})();

/* =====================================================================
   2. MODÈLE
   ===================================================================== */
const VERSION_SCHEMA = 16;
const VERSION_APP = 138;

const uid = () => (crypto.randomUUID ? crypto.randomUUID()
  : Date.now().toString(36) + Math.random().toString(36).slice(2,9));

/* =====================================================================
   PIÈCES JOINTES (photos, documents) — stockées uniquement en local
   (voir Stockage.ecrirePiece/lirePiece/supprimerPiece ci-dessus), jamais
   dans le fichier synchronisé. L'objet lui-même ne garde qu'un petit
   résumé { id, nom, type, taille } : assez pour l'afficher, montrer une
   pièce absente sur un autre appareil, mais rien de lourd à synchroniser.
   ===================================================================== */
function formatTaille(o){
  if(o == null) return "";
  if(o < 1024) return `${o} o`;
  if(o < 1024*1024) return `${Math.round(o/1024)} Ko`;
  return `${(o/(1024*1024)).toFixed(1)} Mo`;
}

/* Redimensionne et compresse une image avant stockage — une photo de
   téléphone fait souvent plusieurs Mo ; ramenée à 1600px de large et en
   JPEG à qualité 82%, elle tient en quelques centaines de Ko sans perte
   visible à l'écran. Un PDF ou autre document n'est jamais touché. */
function comprimerImage(file, maxDim = 1600, qualite = 0.82){
  return new Promise((resolve) => {
    try{
      const img = new Image();
      const url = URL.createObjectURL(file);
      const echec = () => { try{ URL.revokeObjectURL(url); }catch(e){} resolve(file); }; // on garde l'original si ça rate
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const ratio = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * ratio); height = Math.round(height * ratio);
        }
        try{
          const toile = document.createElement("canvas");
          toile.width = width; toile.height = height;
          toile.getContext("2d").drawImage(img, 0, 0, width, height);
          toile.toBlob(blob => { try{ URL.revokeObjectURL(url); }catch(e){} resolve(blob || file); }, "image/jpeg", qualite);
        }catch(e){ echec(); }
      };
      img.onerror = echec;
      img.src = url;
    }catch(e){ resolve(file); } // navigateur sans URL.createObjectURL ou autre imprévu : on garde l'original
  });
}

/* Lit un <input type="file">, compresse si c'est une image, enregistre en
   local et renvoie le petit résumé à accrocher à l'objet (dépense, note,
   garantie…) — ne touche pas encore à la synchronisation ni au rendu :
   c'est à l'appelant de faire `ref.piece_jointe = resume; touche(ref); maj();`. */
async function memoriserPieceJointe(file){
  if(!file) return null;
  const estImage = (file.type||"").startsWith("image/");
  let blob = file, type = file.type || "application/octet-stream";
  if(estImage){ blob = await comprimerImage(file); type = "image/jpeg"; }
  if(blob.size > 15*1024*1024){
    alert("Ce fichier dépasse 15 Mo, trop lourd pour être stocké sur l'appareil. Essayez une version plus légère.");
    return null;
  }
  const id = uid();
  const nom = estImage ? file.name.replace(/\.[^.]+$/, "") + ".jpg" : file.name;
  const ok = await Stockage.ecrirePiece(id, { blob, type, nom });
  if(!ok){ alert("Impossible d'enregistrer la pièce jointe sur cet appareil."); return null; }
  return { id, nom, type, taille: blob.size };
}

/* iOS Safari bloque souvent window.open() dès qu'il arrive après une
   attente asynchrone, même très courte (ce qui est notre cas : on va
   chercher la pièce dans IndexedDB avant de pouvoir l'afficher) — le
   nouvel onglet reste alors bloqué sans message d'erreur visible. On
   affiche donc l'aperçu directement dans l'appli, jamais dans un nouvel

/* =====================================================================
   COHÉRENCE CARDIAQUE — méthode 365 : 6 respirations par minute (5 s
   inspiration + 5 s expiration), pendant 5 minutes. Le cercle grandit sur
   l'inspiration, se rétracte sur l'expiration ; le décompte ne repasse
   jamais par rendre() pendant la séance (ça casserait la transition CSS
   en recréant le cercle à chaque tick) — seuls le texte du minuteur et la
   classe du cercle sont modifiés directement. */
let coherenceMinuteur = null;
let coherenceRestant = 300;
let coherencePhase = "inspire";

function demarrerCoherence(){
  vue.coherenceSeance = true;
  coherenceRestant = 300;
  coherencePhase = "inspire";
  rendre();
  clearInterval(coherenceMinuteur);
  coherenceMinuteur = setInterval(coherenceTick, 1000);
}

function coherenceTick(){
  coherenceRestant--;
  const t = document.getElementById("coherenceTemps");
  if(t) t.textContent = coherenceFormatTemps(coherenceRestant);
  if(coherenceRestant > 0 && coherenceRestant % 5 === 0) coherenceBasculerPhase();
  if(coherenceRestant <= 0) terminerCoherence(true);
}

function coherenceBasculerPhase(){
  coherencePhase = coherencePhase === "inspire" ? "expire" : "inspire";
  const cercle = document.getElementById("coherenceCercle");
  const mot = document.getElementById("coherenceMot");
  if(cercle) cercle.classList.toggle("grand", coherencePhase === "inspire");
  if(mot) mot.textContent = coherencePhase === "inspire" ? "Inspirez" : "Expirez";
}

function coherenceFormatTemps(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${m}:${String(sec).padStart(2,"0")} restantes`;
}

function terminerCoherence(complet){
  clearInterval(coherenceMinuteur); coherenceMinuteur = null;
  const duree = 300 - coherenceRestant;
  /* En dessous de 10 secondes, ça n'a pas de sens de le compter comme une
     vraie séance — probablement une fermeture par erreur. */
  if(duree >= 10){
    db.coherence = db.coherence || [];
    db.coherence.push(touche({ id:uid(), date:jourISO(), duree_secondes:duree }));
    sauver();
  }
  vue.coherenceSeance = false;
  rendre();
}

function vueSeanceCoherence(){
  return `<div class="coherence-ecran">
    <div class="coherence-haut">
      <button class="retour" data-act="arreterCoherence">← Arrêter</button>
      <span class="coherence-temps" id="coherenceTemps">${coherenceFormatTemps(coherenceRestant)}</span>
    </div>
    <div class="coherence-zone">
      <div class="coherence-cercle-ext">
        <div class="coherence-cercle ${coherencePhase === "inspire" ? "grand" : ""}" id="coherenceCercle">
          <span class="coherence-mot" id="coherenceMot">${coherencePhase === "inspire" ? "Inspirez" : "Expirez"}</span>
        </div>
      </div>
      <div class="coherence-souscription">Respirez à votre rythme, le cercle vous guide</div>
    </div>
    <div><button type="button" class="btn-coherence-arreter" data-act="arreterCoherence">Terminer maintenant</button></div>
  </div>`;
}

/* ---- Page Suivi : historique des séances ---- */
function vueCoherencePage(){
  const h = [`<button class="retour" data-act="fermerCoherence">← Suivi</button>`,
    `<div class="entete-d"><h1 class="titre">Cohérence cardiaque</h1></div>`,
    `<p class="petit-detail" style="margin:0 0 16px">Méthode 365 — 6 respirations par minute pendant 5 minutes. Idéalement 3 fois par jour.</p>`,
    `<button class="btn" style="width:100%;margin-bottom:20px" data-act="demarrerCoherence">Commencer une séance</button>`];
  const seances = [...(db.coherence||[])].sort((a,b) => (b.date||"").localeCompare(a.date||"") || (b.maj_le||"").localeCompare(a.maj_le||""));
  if(!seances.length){
    h.push(vide("Aucune séance encore", "Elle apparaîtra ici une fois la première terminée."));
    return h.join("");
  }
  h.push(`<div class="oeil">Historique</div>`);
  h.push(`<div class="fiche liste">${seances.slice(0,60).map(s => {
    const m = Math.floor(s.duree_secondes/60), sec = s.duree_secondes%60;
    return `<div class="ligne"><div class="corps">
      <div class="intitule">${dateLongue(s.date)}</div></div>
      <div class="outils"><span class="puce">${m}:${String(sec).padStart(2,"0")}</span></div>
    </div>`;
  }).join("")}</div>`);
  return h.join("");
}

/* Pour sortir une pièce jointe du navigateur — vers les Fichiers ou les
   Photos de l'iPhone, par exemple — plutôt que de compter uniquement sur
   ce stockage local qu'un nettoyage de Safari pourrait effacer. */
async function telechargerPieceJointe(resume){
  if(!resume || !resume.id) return;
  const piece = await Stockage.lirePiece(resume.id);
  if(!piece){ alert("Cette pièce jointe n'est pas disponible sur cet appareil — elle est stockée en local et ne suit pas la synchronisation."); return; }
  const url = URL.createObjectURL(piece.blob);
  const a = document.createElement("a");
  a.href = url; a.download = resume.nom || "piece-jointe";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* Petit bloc HTML réutilisable : soit le résumé de la pièce jointe avec
   ses actions, soit une invite à en ajouter une. `genre` et `refId`
   identifient l'objet porteur pour router les clics (voir les data-pj-*). */
function blocPieceJointe(genre, refId, resume){
  if(resume) return `<div class="piece-jointe">
    <button type="button" class="pj-nom" data-act="voirPJ" data-pjgenre="${genre}" data-pjid="${refId}" title="Ouvrir">
      📎 ${resume.type === "application/pdf" ? "Document" : "Photo"} : ${ech(resume.nom)}
      <span class="petit-detail">(${formatTaille(resume.taille)})</span>
    </button>
    <button type="button" class="ico" data-act="telechargerPJ" data-pjgenre="${genre}" data-pjid="${refId}" title="Télécharger vers l'appareil">⇩</button>
    <button type="button" class="ico sup" data-act="retirerPJ" data-pjgenre="${genre}" data-pjid="${refId}" title="Retirer la pièce jointe">✕</button>
  </div>`;
  return `<label class="btn mini creux pj-ajouter">+ Ajouter une photo ou un document
    <input type="file" accept="image/*,application/pdf" data-pjgenre="${genre}" data-pjid="${refId}" style="display:none">
  </label>`;
}

/* Retrouve/applique le résumé d'une pièce jointe pour l'un des porteurs
   actuels (dépense, note de projet ou de dossier). Seul endroit à étendre
   si un jour un quatrième type doit aussi pouvoir en porter une. */
function lireResumePJ(genre, refId){
  if(genre === "depense") return ((db.depenses||[]).find(x => x.id === refId) || {}).piece_jointe || null;
  if(genre === "garantie") return ((db.garanties||[]).find(x => x.id === refId) || {}).piece_jointe || null;
  if(genre === "noteProjet" || genre === "noteDossier"){
    const [pid, nid] = refId.split("::");
    const parent = genre === "noteProjet" ? (db.projets||[]).find(x => x.id === pid) : dossDe(pid);
    const n = parent && (parent.mur||[]).find(y => y.id === nid);
    return (n && n.piece_jointe) || null;
  }
  return null;
}
function appliquerPJ(genre, refId, resume){
  if(genre === "depense"){
    const x = (db.depenses||[]).find(y => y.id === refId);
    if(!x) return;
    x.piece_jointe = resume; touche(x);
  }else if(genre === "garantie"){
    const x = (db.garanties||[]).find(y => y.id === refId);
    if(!x) return;
    x.piece_jointe = resume; touche(x);
  }else if(genre === "noteProjet" || genre === "noteDossier"){
    const [pid, nid] = refId.split("::");
    const parent = genre === "noteProjet" ? (db.projets||[]).find(x => x.id === pid) : dossDe(pid);
    const n = parent && (parent.mur||[]).find(y => y.id === nid);
    if(!n) return;
    n.piece_jointe = resume; touche(parent);
  }else return;
  /* Si une fenêtre modale (la fiche dépense, par exemple) est encore
     ouverte et affiche cette pièce jointe, on la rafraîchit sur place —
     sans ça elle resterait figée sur l'ancien état jusqu'à rouvrir la
     fiche. Même esprit que pour les sous-tâches d'une tâche. */
  if(dlg.open){
    const cible = dlg.querySelector(`[data-pjgenre="${genre}"][data-pjid="${refId}"]`);
    const conteneur = cible && cible.closest(".piece-jointe, .pj-ajouter");
    if(conteneur){
      const temp = document.createElement("div");
      temp.innerHTML = blocPieceJointe(genre, refId, resume);
      conteneur.replaceWith(temp.firstElementChild);
    }
  }
  maj();
}
document.addEventListener("change", ev => {
  const inp = ev.target;
  if(!(inp.matches && inp.matches('input[type="file"][data-pjgenre]'))) return;
  const genre = inp.dataset.pjgenre, refId = inp.dataset.pjid;
  const file = inp.files[0];
  if(!file) return;
  memoriserPieceJointe(file).then(resume => { if(resume) appliquerPJ(genre, refId, resume); });
});

const jourISO = (d = new Date()) =>
  `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const versDate = iso => new Date(iso + "T00:00:00");
const ecartJours = (a,b) => Math.round((versDate(b) - versDate(a)) / 86400000);

function ajouterPeriode(iso, n, unite){
  const d = versDate(iso);
  if(unite === "jour") d.setDate(d.getDate() + n);
  else if(unite === "semaine") d.setDate(d.getDate() + n*7);
  else if(unite === "mois"){ const j = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n);
    d.setDate(Math.min(j, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  else if(unite === "an"){ const j = d.getDate(); d.setDate(1); d.setFullYear(d.getFullYear()+n);
    d.setDate(Math.min(j, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  return jourISO(d);
}

const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

const JOURS = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
const dateLongue = iso => { const d = versDate(iso); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; };
const dateMoyenne = iso => { const d = versDate(iso); return `${d.getDate()} ${MOIS[d.getMonth()].slice(0,4)}`; };
const dateCourte = iso => { const d = versDate(iso);
  return `${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getFullYear()).slice(2)}`; };
function resteEnMots(iso, ref = jourISO()){
  const n = ecartJours(ref, iso);
  if(n < -1) return `en retard de ${-n} j`;
  if(n === -1) return "hier";
  if(n === 0) return "aujourd'hui";
  if(n === 1) return "demain";
  if(n < 31) return `dans ${n} j`;
  if(n < 365) return `dans ${Math.round(n/30)} mois`;
  return `dans ${(n/365).toFixed(1).replace(".",",")} an`;
}

/* --- Calendrier français --- */
/* Pâques par l'algorithme de Meeus : tous les fériés mobiles en découlent. */
function paques(a){
  const n = a % 19, c = Math.floor(a/100), d = a % 100;
  const e = Math.floor(c/4), f = c % 4, g = Math.floor((c+8)/25);
  const h = Math.floor((c-g+1)/3), i = (19*n + c - e - h + 15) % 30;
  const k = Math.floor(d/4), l = d % 4;
  const m = (32 + 2*f + 2*k - i - l) % 7;
  const o = Math.floor((n + 11*i + 22*m)/451);
  const mois = Math.floor((i + m - 7*o + 114)/31);
  const jour = ((i + m - 7*o + 114) % 31) + 1;
  return new Date(a, mois-1, jour);
}
const feriesCache = {};
function feries(a){
  if(feriesCache[a]) return feriesCache[a];
  const p = paques(a), dec = n => { const d = new Date(p); d.setDate(d.getDate()+n); return jourISO(d); };
  const f = {
    [`${a}-01-01`]:"Jour de l'an", [dec(1)]:"Lundi de Pâques", [`${a}-05-01`]:"Fête du travail",
    [`${a}-05-08`]:"Victoire 1945", [dec(39)]:"Ascension", [dec(50)]:"Lundi de Pentecôte",
    [`${a}-07-14`]:"Fête nationale", [`${a}-08-15`]:"Assomption", [`${a}-11-01`]:"Toussaint",
    [`${a}-11-11`]:"Armistice", [`${a}-12-25`]:"Noël",
  };
  return feriesCache[a] = f;
}
const ferieDe = iso => feries(+iso.slice(0,4))[iso] || null;

  }
  if((x.version_schema ?? 11) < 12){
    x.version_schema = 12;
    x.sommeil = x.sommeil || [];
  }
  if((x.version_schema ?? 10) < 11){
    x.version_schema = 11;
    x.listes = x.listes || [];
  }
  if((x.version_schema ?? 9) < 10){
    x.version_schema = 10;
    x.emplois = x.emplois || [];
  }
  if((x.version_schema ?? 8) < 9){
    x.version_schema = 9;
    x.habitudes = x.habitudes || [];
    x.habitudes_faites = x.habitudes_faites || [];
  }
  if((x.version_schema ?? 7) < 8){

      }

    });
