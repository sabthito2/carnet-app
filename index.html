<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E6E8E0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<title>Carnet</title>
<style>
  :root{
    --papier:#E6E8E0; --fiche:#F1F2EC; --fiche-2:#E9EBE3;
    --encre:#1C2230; --encre-2:#5C6373; --encre-3:#8C93A0;
    --filet:#C7CABE; --filet-fort:#AEB2A4;
    --accent:#1E5A6E; --accent-pale:#DCE8EC;
    --rouge:#A8372B; --rouge-pale:#F6E3E0; --vert:#3D7A50;
    --r:3px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--papier);color:var(--encre);font-family:var(--sans);font-size:15px;line-height:1.45;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  a{color:var(--accent)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .app{display:flex;min-height:100dvh}
  .rail{width:196px;flex:none;border-right:1px solid var(--filet);padding:22px 0 22px 18px;position:sticky;top:0;height:100dvh}
  .marque{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--encre-2);margin-bottom:2px}
  .marque b{color:var(--accent);font-weight:700}
  /* Quatre teintes d'accent au choix, appliquées au chargement. */
  .jour{font-family:var(--mono);font-size:11.5px;color:var(--encre-3);margin-bottom:26px}
  .nav{display:flex;flex-direction:column;gap:1px}
  .nav button{background:none;border:0;text-align:left;padding:7px 10px 7px 0;color:var(--encre-2);
    display:flex;align-items:baseline;gap:9px;border-radius:var(--r)}
  .nav button .n{font-family:var(--mono);font-size:10.5px;color:var(--encre-3)}
  .nav button .pastille{margin-left:auto;font-family:var(--mono);font-size:10.5px;
    background:var(--accent-pale);color:var(--accent);padding:0 5px;border-radius:8px}
  .nav button.on{color:var(--encre);font-weight:600}
  .nav button.on .n{color:var(--accent)}
  .nav button:hover{color:var(--encre)}

  main{flex:1;min-width:0;padding:26px 26px 90px;max-width:880px}
  .titre{font-size:26px;font-weight:640;letter-spacing:-.02em;margin:0 0 2px}
  .grand-jour{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:6px}
  .grand-jour .sem{font-size:19px;font-weight:500;color:var(--encre-2);text-transform:capitalize}
  .grand-jour .chiffre{font-family:var(--mono);font-size:46px;line-height:1;font-weight:500;
    letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .grand-jour .mois{font-size:22px;font-weight:560}
  .sous{color:var(--encre-2);font-size:13.5px;margin:0 0 22px}
  .oeil{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--encre-3);
    display:flex;align-items:center;gap:10px;margin:26px 0 9px}
  .oeil::after{content:"";flex:1;height:1px;background:var(--filet)}
  .oeil .cpt{color:var(--accent)}
  .oeil .a-droite{font-family:var(--mono);font-size:10.5px;color:var(--encre-3);order:3;letter-spacing:.06em}

  .fiche{background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r)}
  .liste{display:flex;flex-direction:column}
  .liste>*+*{border-top:1px solid var(--filet)}

  .ligne{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;position:relative;background:var(--fiche)}
  .ligne:first-child{border-top-left-radius:var(--r);border-top-right-radius:var(--r)}
  .ligne:last-child{border-bottom-left-radius:var(--r);border-bottom-right-radius:var(--r)}
  .cases{display:flex;gap:6px;padding-top:1px;flex:none}
  .case{width:22px;height:22px;border:1.5px solid var(--filet-fort);background:transparent;display:grid;place-items:center;
    padding:0;color:transparent;flex:none;border-radius:3px}
  .case:hover{border-color:var(--encre-2)}
  .case svg{width:12px;height:12px;display:block}
  .case.carre.coche{background:var(--vert);border-color:var(--vert);color:#fff}
  .case.fleche{color:var(--filet-fort);font-size:14px;line-height:1;font-weight:700;border-style:solid}
  .case.fleche:hover{color:var(--encre-2)}
  .case.fleche.coche{background:var(--accent);border-color:var(--accent);color:#fff}
  .corps{flex:1;min-width:0}
  .intitule{word-break:break-word}
  .ligne.faite .intitule{color:var(--encre-3);text-decoration:line-through;text-decoration-color:var(--filet-fort)}
  .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin-top:4px}
  /* Pastilles sans cadre : la couleur et le point suffisent à distinguer,
     et la place gagnée sert à agrandir le texte. */
  .puce{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;padding:0;
    color:var(--encre-2);background:none;border:0;display:inline-flex;align-items:center}
  .puce.ctx{color:var(--accent);font-weight:600}
  .puce.ctx::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
    display:inline-block;margin-right:5px;flex:none}
  .puce.trav{color:var(--encre);font-weight:600}
  .puce.trav::before{content:"";width:6px;height:6px;border-radius:1px;background:var(--encre);
    display:inline-block;margin-right:5px;flex:none}
  .puce.doss{color:var(--encre)}
  .puce.doss::before{content:"";width:6px;height:6px;border-radius:1px;background:var(--filet-fort);
    display:inline-block;margin-right:5px;flex:none}
  .puce.chaud{color:var(--rouge);font-weight:600}
  .puce.date{font-variant-numeric:tabular-nums}
  .puce.veille{color:var(--encre-3);font-style:italic}
  .repousse{font-family:var(--mono);font-size:11.5px;color:var(--encre-3);font-style:italic}
  .repousse.chaud{color:var(--rouge)}
  .outils{display:flex;gap:2px;flex:none;opacity:0;transition:opacity .12s}
  .ligne:hover .outils,.ligne:focus-within .outils{opacity:1}
  @media(hover:none){.outils{opacity:1}}
  .ico{background:none;border:0;color:var(--encre-3);padding:6px 8px;border-radius:var(--r);font-size:14px;line-height:1}
  .ico:hover{color:var(--encre);background:var(--fiche-2)}
  .ico.sup:hover{color:var(--rouge)}
  .ico.mont:hover{color:var(--accent)}
  .ico.actif{color:var(--accent)}
  .rdv-l{align-items:baseline}
  .heure-c{font-family:var(--mono);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none;
    width:44px;color:var(--accent);font-weight:600}
  .heure-c.ferie{color:var(--rouge)}
  .jour-prel{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;flex:none;
    width:26px;text-align:center;color:var(--accent);border:1px solid var(--accent);border-radius:2px;
    padding:1px 0;background:var(--accent-pale);height:20px;line-height:16px}
  .jour-prel.passe{color:var(--encre-3);border-color:var(--filet);background:transparent}
  .somme{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:1px}

  .tampon{position:absolute;right:14px;top:50%;pointer-events:none;font-family:var(--mono);font-size:10px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:2px;
    padding:2px 7px;background:rgba(235,227,247,.75);transform:translateY(-50%) rotate(-7deg);
    animation:tamponner .45s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes surgir{0%{background:var(--accent-pale)}100%{background:var(--fiche)}}
  .ligne.neuf{animation:surgir 1.6s ease-out}
  @media(prefers-reduced-motion:reduce){.ligne.neuf{animation:none;background:var(--accent-pale)}}
  /* Un anneau pour une date dépassée, un disque plein pour l'urgence :
     deux signaux rouges, mais qu'on distingue d'un coup d'œil. */
  .point-retard{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--rouge);
    margin-right:7px;vertical-align:0;flex:none}
  .point-urgent{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--rouge);
    margin-right:7px;vertical-align:0;flex:none}
  .txt-urgent{font-weight:600}
  .ico.urg{color:var(--filet-fort)}
  .ico.urg:hover{color:var(--rouge)}
  .ico.urg.actif{color:var(--rouge)}
  @keyframes tamponner{0%{opacity:0;transform:translateY(-50%) rotate(-7deg) scale(2.4)}60%{opacity:1}
    100%{opacity:1;transform:translateY(-50%) rotate(-7deg) scale(1)}}
  @media(prefers-reduced-motion:reduce){.tampon{animation:none}}

  .saisie{display:flex;gap:8px;margin-bottom:14px}
  .saisie input{flex:1;background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r);padding:10px 12px;min-width:0}
  .saisie input:focus{border-color:var(--accent);outline:none}
  .saisie input.court{flex:0 0 110px;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .aide{font-family:var(--mono);font-size:11px;color:var(--encre-3);margin:-8px 0 18px}
  .aide b{color:var(--accent);font-weight:400}

  .btn{background:var(--encre);color:var(--papier);border:1px solid var(--encre);border-radius:var(--r);
    padding:9px 15px;font-size:14px;font-weight:500}
  .btn:hover{background:#2A3144}
  .btn.creux{background:transparent;color:var(--encre);border-color:var(--filet-fort)}
  .btn.creux:hover{background:var(--fiche);border-color:var(--encre-2)}
  .btn.mini{padding:5px 11px;font-size:12.5px}
  .btn.danger{color:var(--rouge);border-color:var(--rouge);background:transparent}
  .btn.danger:hover{background:var(--rouge-pale)}

  .filtres{display:flex;flex-wrap:wrap;gap:2px 20px;margin-bottom:14px}
  .filtres.spheres{gap:2px 18px;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--filet)}
  .boites{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin:-6px 0 12px}
  .segments{display:inline-flex;border:1.5px solid var(--filet-fort);border-radius:var(--r);overflow:hidden}
  .seg{background:transparent;border:0;padding:6px 15px;font-size:13.5px;color:var(--encre-2)}
  .seg+.seg{border-left:1.5px solid var(--filet-fort)}
  .seg:hover{background:var(--fiche-2);color:var(--encre)}
  .seg.on{background:var(--accent);color:#fff;font-weight:600}
  .boite-note{font-size:11.5px;color:var(--encre-3);letter-spacing:.02em}
  .filtre{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;
    padding:3px 0 4px;font-size:14.5px;color:var(--encre-3);display:flex;align-items:baseline;gap:6px}
  .filtre .n{font-family:var(--mono);font-size:11px;color:var(--encre-3)}
  .filtre:hover{color:var(--encre)}
  .filtre.on{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
  .filtre.on .n{color:var(--accent)}
  .filtre.doss.on{color:var(--encre);border-bottom-color:var(--encre)}
  .filtre.doss.on .n{color:var(--encre-2)}

  /* ---------- Budget ---------- */
  .compteur{border:1px solid var(--filet);background:var(--fiche);border-radius:var(--r);padding:18px 18px 16px;margin-bottom:20px}
  .compteur .etiq{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--encre-3)}
  /* Discret : lisible pour soi, difficile à déchiffrer par-dessus l'épaule. */
  .grand{font-family:var(--mono);font-size:23px;line-height:1.15;font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;margin:4px 0 2px;font-weight:600}
  .grand.neg{color:var(--rouge)}
  .grand .u{font-size:15px;color:var(--encre-3)}
  .parjour{font-size:13.5px;color:var(--encre-2)}
  .parjour b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
  .jauge{height:5px;background:var(--fiche-2);border:1px solid var(--filet);border-radius:3px;margin:14px 0 7px;overflow:hidden}
  .jauge i{display:block;height:100%;background:var(--accent)}
  .jauge i.trop{background:var(--rouge)}
  .repere{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--encre-3)}
  .petit-detail{font-size:11.5px;color:var(--encre-3);line-height:1.4;margin-top:3px}
  .explique{font-size:12.5px;color:var(--encre-2);line-height:1.5;margin:6px 2px 4px;max-width:62ch;
    padding:9px 11px;background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r)}
  .aide-q{background:none;border:0;padding:4px 0;margin:5px 0 0;font-size:12px;color:var(--encre-3);
    text-decoration:underline;text-underline-offset:3px}
  .aide-q:hover{color:var(--accent)}
  .bilan{display:flex;flex-wrap:wrap;gap:0;border:1px solid var(--filet);border-radius:var(--r);background:var(--fiche);margin-bottom:6px}
  .bilan div{flex:1;min-width:132px;padding:11px 13px;border-right:1px solid var(--filet)}
  .bilan div:last-child{border-right:0}
  .bilan .e{font-size:11px;color:var(--encre-3);line-height:1.25}
  .bilan .v{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums;margin-top:2px}
  .bilan .v.moins{color:var(--rouge)}
  .bilan .v.plus{color:var(--vert)}
  .barre-cat{display:flex;align-items:center;gap:10px;padding:7px 12px}
  .barre-cat .nom{flex:0 0 33%;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .barre-cat .tige{flex:1;height:9px;background:var(--fiche-2);border-radius:2px;overflow:hidden}
  .barre-cat .tige i{display:block;height:100%;background:var(--accent);opacity:.75}
  .barre-cat .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;flex:none;color:var(--encre-2)}
  .sync{cursor:pointer;font-size:15px;vertical-align:-1px;letter-spacing:0;padding:0 2px}
  .sync .heure{font-size:12px;letter-spacing:.02em;margin-left:2px}
  .sync.ok{color:var(--vert)}
  .sync.attente{color:var(--encre-3)}
  .sync.occupe{color:var(--accent);animation:pulser 1.1s ease-in-out infinite}
  .sync.conflit,.sync.erreur{color:var(--rouge)}
  @keyframes pulser{0%,100%{opacity:.35}50%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.sync.occupe{animation:none}}
  .teintes{display:flex;gap:10px;flex-wrap:wrap}
  .teinte{width:34px;height:34px;border-radius:50%;border:2px solid transparent;padding:0;
    box-shadow:inset 0 0 0 1px rgba(28,34,48,.12)}
  .teinte.on{border-color:var(--encre);box-shadow:inset 0 0 0 2px var(--papier)}
  .loupe{background:none;border:0;padding:2px 5px;color:var(--encre-2);font-size:19px;line-height:1;
    cursor:pointer;vertical-align:-3px;border-radius:var(--r)}
  .loupe:hover{color:var(--accent);background:var(--fiche-2)}
  .champ-rech{width:100%;background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r);
    padding:11px 13px;font-size:16px}
  .champ-rech:focus{border-color:var(--accent);outline:none}
  .rech-vide{color:var(--encre-3);font-size:13px;margin:14px 2px;text-align:center}
  /* Suivi d'habitudes : sept ronds par ligne, assez gros pour le pouce. */
  .habitudes{padding:4px 10px 8px}
  .hab-entete,.hab-ligne{display:grid;grid-template-columns:1fr repeat(7, 30px);align-items:center;gap:2px}
  .hab-entete{font-family:var(--mono);font-size:10px;color:var(--encre-3);padding:5px 0 3px}
  .hab-entete span{text-align:center}
  .hab-entete span.auj{color:var(--accent);font-weight:700}
  .hab-ligne{padding:5px 0;border-top:1px solid var(--filet)}
  .hab-nom{font-size:13.5px;padding-right:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hab-nom .serie{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--accent);margin-left:6px}
  .hab-nom .bilan-mois{font-family:var(--mono);font-style:normal;font-size:10px;color:var(--encre-3);margin-left:6px}
  .rond{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--filet-fort);background:transparent;
    padding:0;justify-self:center}
  .rond:hover{border-color:var(--encre-2)}
  .rond.plein{background:var(--accent);border-color:var(--accent)}
  .rond.auj{border-width:2.5px}
  .rond.futur{opacity:.3;border-style:dashed}
  @media(max-width:820px){
    .hab-entete,.hab-ligne{grid-template-columns:1fr repeat(7, 32px)}
    .rond{width:27px;height:27px}
  }
  .pied{margin:34px 0 0;padding-top:16px;border-top:1px solid var(--filet);display:flex;justify-content:center}
  .pied{gap:14px;align-items:baseline}
  .pied button{background:none;border:0;color:var(--encre-3);font-size:13px;padding:8px 14px;border-radius:var(--r)}
  .pied button:hover{color:var(--accent);background:var(--fiche)}
  .pied-version{font-family:var(--mono);font-size:10.5px;color:var(--filet-fort);letter-spacing:.06em}
  .filet-rappel{background:none;border:0;padding:0;margin:-6px 0 16px;display:block;
    font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--encre-3);text-align:left}
  .filet-rappel:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
  .filet-rappel.doux{margin:-4px 0 14px;font-size:11px;color:var(--encre-2)}
  .filet-rappel.doux .point-retard{width:7px;height:7px;margin-right:6px;vertical-align:0}
  .lien-mois{background:none;border:0;padding:0;color:var(--accent);font-size:13.5px;
    text-decoration:underline;text-underline-offset:3px}
  .lien-mois:hover{color:var(--encre)}
  .prive{display:inline-flex;align-items:baseline;gap:9px;border:1px solid var(--filet);background:transparent;
    border-radius:12px;padding:3px 12px;margin:-8px 0 20px;font-family:var(--mono);font-size:11px;
    color:var(--encre-3);letter-spacing:.04em}
  .prive:hover{border-color:var(--filet-fort);color:var(--encre-2)}
  .prive .v{font-variant-numeric:tabular-nums;color:var(--encre-2)}
  .prive .v.neg{color:var(--rouge)}
  .prive .oeilleton{opacity:.55}

  .tab{width:100%;border-collapse:collapse;font-size:13.5px}
  .tab th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--encre-3);font-weight:400;padding:8px 11px;border-bottom:1px solid var(--filet-fort);white-space:nowrap}
  .tab td{padding:9px 11px;border-bottom:1px solid var(--filet);vertical-align:top}
  .tab tr:last-child td{border-bottom:0}
  .tab td.num{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tab .nom{font-weight:560;background:none;border:0;padding:0;text-align:left;color:var(--encre)}
  .tab .nom:hover{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .note-min{font-size:11.5px;color:var(--encre-3);margin-top:2px;display:block;max-width:230px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lien{font-family:var(--mono);font-size:11px;text-decoration:none;border:1px solid var(--filet);border-radius:9px;
    padding:1px 8px;color:var(--accent);white-space:nowrap;display:inline-block}
  .lien:hover{background:var(--accent-pale);border-color:var(--accent)}
  .cartes{display:none}

  .retour{background:none;border:0;padding:0;color:var(--encre-2);font-family:var(--mono);font-size:11px;
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
  .retour:hover{color:var(--accent)}
  .entete-d{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  .entete-d .titre{flex:1;min-width:0}
  .bloc-notes{background:var(--fiche);border:1px solid var(--filet);border-radius:var(--r)}
  .bloc-notes textarea{width:100%;background:transparent;border:0;padding:12px 13px;min-height:96px;resize:vertical;

<body>
<div class="app">
  <aside class="rail">
    <div class="marque">Car<b>net</b></div>
    <div class="jour" id="jourRail"></div>

<script>
"use strict";

/* =====================================================================
   1. STOCKAGE — seule porte vers les données.
   Pour brancher une synchro un jour : réécrire lire() et ecrire().
   ===================================================================== */
const Stockage = (() => {
  const NOM = "carnet", MAG = "etat", CLE = "db";
  let idb = null, memoire = {}, dispo = false;
  function ouvrir(){
    return new Promise(res => {
      if(!("indexedDB" in window)) return res(null);
      let r; try{ r = indexedDB.open(NOM, 1); }catch(e){ return res(null); }
      r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(MAG)) r.result.createObjectStore(MAG); };
      r.onsuccess = () => res(r.result);
      r.onerror = () => res(null);
      setTimeout(() => res(null), 2500);
    });
  }
  async function init(){
    idb = await ouvrir(); dispo = !!idb;
    if(dispo && navigator.storage?.persist){ try{ await navigator.storage.persist(); }catch(e){} }
    return dispo;
  }
  function lire(cle = CLE){
    return new Promise(res => {
      if(!idb) return res(memoire[cle] ?? null);
      try{ const t = idb.transaction(MAG,"readonly").objectStore(MAG).get(cle);
        t.onsuccess = () => res(t.result ?? null); t.onerror = () => res(null);
      }catch(e){ res(null); }
    });
  }
  function ecrire(v, cle = CLE){
    memoire[cle] = v;
    return new Promise(res => {
      if(!idb) return res(false);
      try{ const t = idb.transaction(MAG,"readwrite").objectStore(MAG).put(v, cle);
        t.onsuccess = () => res(true); t.onerror = () => res(false);
      }catch(e){ res(false); }
    });
  }
  return { init, lire, ecrire, persistant: () => dispo };
})();

/* =====================================================================
   1 bis. SYNCHRONISATION GITHUB
   Le carnet est un fichier JSON dans un dépôt privé. Chaque écriture est
   un commit : on garde l'historique et la possibilité de revenir en arrière.
   Le jeton est rangé sous une autre clé que le carnet : il ne part donc
   jamais dans l'export.
   ===================================================================== */
const Sync = (() => {
  const CLE_CFG = "config_sync";
  let cfg = { actif:false, owner:"", repo:"", chemin:"carnet.json", branche:"main", jeton:"", sha:null, base:null };
  let etat = { statut:"off", message:"", quand:null };
  let minuteur = null, enCours = false, dernierPull = 0, redemande = false, veille = null;
  let dernierGeste = 0, retardataire = 0;
  const noterGeste = () => { dernierGeste = Date.now(); };

  const lireCfg = () => ({ ...cfg });
  const estActif = () => cfg.actif && !!cfg.jeton && !!cfg.owner && !!cfg.repo;
  const lireEtat = () => ({ ...etat });

  function poser(statut, message = ""){
    etat = { statut, message, quand: statut === "ok" ? Date.now() : etat.quand };
    if(typeof rafraichirBadge === "function") rafraichirBadge();
  }

  async function charger(){
    const c = await Stockage.lire(CLE_CFG);
    if(c) cfg = Object.assign(cfg, c);
    poser(estActif() ? "attente" : "off");
  }
  const enregistrerCfg = () => Stockage.ecrire({ ...cfg }, CLE_CFG);

  /* --- Base64 compatible UTF-8 --- */
  function versB64(s){
    const o = new TextEncoder().encode(s);
    let bin = "", pas = 0x8000;
    for(let i = 0; i < o.length; i += pas) bin += String.fromCharCode.apply(null, o.subarray(i, i+pas));
    return btoa(bin);
  }
  function depuisB64(s){
    const bin = atob(String(s).replace(/\s/g,""));
    const o = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(o);
  }

  const api = (chemin, opts = {}) => fetch("https://api.github.com" + chemin, Object.assign({}, opts, {
    headers: Object.assign({
      Authorization: "Bearer " + cfg.jeton,
      Accept: "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
    }, opts.headers || {}),
  }));

  async function motErreur(r){
    let d = "";
    try{ d = (await r.json()).message || ""; }catch(e){}
    if(r.status === 401) return "Jeton refusé — il est peut-être expiré.";
    if(r.status === 403) return "Accès refusé — vérifiez les droits Contents du jeton.";
    if(r.status === 404) return "Dépôt ou branche introuvable.";
    if(r.status === 409) return "Conflit de version côté GitHub.";
    return `${r.status} · ${d || "erreur inconnue"}`;
  }

  const urlFichier = () => `/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.chemin.replace(/^\/+/,"")}`;

  async function lireDistant(){
    const url = `${urlFichier()}?ref=${encodeURIComponent(cfg.branche)}`;
    const r = await api(url);
    if(r.status === 404) return { absent:true };
    if(!r.ok) throw new Error(await motErreur(r));
    const j = await r.json();
    /* GitHub n'inclut le contenu dans sa réponse que sous 1 Mo. Au-delà il
       renvoie une enveloppe vide : on redemande alors le fichier brut, dont
       la limite est cent fois plus haute. Sans cela, le carnet cesserait de
       se synchroniser au bout de deux ou trois ans d'usage. */
    if(j.content) return { sha:j.sha, donnees: JSON.parse(depuisB64(j.content)) };
    const brut = await api(url, { headers:{ Accept:"application/vnd.github.raw" } });
    if(!brut.ok) throw new Error(await motErreur(brut));
    return { sha:j.sha, donnees: JSON.parse(await brut.text()) };
  }

  async function ecrireDistant(){
    /* GitHub refuse l'écriture (409/422) si le fichier a changé depuis notre
       lecture. Plutôt que d'abandonner, on relit, on fusionne ce qui est
       arrivé entre-temps, et on réessaie. Trois tentatives suffisent
       largement : le cas ne se produit que si un autre appareil écrit
       exactement au même instant. */
    for(let essai = 1; essai <= 3; essai++){
      if(!db.modifie_le) db.modifie_le = new Date().toISOString();
      const instantane = db.modifie_le;
      const corps = {
        /* Sans indentation : sur dix ans, elle représenterait à elle seule
           près de deux mégaoctets. L'export téléchargé, lui, reste lisible. */
        message: `Carnet · ${nomAppareil()} · ${new Date().toLocaleString("fr-FR")}`,
        content: versB64(JSON.stringify(db)),
        branch: cfg.branche,
      };
      if(cfg.sha) corps.sha = cfg.sha;

      const r = await api(urlFichier(), { method:"PUT", body:JSON.stringify(corps) });

      if(r.ok){
        const j = await r.json();
        cfg.sha = j.content.sha;
        cfg.base = instantane;
        await enregistrerCfg();
        /* Une saisie est arrivée pendant l'envoi : on repart pour un tour. */
        if(db.modifie_le !== instantane) planifier();
        return;
      }

      if((r.status !== 409 && r.status !== 422) || essai === 3)
        throw new Error(await motErreur(r));

      const d = await lireDistant();
      if(d.absent){
        cfg.sha = null;               /* le fichier n'existe pas : on le crée */
      }else{
        cfg.sha = d.sha;
        adopter(fusionner(db, d.donnees));   /* on absorbe ce qui vient d'arriver */
      }
      await new Promise(res => setTimeout(res, 400 * essai));
    }
  }

  function adopter(donnees){
    const m = migrer(donnees);
    if(!m || !Array.isArray(m.taches)) throw new Error("Le fichier distant n'est pas un carnet.");
    /* Empreinte de l'état courant : si la version distante ne change rien,
       inutile de redessiner l'écran sous les yeux de l'utilisateur. */
    const empreinte = db ? JSON.stringify(db) : "";
    /* Une suppression est définitive : elle ne doit pas être oubliée parce
       qu'on adopte une version distante qui l'ignore. On conserve donc le
       registre local, on le réunit avec celui reçu, et on écarte des
       collections adoptées tout ce qui a été supprimé d'un côté ou de
       l'autre. Sans cela, un élément effacé ici revenait dès qu'un autre
       appareil renvoyait une version antérieure à sa suppression. */
    const registreLocal = (db && db.supprimes) || [];
    db = Object.assign(etatNeuf(), m);
    const vus = new Map();
    [...registreLocal, ...(db.supprimes || [])].forEach(x => {
      if(x && x.id && !vus.has(x.id)) vus.set(x.id, x);
    });
    db.supprimes = [...vus.values()].slice(-1000);
    COLLECTIONS.forEach(col => {
      if(Array.isArray(db[col])) db[col] = db[col].filter(x => !x || !vus.has(x.id));
    });
    db.version_schema = VERSION_SCHEMA;
    db.corbeille = db.corbeille || [];
    db.dossiers = db.dossiers || [];
    db.revenus = db.revenus || [];
    db.depenses = db.depenses || [];
    db.taches = db.taches.map(t => tacheNeuve(t));
    delete db.vierge;
    appliquerTeinte();
    bascule(); purgerCorbeille(); dedoublonner();
    Stockage.ecrire(structuredClone(db));
    cfg.base = db.modifie_le || null;
    enregistrerCfg();
    if(typeof rendre === "function" && JSON.stringify(db) !== empreinte) rendre();
  }

  /* Décide seul dans les cas simples, demande à l'utilisateur si les deux
     côtés ont bougé depuis la dernière synchro. */
  async function synchroniser(manuel = false){
    if(!estActif()) return;
    if(enCours){ redemande = true; return; }
    /* Une adoption au milieu d'une saisie fait sauter l'écran : on laisse
       passer quelques secondes après le dernier geste. */
    if(!manuel && Date.now() - dernierGeste < 5000){ planifier(); return; }
    if(!navigator.onLine){ poser("erreur", "Hors ligne — la synchro reprendra au retour du réseau."); return; }
    enCours = true; redemande = false; poser("occupe");
    try{
      /* La lecture distante prend quelques secondes. Si l'utilisateur saisit
         pendant ce temps, la décision prise ensuite porterait sur un état
         périmé et effacerait sa saisie de l'écran — elle ne reviendrait
         qu'au tour de synchro suivant. On mémorise donc l'état d'avant. */
      const avant = db.modifie_le;
      const d = await lireDistant();
      const bougeEntreTemps = db.modifie_le !== avant;
      if(d.absent){ cfg.sha = null; await ecrireDistant(); poser("ok"); return; }
      cfg.sha = d.sha;
      /* Un appareil resté sur une version ancienne ne connaît pas les
         protections récentes : on le signale plutôt que de laisser
         l'utilisatrice chercher pourquoi ses saisies s'évaporent. */
      const vDistante = d.donnees.version_app || 0;
      retardataire = vDistante > 0 && vDistante < VERSION_APP ? vDistante : 0;

      const distant = d.donnees.modifie_le || null;
      const local = db.vierge ? null : (db.modifie_le || null);
      const base = cfg.base;
      /* Carnet encore vierge : on prend la version distante telle quelle,
         sans y verser les exemples de démonstration. */
      if(db.vierge && !bougeEntreTemps){ adopter(d.donnees); poser("ok"); return; }

      if(distant === local){ cfg.base = local; await enregistrerCfg(); poser("ok"); return; }
      /* Fichier distant sans horodatage : c'est notre propre écriture initiale,
         pas une modification concurrente. On le complète au lieu d'alerter. */
      if(!distant){ await ecrireDistant(); poser("ok"); return; }
      /* Appareil encore vierge : il adopte simplement ce qui existe. */
      if(!local && !bougeEntreTemps){ adopter(d.donnees); poser("ok"); return; }
      if(base && distant === base){ await ecrireDistant(); poser("ok"); return; }
      /* Même quand rien ne semble avoir bougé ici, on fusionne plutôt que
         d'adopter : c'est la seule façon de garantir qu'une saisie récente
         ne disparaisse pas, y compris si l'autre appareil tourne encore sur
         une version ancienne qui renverrait un carnet incomplet. */
      if(base && local === base && !bougeEntreTemps){
        adopter(fusionner(db, d.donnees)); poser("ok"); return;
      }

      /* Les deux côtés ont bougé : on réunit au lieu de choisir. */
      const fusion = fusionner(db, d.donnees);
      adopter(fusion);
      await ecrireDistant();
      poser("ok", "Versions réunies.");
    }catch(e){
      poser("erreur", e.message || String(e));
    }finally{
      enCours = false;
      dernierPull = Date.now();
      if(redemande){ redemande = false; setTimeout(() => synchroniser(false), 400); }
    }
  }

  function planifier(){
    if(!estActif()) return;
    poser("attente");
    clearTimeout(minuteur);
    minuteur = setTimeout(() => synchroniser(false), 2500);
  }

  /* Relève régulière tant que l'onglet est visible.
     Sans elle, un appareil resté ouvert ignore ce que l'autre a poussé et
     ne le découvre qu'au moment où l'on modifie quelque chose — c'est-à-dire
     une fois le conflit déjà créé. En allant chercher toutes les deux minutes,
     la version distante est adoptée en silence tant que rien n'a été saisi ici. */
  function lancerVeille(){
    clearInterval(veille);
    veille = setInterval(() => {
      if(document.hidden || !estActif() || enCours) return;
      if(dlg.open) return;
      synchroniser(false);
    }, 120000);
  }

  async function connecter(nouveau){
    cfg = Object.assign(cfg, nouveau, { actif:true, sha:null, base:null });
    await enregistrerCfg();
    poser("occupe");
    await synchroniser(true);
  }
  async function deconnecter(){
    cfg = { actif:false, owner:"", repo:"", chemin:"carnet.json", branche:"main", jeton:"", sha:null, base:null };
    await enregistrerCfg();
    poser("off");
    if(typeof rendre === "function") rendre();
  }

  function auRetour(){
    if(!estActif()) return;
    if(Date.now() - dernierPull < 8000) return;

/* Pâques par l'algorithme de Meeus : tous les fériés mobiles en découlent. */
function paques(a){
  const n = a % 19, c = Math.floor(a/100), d = a % 100;
  const e = Math.floor(c/4), f = c % 4, g = Math.floor((c+8)/25);
  const h = Math.floor((c-g+1)/3), i = (19*n + c - e - h + 15) % 30;
  const k = Math.floor(d/4), l = d % 4;
  const m = (32 + 2*f + 2*k - i - l) % 7;
  const o = Math.floor((n + 11*i + 22*m)/451);
  const mois = Math.floor((i + m - 7*o + 114)/31);
  const jour = ((i + m - 7*o + 114) % 31) + 1;
  return new Date(a, mois-1, jour);
}

    [`${a}-05-08`]:"Victoire 1945", [dec(39)]:"Ascension", [dec(50)]:"Lundi de Pentecôte",

const COLLECTIONS = ["taches","dossiers","depenses","revenus","rendez_vous","rentrees",
                     "habitudes","habitudes_faites",
                     "anniversaires","vacances","contextes","categories","categories_depense"];

/* Réunit deux carnets. Les ajouts des deux côtés sont conservés ; pour un
   élément modifié des deux côtés, on retient celui du carnet le plus
   récemment touché. Les suppressions font foi grâce au registre. */
function fusionner(a, b) {
  const aPlusRecent = (a.modifie_le || "") >= (b.modifie_le || "");
  const fort = aPlusRecent ? a : b, faible = aPlusRecent ? b : a;
  const out = Object.assign({}, faible, fort);

  const supprimes = [...(a.supprimes || []), ...(b.supprimes || [])];
  const vus = new Set(), registre = [];
  supprimes.forEach(x => { if(x && x.id && !vus.has(x.id)){ vus.add(x.id); registre.push(x); } });

  /* Pour un élément présent des deux côtés, c'est sa propre date de
     modification qui décide, pas celle du carnet qui le porte. On ne
     retombe sur la règle globale que si aucun des deux n'est horodaté. */
  const departager = (a, b) => {
    if(!a) return b;
    if(!b) return a;
    if(a.maj_le && b.maj_le) return a.maj_le >= b.maj_le ? a : b;
    if(a.maj_le) return a;
    if(b.maj_le) return b;
    return null;
  };
  COLLECTIONS.forEach(col => {
    const carte = new Map();
    (faible[col] || []).forEach(x => { if(x && x.id) carte.set(x.id, x); });
    (fort[col]   || []).forEach(x => {
      if(!x || !x.id) return;
      const autre = carte.get(x.id);
      carte.set(x.id, autre ? (departager(x, autre) || x) : x);
    });
    out[col] = [...carte.values()].filter(x => !vus.has(x.id));
  });

  const cb = new Map();
  [...(faible.corbeille || []), ...(fort.corbeille || [])].forEach(x => { if(x && x.id) cb.set(x.id, x); });
  out.corbeille = [...cb.values()].sort((x,y) => (y.le||"").localeCompare(x.le||"")).slice(0,200);

  out.supprimes = registre.slice(-1000);
  /* Ce qui a été archivé ne revient pas par la fusion. */
  const coupure = [a.reglages, b.reglages].map(r => (r||{}).archive_avant || "").sort().pop();
  if(coupure) appliquerCoupure(out, coupure);
  out.reglages = Object.assign({}, faible.reglages || {}, fort.reglages || {});
  out.modifie_le = (a.modifie_le || "") > (b.modifie_le || "") ? a.modifie_le : b.modifie_le;
  return out;
}

  const debut = ajouterPeriode(r.date, ecart - reste, "jour");
  if(debut > fin) return null;
  if((r.exceptions || []).includes(debut)) return null;
  return debut;
}
/* Le suivi d'habitudes. L'identifiant d'une case cochée est déduit de
   l'habitude et du jour : deux appareils qui cochent le même jour créent
   donc le même élément, et la fusion n'en garde qu'un. */
const cleCoche = (hid, iso) => `hf-${hid}-${iso}`;
const habitudeFaite = (hid, iso) =>
  (db.habitudes_faites || []).some(x => x.id === cleCoche(hid, iso));
function basculerHabitude(hid, iso){
  const cle = cleCoche(hid, iso);
  const i = (db.habitudes_faites || []).findIndex(x => x.id === cle);
  if(i >= 0){ db.habitudes_faites.splice(i, 1); oublier(cle); }
  else {
    db.supprimes = (db.supprimes || []).filter(x => x.id !== cle);
    /* Une case cochée est immuable : elle existe ou non. Inutile de
       l'horodater, ce serait un tiers de poids en plus pour rien. */
    (db.habitudes_faites = db.habitudes_faites || []).push({ id:cle, habitude_id:hid, date:iso });
  }
}
/* Bilan du mois en cours : combien de jours cochés sur ceux écoulés. */
function moisHabitude(hid, ref = jourISO()){
  const d = versDate(ref);
  const prefixe = ref.slice(0,7);
  const ecoules = d.getDate();
  const faits = (db.habitudes_faites || [])
    .filter(x => x.habitude_id === hid && x.date.slice(0,7) === prefixe).length;
  return { faits, ecoules };
}

/* Nombre de jours consécutifs jusqu'à aujourd'hui. */
function serieHabitude(hid){
  let n = 0, d = new Date();
  for(let k = 0; k < 400; k++){
    const iso = jourISO(d);
    if(habitudeFaite(hid, iso)) n++;
    else if(k > 0 || !habitudeFaite(hid, iso)) break;
    d.setDate(d.getDate() - 1);
  }
  return n;
}
const semaineDe = iso => {
  const d = versDate(iso);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return Array.from({ length:7 }, (_, k) => {
    const x = new Date(d); x.setDate(x.getDate() + k); return jourISO(x);
  });
};

const rdvDu = iso => (db.rendez_vous||[]).filter(r => debutOccurrence(r, iso))
                      .sort((a,b) => (a.heure||"99").localeCompare(b.heure||"99"));
const rangRdv = (r, iso) => ecartJours(debutOccurrence(r, iso) || r.date, iso) + 1;
const anniDu = iso => (db.anniversaires||[]).filter(a => a.mois === +iso.slice(5,7) && a.jour === +iso.slice(8,10));
const tachesDu = iso => db.taches.filter(t => t.statut !== "done" && t.date_due === iso && passeSphere(t));

const prochaineDe = id => { const l = duDossier(id).filter(t => t.date_due).map(t => t.date_due).sort(); return l[0] || null; };

/* =====================================================================
   3. BUDGET
   Le mois budgétaire commence au jour choisi (1er par défaut).
   Les charges viennent des dossiers qui ont un montant + une périodicité.
   ===================================================================== */
function debutPeriode(decalage = 0, ref = jourISO()){
  const d = versDate(ref), jd = Math.min(28, Math.max(1, db.reglages.jour_debut_mois || 1));
  let y = d.getFullYear(), m = d.getMonth();
  if(d.getDate() < jd){ m--; if(m < 0){ m = 11; y--; } }
  m += decalage;
  const base = new Date(y, m, 1);
  const dim = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
  return jourISO(new Date(base.getFullYear(), base.getMonth(), Math.min(jd, dim)));
}
/* Combien de mois séparent la période d'une date de la période en cours.
   Sert à ouvrir le budget au bon endroit quand on saisit une dépense
   antérieure ou postérieure au mois affiché. */
/* Une période est nommée par son mois de fin : « 27 janvier → 26 février »
   s'appelle février. Cette règle doit être unique, sinon deux périodes
   voisines finissent par porter le même nom. */
/* Tous les mois qui portent un mouvement : une dépense saisie, ou une
   facture non mensuelle qui y tombe. Sans les secondes, une charge annuelle
   de février restait introuvable — rien n'indiquait où aller la voir. */
function moisAvecMouvement(fenetre = 18){
  const s = new Set(db.depenses.map(x => decalagePeriode(x.date)));
  const lignes = toutesLignes().filter(({ l }) =>
    PERIODES[l.periodicite] > 1 && l.mois && l.jour);
  if(lignes.length){
    for(let n = -fenetre; n <= fenetre; n++){
      const deb = debutPeriode(n), fin = finPeriode(deb);
      if(lignes.some(({ l }) => datesPrelevement(l, deb, fin).length)) s.add(n);
    }
  }
  return [...s];
}

function nomDeLaPeriode(decalage){
  const deb = debutPeriode(decalage);
  const d = versDate(deb), f = versDate(finPeriode(deb));
  if(d.getMonth() === f.getMonth()) return `${MOIS[f.getMonth()]} ${f.getFullYear()}`;
  /* Mois budgétaire à cheval : le nommer par son seul mois de fin fait
     chercher en janvier une facture du 28 décembre. On nomme les deux. */
  return `${MOIS[d.getMonth()].slice(0,4)}–${MOIS[f.getMonth()].slice(0,4)} ${f.getFullYear()}`;
}

function decalagePeriode(iso){
  const a = versDate(debutPeriode(0));
  const b = versDate(debutPeriode(0, iso));
  return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth());
}
const finPeriode = deb => jourISO(new Date(versDate(ajouterPeriode(deb, 1, "mois")).getTime() - 86400000));

/* Une charge est une ligne d'un dossier : un dossier « Assurances » peut en
   porter plusieurs (auto, van, habitation). Tout est ramené au mois. */
const parMois = x => {
  const p = PERIODES[x && x.periodicite];
  return x && x.montant && p ? x.montant / p : 0;
};
const lignesDe = d => d.lignes || [];
const parMoisDossier = d => lignesDe(d).reduce((s,l) => s + parMois(l), 0);
const toutesLignes = () => db.dossiers.flatMap(d => lignesDe(d)
  .filter(l => l.montant && PERIODES[l.periodicite]).map(l => ({ l, d })));
const chargesDossiers = () => db.dossiers.filter(d => parMoisDossier(d) > 0);
const totalCharges = () => toutesLignes().reduce((s,x) => s + parMois(x.l), 0);
const totalRevenus = () => (db.revenus || []).reduce((s,r) => s + parMois(r), 0);

/* Date de prélèvement d'une ligne mensuelle à l'intérieur de la période
   budgétaire, qui ne coïncide pas forcément avec le mois calendaire. */
function datePrelevement(l, deb, fin){
  if(PERIODES[l.periodicite] !== 1 || !l.jour) return null;
  for(const base of [versDate(deb), versDate(fin)]){
    const dim = new Date(base.getFullYear(), base.getMonth()+1, 0).getDate();
    const iso = jourISO(new Date(base.getFullYear(), base.getMonth(), Math.min(l.jour, dim)));
    if(iso >= deb && iso <= fin) return iso;
  }
  return null;
}

/* Toutes les occurrences d'une charge à l'intérieur d'une période.
   Une charge mensuelle se repère au seul jour ; au-delà du mois, il faut
   aussi le mois d'ancrage — sans quoi on ignore quand elle tombe. */
function datesPrelevement(l, deb, fin){
  const p = PERIODES[l.periodicite];
  if(!p || !l.jour) return [];
  if(p === 1){ const d = datePrelevement(l, deb, fin); return d ? [d] : []; }
  if(!l.mois) return [];
  /* Ancrage fixe : sans année de référence, une charge bisannuelle donnerait
     un résultat différent selon la période interrogée. On part donc toujours
     du même point, et on avance jusqu'à la période demandée. */
  const out = [];
  const debut = versDate(deb), limite = versDate(fin);
  let curseur = new Date(2000, l.mois - 1, 1);
  const bonds = Math.max(0, Math.floor(((debut.getFullYear() - 2000) * 12 + debut.getMonth() - (l.mois - 1)) / p) - 1);
  curseur = new Date(2000, (l.mois - 1) + bonds * p, 1);
  let garde = 0;
  while(curseur <= limite && garde++ < 60){
    const dim = new Date(curseur.getFullYear(), curseur.getMonth() + 1, 0).getDate();
    const iso = jourISO(new Date(curseur.getFullYear(), curseur.getMonth(), Math.min(l.jour, dim)));
    if(iso >= deb && iso <= fin) out.push(iso);
    curseur = new Date(curseur.getFullYear(), curseur.getMonth() + p, 1);
  }
  return out;
}

/* Sorties réelles de la période : le mensuel toujours, le reste seulement
   si son échéance tombe dedans. */
function chargesReelles(deb, fin){
  return toutesLignes().reduce((s, { l, d }) => {
    if(PERIODES[l.periodicite] === 1) return s + l.montant;
    const dates = datesPrelevement(l, deb, fin);
    if(dates.length) return s + l.montant * dates.length;
    /* Charge sans mois renseigné : on retombe sur l'échéance du dossier. */
    if(!l.mois){ const p = prochaineDe(d.id); if(p && p >= deb && p <= fin) return s + l.montant; }
    return s;
  }, 0);
}

/* Les prélèvements non mensuels qui tombent dans la période : le mois où
   ils sortent réellement du compte. Une charge mensuelle en est exclue,
   son montant lissé est déjà exactement la sortie du mois. */
function prelevementsPonctuels(deb, fin){
  const out = [];
  toutesLignes().forEach(({ l, d }) => {
    if(PERIODES[l.periodicite] <= 1) return;
    datesPrelevement(l, deb, fin).forEach(date => out.push({ l, d, date }));
  });
  return out.sort((a, c) => a.date.localeCompare(c.date));
}
const compterPrelevements = () => db.reglages.compter_prelevements !== false;

/* Ce qui n'est pas encore passé sur le compte d'ici la fin de la période. */
function resteAPrelever(deb, fin){
  const j = jourISO();
  return toutesLignes().reduce((s, { l, d }) => {
    const dates = datesPrelevement(l, deb, fin);
    if(dates.length) return s + l.montant * dates.filter(x => x >= j).length;
    if(!l.mois && PERIODES[l.periodicite] > 1){
      const p = prochaineDe(d.id);
      if(p && p >= j && p <= fin) return s + l.montant;
    }
    return s;
  }, 0);
}
const depensesDe = (deb, fin) => db.depenses.filter(x => x.date >= deb && x.date <= fin);
/* Une dépense avancée pour le compte d'un tiers — frais médicaux, note de
   frais — reste une vraie dépense aujourd'hui. On se contente de la marquer :
   on ne sait ni quand ni combien on sera remboursé, donc on n'invente aucune
   rentrée. La question utile est « combien me doit-on, et depuis quand ». */
const enAttenteRemb = () => db.depenses.filter(x => x.rembourser && !x.rembourse)
                              .sort((a,b) => a.date.localeCompare(b.date));
const sommeDep = l => l.reduce((s,x) => s + (x.montant || 0), 0);

function bilan(decalage = 0){
  const deb = debutPeriode(decalage), fin = finPeriode(deb), j = jourISO();
  const dep = depensesDe(deb, fin);
  const revenus = totalRevenus(), charges = totalCharges();
  /* Une rentrée ponctuelle — remboursement, prime, vente — ne compte qu'une
     fois encaissée. Tant qu'elle est « à venir », elle est signalée à part
     sans gonfler le disponible : mieux vaut une bonne surprise. */
  const rent = db.rentrees || [];
  const encaissees = rent.filter(r => r.recu && r.date && r.date >= deb && r.date <= fin)
                         .reduce((s,r) => s + (r.montant||0), 0);
  const attendues = rent.filter(r => !r.recu).reduce((s,r) => s + (r.montant||0), 0);
  const attente = enAttenteRemb();
  const avances = attente.reduce((s,x) => s + (x.montant||0), 0);
  const disponible = revenus - charges + encaissees;
  /* Option : retirer aussi la facture en entier le mois où elle tombe.
     Elle est alors comptée deux fois — une fois lissée sur douze mois, une
     fois en entier ce mois-ci. C'est volontaire : on préfère sous-estimer
     ce qui reste que d'être surpris le jour du prélèvement. */
  const ponctuels = prelevementsPonctuels(deb, fin);
  const sortiePonctuelle = compterPrelevements()
    ? ponctuels.reduce((s, x) => s + (x.l.montant || 0), 0) : 0;
  const depense = sommeDep(dep);
  const reste = disponible - depense - sortiePonctuelle;
  const total = ecartJours(deb, fin) + 1;
  const ecoules = Math.min(total, Math.max(0, ecartJours(deb, j) + 1));
  const restants = Math.max(0, total - ecoules) + (j >= deb && j <= fin ? 0 : 0);
  const encore = j >= deb && j <= fin ? Math.max(1, total - ecoules + 1) : total;
  return { deb, fin, dep, revenus, charges, disponible, depense, reste, total, ecoules, restants, encore,
           encaissees, attendues, attente, avances, ponctuels, sortiePonctuelle,
           reel: chargesReelles(deb, fin), courante: j >= deb && j <= fin };
}

/* =====================================================================
   4. MÉCANIQUE QUOTIDIENNE
   ===================================================================== */
function bascule(){
  const j = jourISO();
  if(db.reglages.dernier_bascule === j) return;
  if(db.reglages.dernier_bascule){
    db.taches.forEach(t => {
      if(t.statut !== "done" && t.suivant_le && t.suivant_le < j){ t.reports++; t.suivant_le = j; }
    });
  }
  db.reglages.dernier_bascule = j;
}
/* Répare les listes dédoublées par une ancienne fusion. Les références
   pointant vers un doublon sont reportées sur l'exemplaire conservé, et
   les identifiants écartés entrent au registre des suppressions pour ne
   pas revenir à la prochaine synchro. */
function dedoublonner(){
  let touche = 0;
  const passe = (col, cle) => {
    const vus = new Map(), garde = [], alias = {};
    (db[col] || []).forEach(x => {
      if(!x || !x.id) return;
      const k = cle(x);
      if(vus.has(k)){ alias[x.id] = vus.get(k); oublier(x.id); touche++; }
      else { vus.set(k, x.id); garde.push(x); }
    });
    db[col] = garde;
    return alias;
  };
  const nom = x => sansAccents(x.nom || "").trim();

  passe("anniversaires", x => `${x.mois}-${x.jour}-${nom(x)}`);
  passe("vacances", x => `${x.debut}-${x.fin}-${nom(x)}`);

  const aCtx = passe("contextes", nom);
  db.taches.forEach(t => { if(aCtx[t.contexte_id]) t.contexte_id = aCtx[t.contexte_id]; });

  const aCat = passe("categories", nom);
  db.dossiers.forEach(d => { if(aCat[d.categorie_id]) d.categorie_id = aCat[d.categorie_id]; });

  const aCdep = passe("categories_depense", nom);
  db.depenses.forEach(x => { if(aCdep[x.categorie_id]) x.categorie_id = aCdep[x.categorie_id]; });

  return touche;
}

/* Archiver, c'est retirer du carnet courant ce qui est trop ancien pour
   servir, après l'avoir téléchargé. Une date de coupure est mémorisée : la
   fusion s'en sert pour que l'autre appareil ne réintroduise pas ce qui
   vient d'être sorti, sans avoir à créer des milliers de traces. */
function elementsAvant(limite){
  return {
    depenses: db.depenses.filter(x => x.date < limite),
    habitudes_faites: (db.habitudes_faites||[]).filter(x => x.date < limite),
    taches: db.taches.filter(x => x.statut === "done" && (x.fait_le || "9") < limite),
    rendez_vous: (db.rendez_vous||[]).filter(x => x.date < limite && !x.repete),
  };
}
function appliquerCoupure(base, limite){
  if(!limite || !base) return base;
  base.depenses = (base.depenses||[]).filter(x => x.date >= limite);
  base.habitudes_faites = (base.habitudes_faites||[]).filter(x => x.date >= limite);
  base.taches = (base.taches||[]).filter(x => x.statut !== "done" || (x.fait_le || "9") >= limite);
  base.rendez_vous = (base.rendez_vous||[]).filter(x => x.date >= limite || x.repete);
  return base;
}
function archiver(limite){
  const vieux = elementsAvant(limite);
  const n = Object.values(vieux).reduce((s,l) => s + l.length, 0);
  if(!n){ alert("Rien à archiver avant cette date."); return; }
  if(!confirm(`Archiver ${n} élément(s) antérieurs au ${dateCourte(limite)} ?\n\n`
    + `Un fichier sera téléchargé, puis ces éléments quitteront le carnet.`)) return;
  const paquet = { archive:true, coupure:limite, cree_le:new Date().toISOString(),
                   version_schema:VERSION_SCHEMA, ...vieux };
  const blob = new Blob([JSON.stringify(paquet, null, 2)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `carnet-archive-avant-${limite}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  appliquerCoupure(db, limite);
  db.reglages.archive_avant = limite > (db.reglages.archive_avant || "") ? limite : db.reglages.archive_avant;
  maj();
}

function purgerCorbeille(){
  const limite = jourISO(new Date(Date.now() - 30*86400000));
  db.corbeille = db.corbeille.filter(x => x.le >= limite);
  /* Le registre des suppressions vit plus longtemps que la corbeille :
     un appareil resté éteint deux mois ne doit pas ressusciter ses effacés. */
  const vieux = new Date(Date.now() - 180*86400000).toISOString();
  db.supprimes = (db.supprimes || []).filter(x => x.le >= vieux).slice(-1000);
}
/* Un élément supprimé doit le rester : sans ce registre, la fusion le
   verrait « présent chez l'autre » et le ferait revenir à chaque synchro. */
function oublier(id){
  if(!id) return;
  db.supprimes = db.supprimes || [];
  if(!db.supprimes.some(x => x.id === id)) db.supprimes.push({ id, le:new Date().toISOString() });
}
function jeter(genre, obj){
  db.corbeille.unshift({ id:uid(), genre, obj:structuredClone(obj), le:jourISO() });
  oublier(obj && obj.id);
}

/* =====================================================================
   5. SAISIE RAPIDE
   ===================================================================== */
const NOMS_JOURS = { dim:0,dimanche:0, lun:1,lundi:1, mar:2,mardi:2, mer:3,mercredi:3,
                     jeu:4,jeudi:4, ven:5,vendredi:5, sam:6,samedi:6 };
function lireDate(mot){
  const m = sansAccents(mot);
  const j = new Date(); j.setHours(0,0,0,0);
  if(m === "auj" || m === "aujourdhui") return jourISO(j);
  if(m === "demain"){ j.setDate(j.getDate()+1); return jourISO(j); }
  if(m === "apresdemain"){ j.setDate(j.getDate()+2); return jourISO(j); }
  if(m in NOMS_JOURS){
    const cible = NOMS_JOURS[m];
    let d = (cible - j.getDay() + 7) % 7; if(d === 0) d = 7;
    j.setDate(j.getDate() + d); return jourISO(j);
  }
  let x = m.match(/^\+(\d+)(j|s|m)$/);
  if(x){ const n = +x[1];
    if(x[2] === "j") j.setDate(j.getDate()+n);
    if(x[2] === "s") j.setDate(j.getDate()+n*7);
    if(x[2] === "m") j.setMonth(j.getMonth()+n);
    return jourISO(j); }
  x = m.match(/^(\d{1,2})[\/.](\d{1,2})(?:[\/.](\d{2,4}))?$/);
  if(x){
    const jj = +x[1], mm = +x[2];
    let aa = x[3] ? +x[3] : j.getFullYear();
    if(aa < 100) aa += 2000;
    if(mm < 1 || mm > 12 || jj < 1 || jj > 31) return null;
    let iso = `${aa}-${String(mm).padStart(2,"0")}-${String(jj).padStart(2,"0")}`;
    if(!x[3] && iso < jourISO()) iso = `${aa+1}-${String(mm).padStart(2,"0")}-${String(jj).padStart(2,"0")}`;
    return iso;
  }
  return null;
}
function analyser(texte){
  let suivant = false, ctxId = null, dossId = null, date = null;
  const mots = texte.trim().split(/\s+/).filter(m => {
    /* L'apostrophe est accessible d'une frappe sur le clavier iPhone,
       contrairement au point d'exclamation. Les deux restent acceptés. */
    if(m === "!" || m === "'" || m === "’"){ suivant = true; return false; }
    if(m.startsWith("@") && m.length > 1){
      const cle = sansAccents(m.slice(1));
      const c = db.contextes.find(c => sansAccents(c.nom).startsWith(cle) || (c.alias||[]).some(a => sansAccents(a) === cle));
      if(c){ ctxId = c.id; return false; }
    }
    if(m.startsWith("#") && m.length > 1){
      const cle = sansAccents(m.slice(1));
      const d = db.dossiers.find(d => sansAccents(d.nom).replace(/\s|^(le|la|les|l')/g,"").startsWith(cle)
                                   || sansAccents(d.nom).startsWith(cle));
      if(d){ dossId = d.id; return false; }
    }
    if(!date){ const iso = lireDate(m); if(iso){ date = iso; return false; } }
    return true;
  });
  let intitule = mots.join(" ");
  while(/[!'’]$/.test(intitule)){ suivant = true; intitule = intitule.slice(0,-1).trim(); }
  return { intitule, ctxId, dossId, date, suivant };
}

const TEINTES = [
  { cle:"petrole", nom:"Bleu pétrole", val:"#1E5A6E", pale:"#DCE8EC" },
  { cle:"nuit",    nom:"Bleu nuit",    val:"#2B3E6B", pale:"#DEE3F0" },
  { cle:"prune",   nom:"Prune",        val:"#6B3FA0", pale:"#EBE3F7" },
  { cle:"brique",  nom:"Terre cuite",  val:"#9A4A2F", pale:"#F2E1D9" },
];
function appliquerTeinte(){
  const t = TEINTES.find(x => x.cle === (db.reglages.accent || "petrole")) || TEINTES[0];
  const r = document.documentElement;
  if(r && r.style){ r.style.setProperty("--accent", t.val); r.style.setProperty("--accent-pale", t.pale); }
}

const ETATS_SYNC = {
  off:     { g:"",  t:"" },
  attente: { g:"○", t:"modifications en attente" },
  occupe:  { g:"◍", t:"synchronisation en cours" },
  ok:      { g:"●", t:"synchronisé" },
  conflit: { g:"◐", t:"deux versions différentes" },
  erreur:  { g:"▲", t:"erreur de synchronisation" },
};
let dernierBadge = "";
function rafraichirBadge(){
  const e = Sync.lireEtat(), d = ETATS_SYNC[e.statut] || ETATS_SYNC.off;
  const hh = e.quand ? new Date(e.quand).toLocaleTimeString("fr-FR", { hour:"2-digit", minute:"2-digit" }) : "";
  const titre = (e.message || d.t) + (hh ? ` · dernière synchro à ${hh}` : "");
  const html = d.g
    ? `<span class="sync ${e.statut}" data-act="syncMaintenant" title="${ech(titre)}">${d.g}${hh ? `<span class="heure">${hh}</span>` : ""}</span>`
    : "";
  const loupe = `<button class="loupe" data-act="recherche" title="Rechercher" aria-label="Rechercher">⌕</button>`;
  const roue = `<button class="loupe" data-onglet="reglages" title="Réglages" aria-label="Réglages">⚙</button>`;
  /* On ne touche au DOM que si l'affichage change réellement : sinon la
     pastille se reconstruit toutes les secondes pour rien. */
  const noeuds = document.querySelectorAll(".jour");
  const dejaPose = noeuds.length && noeuds[0].querySelector && noeuds[0].querySelector(".loupe");
  const signature = html + "|" + (dejaPose ? "1" : "0");
  if(signature === dernierBadge && dejaPose) return;
  dernierBadge = signature;
  noeuds.forEach(n => {
    n.querySelectorAll(".sync,.loupe").forEach(x => x.remove());
    if(html) n.insertAdjacentHTML("beforeend", " " + html);
    n.insertAdjacentHTML("beforeend", " " + loupe + roue);
  });
}


/* =====================================================================
   RECHERCHE
   Un seul champ qui traverse tout le carnet : tâches, dossiers et leurs
   notes, charges, rendez-vous, dépenses, anniversaires.
   ===================================================================== */
function chercher(q){
  const t = sansAccents(q).trim();
  if(t.length < 2) return [];
  const mots = t.split(/\s+/);
  const colle = (...ch) => sansAccents(ch.filter(Boolean).join(" "));
  const ok = txt => mots.every(m => txt.includes(m));
  const r = [];

  db.taches.forEach(x => {
    if(!ok(colle(x.intitule, x.notes))) return;
    const d = dossDe(x.dossier_id), c = ctxDe(x.contexte_id);
    r.push({ genre:"Tâche", titre:x.intitule, fini:x.statut === "done",
      detail:[d && d.nom, c && c.nom, x.date_due && dateCourte(x.date_due)].filter(Boolean).join(" · "),
      aller:() => { if(d){ vue.onglet = "suivi"; vue.dossier = d.id; } else { vue.onglet = "taches"; vue.filtreCtx = null; vue.filtreDoss = null; } } });
  });
  db.dossiers.forEach(x => {
    const dansLignes = lignesDe(x).some(l => ok(sansAccents(l.libelle || "")));
    if(!ok(colle(x.nom, x.notes, x.identifiant, x.contrat)) && !dansLignes) return;
    r.push({ genre:"Dossier", titre:x.nom,
      detail:[catDe(x.categorie_id)?.nom, parMoisDossier(x) ? euro(parMoisDossier(x),2) + "/mois" : null,
              (x.notes||"").split("\n")[0]].filter(Boolean).join(" · "),
      aller:() => { vue.onglet = "suivi"; vue.dossier = x.id; } });
  });
  (db.rendez_vous||[]).forEach(x => {
    if(!ok(colle(x.intitule, x.notes))) return;
    r.push({ genre:"Rendez-vous", titre:x.intitule,
      detail:[dateLongue(x.date), x.heure, (x.cote||"perso") === "pro" ? "Pro" : "Perso"].filter(Boolean).join(" · "),
      aller:() => { vue.onglet = "agenda"; vue.moisAgenda = x.date.slice(0,7); } });
  });
  db.depenses.forEach(x => {
    if(!ok(colle(x.libelle, cdepDe(x.categorie_id)?.nom))) return;
    r.push({ genre:"Dépense", titre:x.libelle || cdepDe(x.categorie_id)?.nom || "Dépense",
      detail:[dateCourte(x.date), euro(x.montant,2)].filter(Boolean).join(" · "),
      aller:() => { vue.onglet = "budget"; vue.decalage = decalagePeriode(x.date); vue.surligne = x.id; } });
  });
  (db.rentrees||[]).forEach(x => {
    if(!ok(sansAccents(x.libelle || ""))) return;
    r.push({ genre:"Rentrée", titre:x.libelle,
      detail:[x.montant == null ? "montant inconnu" : euro(x.montant,2),
              x.recu ? "encaissé" : "à venir", x.date && dateCourte(x.date)].filter(Boolean).join(" · "),
      aller:() => { vue.onglet = "budget";
        if(x.date) vue.decalage = decalagePeriode(x.date);
        vue.surligne = x.id; } });
  });
  (db.anniversaires||[]).forEach(x => {
    if(!ok(sansAccents(x.nom))) return;
    r.push({ genre:"Anniversaire", titre:(x.icone === "coeur" ? "❤️ " : "🎂 ") + x.nom,
      detail:`${String(x.jour).padStart(2,"0")} ${MOIS[x.mois-1]}`,
      aller:() => { vue.onglet = "agenda"; vue.moisAgenda = `${new Date().getFullYear()}-${String(x.mois).padStart(2,"0")}`; } });
  });
  return r.sort((a,b) => (a.fini?1:0) - (b.fini?1:0)).slice(0, 40);
}

let resultatsCourants = [];
function dessinerResultats(q){
  const zone = document.getElementById("resultats");
  if(!zone) return;
  resultatsCourants = chercher(q);
  if(sansAccents(q).trim().length < 2){
    zone.innerHTML = `<p class="rech-vide">Tapez au moins deux lettres.</p>`; return;
  }
  if(!resultatsCourants.length){
    zone.innerHTML = `<p class="rech-vide">Rien trouvé pour « ${ech(q)} ».</p>`; return;
  }
  zone.innerHTML = `<div class="fiche liste">${resultatsCourants.map((x,i) =>
    `<div class="ligne" data-res="${i}" style="cursor:pointer">
      <div class="corps"><div class="intitule" ${x.fini?'style="color:var(--encre-3);text-decoration:line-through"':""}>${ech(x.titre)}</div>
        <div class="meta"><span class="puce ctx">${ech(x.genre)}</span>
        ${x.detail ? `<span class="puce">${ech(x.detail)}</span>` : ""}</div></div></div>`).join("")}</div>`;
}

/* Une seule zone de saisie, ouverte d'un geste depuis l'accueil : on note
   la tâche et on referme, sans changer d'écran. */
function ouvrirAjoutRapide(){
  if(dlg.open) dlg.close();
  dlg.innerHTML = `<div class="dlg-c" style="padding:14px 15px">
      <input id="eclair" class="champ-rech" placeholder="Nouvelle tâche…" autocomplete="off" enterkeyhint="done">
      <div class="boites" style="margin:11px 0 0">
        <span class="boite-note">Classer dans</span>
        <div class="segments" id="segEclair">
          <button class="seg ${!vue.eclairTravail?"on":""}" data-act="eclairPerso">Perso</button>
          <button class="seg ${vue.eclairTravail?"on":""}" data-act="eclairTravail">Travail</button>
        </div></div>
      <p class="aide" style="margin:10px 2px 0"><b>@</b>contexte · <b>#</b>dossier · <b>demain</b> <b>+3j</b> <b>12/09</b> · <b>'</b> à faire</p>
    </div>
    <div class="dlg-p"><button type="button" class="btn mini creux" id="eclairNon">Annuler</button>
      <button type="button" class="btn mini" id="eclairOui">Ajouter</button></div>`;
  dlg.showModal();
  /* La destination repart de la liste affichée à chaque ouverture, pour
     éviter qu'un choix fait la veille ne classe une tâche à notre insu. */
  vue.eclairTravail = sphere() === "travail";
  const champ = document.getElementById("eclair");
  const valider = () => {
    const a = analyser(champ.value || "");
    if(!a.intitule){ champ.focus(); return; }
    const t = tacheNeuve({
      intitule:a.intitule, contexte_id:a.ctxId || null, dossier_id:a.dossId || null,
      date_due:a.date || null, suivant_le:a.suivant ? jourISO() : null,
      travail: !!vue.eclairTravail,
    });
    db.taches.push(touche(t));
    vue.surligne = t.id;
    dlg.close();
    maj();
  };
  dlg.querySelector("#eclairOui").onclick = valider;
  dlg.querySelector("#eclairNon").onclick = () => dlg.close();
  champ.onkeydown = ev => { if(ev.key === "Enter"){ ev.preventDefault(); valider(); } };
  setTimeout(() => champ.focus(), 40);
}

/* Même geste que pour les tâches : un bouton, un montant, une catégorie,
   et c'est noté sans quitter l'écran. */
function ouvrirDepenseRapide(){
  if(dlg.open) dlg.close();
  const chips = () => db.categories_depense.map(c =>
    `<button class="filtre ${vue.catDep===c.id?"on":""}" data-catdep="${c.id}">${ech(c.nom)}</button>`).join("");
  dlg.innerHTML = `<div class="dlg-c" style="padding:14px 15px">
      <div class="saisie" style="margin-bottom:10px">
        <input id="dep-eclair-montant" class="champ-rech" style="flex:0 0 120px" inputmode="decimal"
          placeholder="0,00" autocomplete="off" enterkeyhint="done">
        <input id="dep-eclair-libelle" class="champ-rech" placeholder="Libellé (facultatif)"
          autocomplete="off" enterkeyhint="done">
      </div>
      <div class="filtres" id="catsEclair" style="margin-bottom:2px">${chips()}</div>
    </div>
    <div class="dlg-p"><button type="button" class="btn mini creux" id="depNon">Annuler</button>
      <button type="button" class="btn mini" id="depOui">Ajouter</button></div>`;
  dlg.showModal();
  const im = document.getElementById("dep-eclair-montant");
  const il = document.getElementById("dep-eclair-libelle");
  const valider = () => {
    const m = lireMontant(im.value);
    if(m === null || m === 0){ im.focus(); return; }
    const x = touche({ id:uid(), date:jourISO(), montant:Math.abs(m),
      categorie_id:vue.catDep || null, libelle:(il.value || "").trim(), dossier_id:null });
    db.depenses.push(x);
    vue.decalage = 0;
    vue.surligne = x.id;
    dlg.close();
    if(vue.onglet !== "budget") vue.onglet = "budget";
    maj();
  };
  dlg.querySelector("#depOui").onclick = valider;
  dlg.querySelector("#depNon").onclick = () => dlg.close();
  [im, il].forEach(ch => ch.onkeydown = ev => { if(ev.key === "Enter"){ ev.preventDefault(); valider(); } });
  dlg.__chips = chips;
  setTimeout(() => im.focus(), 40);
}

function rendreNav(){
  const j = jourISO();
  const c = { taches:inbox().filter(passeSphere).length,
              echeances:datees().filter(t => passeSphere(t) && ecartJours(j, t.date_due) <= 60).length };
  document.getElementById("nav").innerHTML = ONGLETS.map((o,i) => {
    const n = c[o.id] || 0;
    return `<button data-onglet="${o.id}" class="${vue.onglet===o.id?"on":""}">
      <span class="n">${String(i+1).padStart(2,"0")}</span><span>${o.nom}</span>
      ${n ? `<span class="pastille">${n}</span>` : ""}</button>`;
  }).join("");
  /* Réglages quitte la barre du bas : six entrées au lieu de sept, donc
     chacune gagne un sixième de largeur. Il reste accessible par la roue
     dentée placée à côté de la date. */
  document.getElementById("barre").innerHTML = ONGLETS.filter(o => o.id !== "reglages").map(o =>
    `<button data-onglet="${o.id}" class="${vue.onglet===o.id?"on":""}">
      <span class="g">${o.g}</span><span>${o.nom}</span></button>`).join("");
  document.getElementById("jourRail").textContent = dateLongue(j);
}

function ligneTache(t, opts = {}){
  const j = jourISO();
  const c = ctxDe(t.contexte_id), d = dossDe(t.dossier_id);
  const faite = t.statut === "done";
  const meta = [];
  if(c) meta.push(`<span class="puce ctx">${ech(c.nom)}</span>`);
  if(t.travail) meta.push(`<span class="puce trav">Travail</span>`);
  if(d && !opts.sansDossier) meta.push(`<span class="puce doss">${ech(d.nom)}</span>`);
  if(t.date_due){
    const n = ecartJours(j, t.date_due);
    meta.push(`<span class="puce date ${!faite && n<=2 ? "chaud":""}">${dateCourte(t.date_due)} · ${resteEnMots(t.date_due)}</span>`);
  }
  if(t.n > 0) meta.push(`<span class="puce">${recurrenceEnMots(t.n, t.unite)}</span>`);
  if(enVeille(t) && opts.veille) meta.push(`<span class="puce veille">sort ${resteEnMots(ajouterPeriode(t.date_due, -(t.preavis||0), "jour"))}</span>`);
  if(!faite && t.reports >= 3) meta.push(`<span class="repousse ${t.reports>=5?"chaud":""}">repoussé ×${t.reports}</span>`);
  if(faite && t.fait_le) meta.push(`<span class="puce date">${dateCourte(t.fait_le)}</span>`);
  const retard = !faite && t.date_due && ecartJours(j, t.date_due) < 0;
  const monter = d && !t.date_due && !faite
    ? (t.en_inbox ? `<button class="ico mont" data-act="renvoyer" title="Renvoyer dans le dossier">↩</button>`
                  : `<button class="ico mont" data-act="rapatrier" title="Remonter dans l'inbox">↑</button>`) : "";
  return `<div class="ligne ${faite?"faite":""}" data-tache="${t.id}">
    <div class="cases">
      <button class="case carre ${faite?"coche":""}" data-act="fait" title="Fait" aria-label="Marquer comme fait">${CHECK}</button>
      ${opts.sansSuivant ? "" : `<button class="case fleche ${t.suivant_le?"coche":""}" data-act="suivant" title="À faire" aria-label="Mettre dans À faire">↑</button>`}
    </div>
    <div class="corps">
      <div class="intitule">${t.urgent?'<span class="point-urgent" title="Urgent"></span>':""}${retard?'<span class="point-retard" title="Date dépassée"></span>':""}<span class="${t.urgent?"txt-urgent":""}">${ech(t.intitule)}</span></div>
      ${meta.length ? `<div class="meta">${meta.join("")}</div>` : ""}
    </div>
    <div class="outils">${opts.reglee
      ? `<button class="ico mont" data-act="remettre" title="Remettre dans l'inbox">↩</button>
         <button class="ico sup" data-act="supprimerDef" title="Supprimer définitivement">✕</button>`
      : `${monter}
         <button class="ico urg ${t.urgent?"actif":""}" data-act="urgent"
           title="${t.urgent?"Ne plus marquer urgent":"Marquer urgent"}">●</button>
         <button class="ico" data-act="editer" title="Modifier">✎</button>
         <button class="ico sup" data-act="jeter" title="Corbeille">✕</button>`}</div>
  </div>`;
}

const vide = (t,x) => `<div class="vide"><b>${t}</b>${x}</div>`;
const groupe = (t,c,x) => `<div class="oeil">${t}${c!=null?` <span class="cpt">${c}</span>`:""}</div>${x}`;
const enFiche = l => `<div class="fiche liste">${l.join("")}</div>`;

/* ---- Accueil ---- */
function vueAccueil(){
  const j = jourISO();
  const suiv = suivantes().filter(passeSphere);
  const dejaFaire = new Set(suiv.map(t => t.id));
  const proches = datees().filter(t => passeSphere(t) && ecartJours(j, t.date_due) <= 60 && !dejaFaire.has(t.id));
  /* Le compte des retards porte sur toutes les échéances dépassées, y compris
     celles déjà placées dans « À faire » : sinon on en annonce deux quand
     l'onglet Échéances en montre trois. */
  const retard = datees().filter(t => passeSphere(t) && ecartJours(j, t.date_due) < 0);
  const b = bilan(0);
  const dj = versDate(j);
  const h = [];
  if(sphere() === "travail")
    h.push(`<button class="filet-rappel doux" data-sphere="perso" style="margin:0 0 12px">
      ▪ Mode travail — revenir au perso</button>`);
  h.push(`<div class="entete-mob"><h1 class="titre grand-jour">
      <span class="sem">${JOURS[dj.getDay()]}</span>
      <span class="chiffre">${dj.getDate()}</span>
      <span class="mois">${MOIS[dj.getMonth()]}</span></h1><div class="jour"></div></div>`);
  /* Pas de récapitulatif chiffré : on lit les listes elles-mêmes. */

  if(!Stockage.persistant())
    h.push(`<div class="bandeau alerte"><div class="g"><b>Stockage indisponible ici.</b> Rien ne sera conservé. Téléchargez le fichier et ouvrez-le dans votre navigateur.</div></div>`);
  if(retard.length)
    h.push(`<button class="filet-rappel doux" data-aller="echeances">
      <span class="point-retard"></span>${retard.length} échéance${retard.length>1?"s":""} à rattraper, à votre rythme</button>`);
  const versionAncienne = Sync.versionEnRetard && Sync.versionEnRetard();
  if(versionAncienne)
    h.push(`<div class="bandeau alerte"><div class="g">
      <b>Un de vos appareils est resté sur une version ancienne</b> (version ${versionAncienne}, celui-ci est en ${VERSION_APP}).
      Mettez-le à jour : tant qu'il écrit, vos saisies risquent d'être écrasées.</div></div>`);

  const dep = db.reglages.dernier_export ? ecartJours(db.reglages.dernier_export, j) : null;
  if(dep === null || dep >= 7)
    h.push(`<button class="filet-rappel" data-act="exporter">
      ${dep === null ? "jamais exporté" : `export il y a ${dep} j`} · sauvegarder</button>`);

  /* Rendez-vous et anniversaires du jour et du lendemain */
  const demain = jourISO(new Date(versDate(j).getTime() + 86400000));
  const paquet = iso => ({ iso, rdv:rdvDu(iso), anni:anniDu(iso) });
  const auj = paquet(j), dem = paquet(demain);
  const ferieAuj = ferieDe(j), ferieDem = ferieDe(demain);
  {
    const bloc = (p, quand) => {
      if(!p.rdv.length && !p.anni.length) return "";
      const l = [];
      p.rdv.forEach(r => l.push(`<div class="ligne rdv-l" data-rdv="${r.id}" data-rdvjour="${p.iso}" data-act="editerRdv">
        <div class="heure-c">${r.heure ? ech(r.heure) : ((r.duree||1) > 1 ? rangRdv(r, p.iso) + "/" + r.duree : "—")}</div>
        <div class="corps"><div class="intitule"><span class="${r.couleur ? "surl surl-" + r.couleur : ""}">${ech(r.intitule)}</span></div>
          <div class="meta"><span class="puce ${(r.cote||"perso")==="pro"?"":"ctx"}">${(r.cote||"perso")==="pro"?"Pro":"Perso"}</span>
            <span class="puce date">${quand}</span>
            ${r.repete ? `<span class="puce">chaque ${r.repete === "quinzaine" ? "quinzaine" : JOURS[versDate(r.date).getDay()]}</span>` : ""}</div>
          ${r.notes ? `<div class="note-rdv">${ech(r.notes)}</div>` : ""}</div></div>`));
      p.anni.forEach(a => l.push(`<div class="ligne rdv-l">
        <div class="heure-c">${a.icone === "coeur" ? "❤️" : "🎂"}</div>
        <div class="corps"><div class="intitule">${ech(a.nom)}</div>
          <div class="meta"><span class="puce date">${quand}</span></div></div></div>`));
      return l.join("");
    };
    /* L'encart reste même vide : savoir qu'il n'y a rien est une information,
       et son absence donnait l'impression d'un affichage manquant. */
    const marque = (nom, quand) => `<div class="ligne rdv-l">
      <div class="heure-c ferie">★</div>
      <div class="corps"><div class="intitule">${ech(nom)}</div>
        <div class="meta"><span class="puce chaud">jour férié</span>
          <span class="puce date">${quand}</span></div></div></div>`;
    const contenu =
      (ferieAuj ? marque(ferieAuj, "aujourd'hui") : "")
      + bloc(auj, "aujourd'hui")
      + (ferieDem ? marque(ferieDem, "demain") : "")
      + bloc(dem, "demain");
    h.push(groupe("Aujourd'hui et demain", null, contenu
      ? enFiche([contenu])
      : vide("Mer calme à l'horizon")));
  }

  if(b.revenus || b.charges || b.depense){
    const masque = "•••";
    h.push(`<button class="prive" data-act="voirArgent" title="Afficher ou masquer">
      <span class="oeilleton">${vue.voirArgent ? "◉" : "◎"}</span>
      <span>il reste</span>
      <span class="v ${vue.voirArgent && b.reste<0 ? "neg":""}">${vue.voirArgent ? euroCourt(b.reste) : masque}</span>
      <span>·</span>
      <span class="v">${vue.voirArgent ? euroCourt(b.reste / b.encore) + "/j" : masque}</span>
      <span>·</span>
      <span>à prélever</span>
      <span class="v">${vue.voirArgent ? euroCourt(resteAPrelever(b.deb, b.fin)) : masque}</span>
    </button>`);
  }

  /* Le suivi d'habitudes vit sur l'accueil : c'est l'écran qu'on ouvre
     chaque matin, et cocher un rond doit tenir en un geste. Aucun onglet
     supplémentaire, donc aucune case du menu à rétrécir. */
  const habs = (db.habitudes || []).filter(x => !x.archive);
  if(habs.length){
    const sem = semaineDe(j);
    const lettres = ["L","M","M","J","V","S","D"];
    h.push(`<div class="oeil">Habitudes<span class="a-droite">semaine · bilan du mois</span></div>`);
    h.push(`<div class="fiche habitudes">
      <div class="hab-entete"><span></span>${sem.map((d,k) =>
        `<span class="${d === j ? "auj" : ""}">${lettres[k]}</span>`).join("")}</div>
      ${habs.map(x => {
        const serie = serieHabitude(x.id);
        const m = moisHabitude(x.id);
        return `<div class="hab-ligne">
          <span class="hab-nom">${ech(x.nom)}${serie > 1 ? `<i class="serie">${serie} j</i>` : ""}${
            m.faits ? `<i class="bilan-mois">${m.faits}/${m.ecoules}</i>` : ""}</span>
          ${sem.map(d => `<button class="rond ${habitudeFaite(x.id, d) ? "plein" : ""} ${d === j ? "auj" : ""} ${d > j ? "futur" : ""}"
            data-hab="${x.id}" data-hjour="${d}" aria-label="${ech(x.nom)} ${dateLongue(d)}"
            ${d > j ? "disabled" : ""}></button>`).join("")}
        </div>`;
      }).join("")}</div>`);
  }

  h.push(groupe("À faire", suiv.length || null, suiv.length ? enFiche(suiv.map(t => ligneTache(t)))
    : vide("Rien en attente", "La flèche ↑ y place une tâche.")));
  h.push(groupe("Échéances · 60 jours", proches.length || null, proches.length ? enFiche(proches.map(t => ligneTache(t)))
    : vide("Aucune échéance en vue", "Rien ne tombe dans les deux mois qui viennent.")));
  const f = faitesLe(j).filter(passeSphere);
  if(f.length) h.push(groupe("Réglé aujourd'hui", f.length, enFiche(f.map(t => ligneTache(t, { reglee:true })))));
  h.push(`<div class="pied">
    <button data-onglet="reglages">⚙ Réglages</button>
    <span class="pied-version" title="Si ce numéro diffère d'un appareil à l'autre, l'un des deux n'a pas la dernière version">version ${VERSION_APP}</span>
  </div>`);
  h.push(`<button class="fab" data-act="ajoutRapide" title="Nouvelle tâche" aria-label="Nouvelle tâche">+</button>`);
  return h.join("");
}

  const nPerso = inbox().filter(t => !t.travail).length;
  const nTravail = inbox().filter(t => t.travail).length;

    ${db.contextes.map(c => `<button class="filtre ${vue.filtreCtx===c.id?"on":""}" data-fctx="${c.id}">${ech(c.nom)} <span class="n">${cCtx(c.id)}</span></button>`).join("")}
  </div>`);
  const avecInbox = db.dossiers.filter(d => inbox().some(t => t.dossier_id === d.id));
  if(avecInbox.length) h.push(`<div class="filtres">
    <button class="filtre doss ${!vue.filtreDoss?"on":""}" data-fdoss="">Tous dossiers</button>
    ${avecInbox.map(d => `<button class="filtre doss ${vue.filtreDoss===d.id?"on":""}" data-fdoss="${d.id}">${ech(d.nom)} <span class="n">${inbox().filter(t=>t.dossier_id===d.id).length}</span></button>`).join("")}
  </div>`);

  h.push(groupe("À faire", suiv.length || null, suiv.length ? enFiche(suiv.map(t => ligneTache(t)))
    : vide("Liste vide", "La flèche ↑ y place une tâche.")));
  h.push(groupe("À trier", tri.length || null, tri.length ? enFiche(tri.map(t => ligneTache(t)))
    : vide("Rien à trier", "Tout est rangé.")));
  if(reg.length){
    const recentes = reg.filter(t => !t.fait_le || ecartJours(t.fait_le, j) <= 7);
    const aff = vue.toutReglees ? reg.slice(0,200) : recentes.slice(0,25);
    h.push(`<div class="oeil">Réglées <span class="cpt">${reg.length}</span>
      <span class="a-droite">${vue.toutReglees ? "tout l'historique" : "7 derniers jours"}</span></div>`);
    h.push(aff.length ? enFiche(aff.map(t => ligneTache(t, { reglee:true })))
      : vide("Rien de réglé cette semaine", "L'historique complet est un cran plus bas."));
    const boutons = [];
    if(reg.length > aff.length || vue.toutReglees)
      boutons.push(`<button class="btn mini creux" data-act="toutReglees">${vue.toutReglees ? "Réduire" : `Tout voir (${reg.length})`}</button>`);
    boutons.push(`<button class="btn mini danger" data-act="viderReglees">Vider les réglées</button>`);
    h.push(`<div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">${boutons.join("")}</div>`);

  return h.join("");
