/* Sous-tâches : gérées uniquement depuis la fiche d'une tâche déjà créée
   (pas à la création, pour ne pas complexifier ce cas), et câblées à la
   main comme le contenu propre de formulaire() — jamais via le grand
   aiguillage des data-act, pour ne rien risquer sur le reste de l'appli. */
function rendreSousTaches(o){
  const items = o.sous_taches || [];
  if(!items.length) return `<p style="margin:2px 0 0;font-size:12px;color:var(--encre-3)">Aucune pour l'instant.</p>`;
  return items.map(s => `
    <div style="display:flex;align-items:center;gap:8px;padding:4px 0">
      <button type="button" class="case carre ${s.coche?"coche":""}" data-stcocher="${s.id}"
        style="width:20px;height:20px;flex:none" aria-label="Cocher">${CHECK}</button>
      <span style="flex:1;font-size:13px;${s.coche?"color:var(--encre-3);text-decoration:line-through":""}">${ech(s.texte)}</span>
      <button type="button" class="ico sup" data-stsupprimer="${s.id}" aria-label="Supprimer">✕</button>
    </div>`).join("");
}
function cablerSousTaches(o){
  const cabler = () => {
    dlg.querySelectorAll("[data-stcocher]").forEach(b => b.onclick = () => {
      const s = (o.sous_taches||[]).find(x => x.id === b.dataset.stcocher);
      if(s){ s.coche = !s.coche; touche(o); sauver(); reafficher(); }
    });
    dlg.querySelectorAll("[data-stsupprimer]").forEach(b => b.onclick = () => {
      o.sous_taches = (o.sous_taches||[]).filter(x => x.id !== b.dataset.stsupprimer);
      touche(o); sauver(); reafficher();
    });
  };
  const reafficher = () => {
    const c = dlg.querySelector("#sousTachesListe");
    if(c) c.innerHTML = rendreSousTaches(o);
    cabler();
  };
  const ajouter = () => {
    const inp = dlg.querySelector("#sousTacheSaisie");
    const texte = (inp?.value||"").trim();
    if(!texte) return;
    (o.sous_taches = o.sous_taches || []).push({ id:uid(), texte, coche:false });
    touche(o); sauver();
    inp.value = "";
    reafficher();
    dlg.querySelector("#sousTacheSaisie")?.focus();
  };
  cabler();
  const btnAj = dlg.querySelector("#sousTacheAjouter");
  if(btnAj) btnAj.onclick = ajouter;
  dlg.querySelector("#sousTacheSaisie")?.addEventListener("keydown", ev => {
    if(ev.key === "Enter"){ ev.preventDefault(); ajouter(); }
  });
}

    { cle:"unite", nom:"Unité", type:"select", options:optUnite },
    { cle:"etiquettes", nom:"Étiquettes (séparées par des virgules)", ph:"urgent-perso, à-déléguer" },

      date_due: d.sans_date === "1" ? null : (d.date_due || null),

  if(!neuve) cablerSousTaches(o);

/* Saisie de l'heure au clavier : « 9h30 », « 9:30 », « 930 », « 9h » → 09:30 */
function lireHeure(v){
  const t = String(v||"").trim().toLowerCase().replace(/\s/g,"");
  if(!t) return "";
  let m = t.match(/^(\d{1,2})[h:.,]?(\d{2})?$/);
  if(!m){ m = t.match(/^(\d{2})(\d{2})$/); if(m) m = [t, m[1], m[2]]; }
  if(!m) return null;
  const H = +m[1], M = m[2] ? +m[2] : 0;
  if(H > 23 || M > 59) return null;
  return String(H).padStart(2,"0") + ":" + String(M).padStart(2,"0");
}

/* Position juste après le dernier élément d'une section (donc juste avant
   le titre suivant, ou en toute fin si c'est la dernière section). */
function finSection(items, titreId){
  const i = items.findIndex(it => it.id === titreId);
  if(i < 0) return items.length;
  let j = i + 1;
  while(j < items.length && !items[j].titre) j++;
  return j;
}

/* Une ligne tapée en terminant par « : » devient un titre de section plutôt
   qu'une case à cocher — un moyen simple de classer sans complexifier le
   modèle de données. Une case rejoint la section touchée en dernier (elle
   s'y insère juste avant le titre suivant) ; un nouveau titre, lui, se pose
   toujours en toute fin et devient aussitôt la section active, pour que la
   saisie initiale d'une liste range déjà tout au bon endroit sans geste
   supplémentaire. */
function ajouterItemListe(listeId){
  const inp = document.getElementById("itemListeSaisie");
  if(!inp || !inp.value.trim()) return;
  const l = (db.listes||[]).find(x => x.id === listeId);
  if(!l) return;
  const brut = inp.value.trim();
  const titre = /:\s*$/.test(brut);
  const texte = titre ? brut.replace(/:\s*$/,"").trim() : brut;
  if(!texte) return;
  l.items = l.items || [];
  const nouvel = { id:uid(), texte, coche:false, titre };
  if(titre){
    l.items.push(nouvel);
    vue.sectionActive = nouvel.id;
  }else if(vue.sectionActive && l.items.some(it => it.titre && it.id === vue.sectionActive)){
    l.items.splice(finSection(l.items, vue.sectionActive), 0, nouvel);
  }else{
    l.items.push(nouvel);
  }
  touche(l);
  inp.value = "";
  maj();
  setTimeout(() => document.getElementById("itemListeSaisie")?.focus(), 0);
}

/* Même esprit que les cases d'une Liste (cocher est purement visuel, seule
   la flèche crée une vraie tâche), avec les mêmes titres de section et le
   même ciblage — juste sa propre variable de section active. */

function editerCharge(d, l){
  const neuf = !l;
  const x = l || { id:uid(), libelle:"", montant:null, periodicite:"mensuel", jour:null, mois:null };
  formulaire(neuf ? `Nouvelle charge · ${d.nom}` : "Modifier la charge", [
    { cle:"libelle", nom:"Libellé" },
    { cle:"montant", nom:"Montant (€)", type:"number", step:"0.01", duo:true },
    { cle:"periodicite", nom:"Périodicité", type:"select", options:Object.keys(PERIODES).map(k => ({v:k,n:k})) },
    { cle:"jour", nom:"Jour du prélèvement", type:"text", mode:"numeric", ph:"12", duo:true },
    { cle:"mois", nom:"Mois (si pas mensuel)", type:"select",
      options:[{v:"",n:"— sans objet —"}, ...MOIS.map((m,i) => ({v:i+1,n:m}))] },
  ], { ...x, montant:x.montant ?? "", jour:x.jour ?? "", mois:x.mois ?? "" }, f => {
    const m = lireMontant(f.montant);
    if(!f.libelle || m === null){ alert("Il faut un libellé et un montant."); return; }
    let jr = parseInt(f.jour, 10);
    if(!(jr >= 1 && jr <= 31)) jr = null;
    const mo = f.mois === "" ? null : Number(f.mois);
    if(PERIODES[f.periodicite] > 1 && jr && !mo){
      alert("Pour une charge qui ne tombe pas tous les mois, indiquez aussi le mois du prélèvement.");
      return;
    }
    Object.assign(x, { libelle:f.libelle, montant:Math.abs(m), periodicite:f.periodicite, jour:jr, mois:mo });
    if(neuf) (d.lignes = d.lignes || []).push(x);

    d.lignes = d.lignes.filter(y => y.id !== x.id); touche(d); maj(); });
}

function editerListe(genre, item){
  const neuf = !item;
  const x = item || (genre === "contexte" ? { id:uid(), nom:"", alias:[] } : { id:uid(), nom:"" });
  const champs = [{ cle:"nom", nom:"Nom" }];
  if(genre === "contexte") champs.push({ cle:"alias", nom:"Alias de saisie (virgules)", ph:"tel, phone, appel" });
  const tas = { contexte:"contextes", categorie:"categories", cdepense:"categories_depense", moyen:"moyens" }[genre];
  /* « especes » est un identifiant protégé : le calcul du budget s'appuie
     dessus (une dépense en espèces n'est pas recomptée, déjà décomptée au
     retrait). Le renommer reste possible, le supprimer casserait ce calcul
     silencieusement — mieux vaut le dire clairement plutôt que deviner. */
  const protege = genre === "moyen" && !neuf && x.id === "especes";
  formulaire(neuf ? "Nouvel élément" : "Modifier", champs, { ...x, alias:(x.alias||[]).join(", ") }, d => {
    if(!d.nom) return;
    x.nom = d.nom;
    if(genre === "contexte") x.alias = (d.alias||"").split(",").map(s => sansAccents(s.trim())).filter(Boolean);
    touche(x);
    if(neuf) db[tas].push(x);
    maj();
  }, protege ? null : (neuf ? null : () => {
    if(genre === "moyen" && !confirm(`Supprimer « ${x.nom} » ? Les dépenses déjà réglées ainsi garderont ce moyen, juste sans nom affiché.`)) return;
    jeter(genre, x);
    db[tas] = db[tas].filter(y => y.id !== x.id);
    if(genre === "contexte"){
      db.taches.forEach(t => { if(t.contexte_id === x.id) t.contexte_id = null; });
      if(vue.filtreCtx === x.id) vue.filtreCtx = null;
    }else if(genre === "categorie"){
      db.dossiers.forEach(d => { if(d.categorie_id === x.id) d.categorie_id = null; });
    }else if(genre === "cdepense"){
      db.depenses.forEach(p => { if(p.categorie_id === x.id) p.categorie_id = null; });
      if(vue.catDep === x.id) vue.catDep = null;
    }
    maj();
  }));
}

function ajouterDepense(){

function tamponner(elt, texte, apres){
  const t = document.createElement("span");
  t.className = "tampon"; t.textContent = texte;
  elt.appendChild(t);
  setTimeout(apres, matchMedia("(prefers-reduced-motion: reduce)").matches ? 120 : 640);
}

function basculerFait(t, elt){
  if(t.statut === "done"){ t.statut = "inbox"; t.fait_le = null; return maj(); }
  const j = jourISO();
  if(t.n > 0 && t.date_due){
    (t.journal = t.journal || []).unshift(j);
    t.journal = t.journal.slice(0,12);
    let d = ajouterPeriode(t.date_due, t.n, t.unite), garde = 0;
    while(d <= j && garde++ < 300) d = ajouterPeriode(d, t.n, t.unite);
    t.date_due = d; t.suivant_le = null; t.reports = 0; t.en_inbox = false;
    sauver(); elt.classList.add("faite");
    return tamponner(elt, `Réglé · ${dateCourte(j)}`, rendre);
  }
  t.statut = "done"; t.fait_le = j; t.suivant_le = null;
  sauver(); elt.classList.add("faite");
  tamponner(elt, `Fait · ${dateCourte(j)}`, rendre);
}

/* Point-virgule et virgule décimale : c'est ce qu'Excel en français attend
   par défaut à l'ouverture directe, sans quoi les montants et les colonnes
   s'entassent dans une seule case. Le BOM en tête évite les accents cassés. */
function exporterCSVBudget(){
  const b = bilan(vue.decalage);
  const echapper = v => /[;"\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  const lignes = [["Date","Catégorie","Libellé","Montant (€)","Payé par","À rembourser"]];
  [...b.dep].sort((x,y) => (x.date||"").localeCompare(y.date||"")).forEach(x => {
    lignes.push([
      x.date || "",
      (cdepDe(x.categorie_id)||{}).nom || "",
      x.libelle || "",
      String(x.montant ?? 0).replace(".", ","),
      nomMoyen(x.moyen),
      x.rembourser ? "Oui" : "Non",
    ]);
  });
  const csv = "\uFEFF" + lignes.map(l => l.map(v => echapper(String(v))).join(";")).join("\r\n");
  const blob = new Blob([csv], { type:"text/csv;charset=utf-8" });
  const nomFichier = nomDeLaPeriode(vue.decalage).toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `depenses-${nomFichier}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

function importer(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files[0]; if(!f) return;
    const l = new FileReader();
    l.onload = () => {
      let d;
      try{ d = JSON.parse(l.result); }catch(e){ alert("Fichier illisible : ce n'est pas du JSON valide."); return; }
      if(!d || !Array.isArray(d.taches)){ alert("Fichier non reconnu : il ne contient pas de carnet."); return; }
      if((d.version_schema ?? 1) > VERSION_SCHEMA){
        alert(`Ce fichier vient d'une version plus récente (${d.version_schema}). Mettez d'abord l'application à jour.`); return;
      }
      const m = migrer(d);
      const n = (m.taches?.length||0) + (m.dossiers?.length||0) + (m.depenses?.length||0);
      if(!confirm(`Remplacer le carnet actuel par ce fichier (${n} éléments) ? L'état actuel sera perdu.`)) return;
      db = Object.assign(etatNeuf(), m);
      db.version_schema = VERSION_SCHEMA;
      db.taches = db.taches.map(t => tacheNeuve(t));
      bascule(); purgerCorbeille(); vue.dossier = null; maj();
    };
    l.readAsText(f);
  };
  inp.click();
}

const trouver = (c, attr) => { const e = c.closest(`[data-${attr}]`); return e ? { elt:e, id:e.getAttribute(`data-${attr}`) } : null; };

document.addEventListener("click", ev => {
  const c = ev.target;

  const bO = c.closest("[data-onglet]");
  if(bO){ vue.onglet = bO.dataset.onglet;
    if(vue.onglet !== "suivi"){ vue.dossier = null; vue.liste = null; vue.pageListes = false; vue.projet = null; vue.pageProjets = false; vue.pageCommandes = false; vue.noteOuverte = null; vue.pageGaranties = false; vue.pageAstronomie = false; vue.pageCoherence = false; }
    if(vue.onglet !== "accueil"){ vue.pageSommeil = false; vue.habitudeGrille = null; }
    if(vue.onglet !== "budget") vue.pageBilanAnnuel = false;
    return rendre(); }
  const bA = c.closest("[data-aller]");
  if(bA){ vue.onglet = bA.dataset.aller; return rendre(); }
  const bC = c.closest("[data-fctx]");
  if(bC){ vue.filtreCtx = bC.dataset.fctx || null; return rendre(); }
  /* Même bouton, deux origines : la rangée de filtres de l'onglet Tâches,
     ou le badge #étiquette affiché directement sur une tâche ailleurs dans
     l'appli (Accueil, Échéances…) — dans ce second cas on bascule aussi
     vers l'onglet Tâches pour montrer le résultat du filtre. */
  const bEtq = c.closest("[data-fetq]");
  if(bEtq){ vue.filtreEtiquette = bEtq.dataset.fetq || null; vue.onglet = "taches"; return rendre(); }
  const bD = c.closest("[data-fdoss]");
  if(bD){ vue.filtreDoss = bD.dataset.fdoss || null; return rendre(); }
  const bPr = c.closest("[data-prelev]");
  if(bPr){ db.reglages.compter_prelevements = bPr.dataset.prelev === "1"; return maj(); }
  const bArch = c.closest("[data-archiver]");
  if(bArch) return archiver(bArch.dataset.archiver);
  const bEdt = c.closest("[data-ouvriredt]");
  if(bEdt){ if(dlg.open) dlg.close(); vue.onglet = "agenda"; vue.edt = bEdt.dataset.ouvriredt; return rendre(); }
  const bFD = c.closest("[data-fctxdoss]");
  if(bFD){ vue.filtreCtxDoss = bFD.dataset.fctxdoss || null; return rendre(); }
  const bU = c.closest("[data-furgent]");
  if(bU){ vue.filtreUrgent = !vue.filtreUrgent; return rendre(); }
  const bMoyE = c.closest("[data-moyeneclair]");
  if(bMoyE){
    vue.moyen = bMoyE.dataset.moyeneclair;
    const z = document.getElementById("moyensEclair");
    if(z && dlg.__moyens) z.innerHTML = dlg.__moyens();
    return;
  }
  const bH = c.closest("[data-hab]");
  if(bH){ basculerHabitude(bH.dataset.hab, bH.dataset.hjour); return maj(); }
  const bS = c.closest("[data-sphere]");
  if(bS){ db.reglages.sphere = bS.dataset.sphere; vue.saisieTravail = null; return maj(); }
  const bT = c.closest("[data-teinte]");
  if(bT){ db.reglages.accent = bT.dataset.teinte; appliquerTeinte(); return maj(); }
  const bCat = c.closest("[data-catdep]");
  if(bCat){
    vue.catDep = vue.catDep === bCat.dataset.catdep ? null : bCat.dataset.catdep;
    const z = document.getElementById("catsEclair");
    if(z && dlg.__chips) z.innerHTML = dlg.__chips();
    return;
  }
  const bK = c.closest("[data-cdep]");
  if(bK){ vue.catDep = vue.catDep === bK.dataset.cdep ? null : bK.dataset.cdep; return rendre(); }
  const bSem = c.closest("[data-sem]");
  if(bSem){
    const v = +bSem.dataset.sem;
    if(v === 0) vue.semestre = jourISO().slice(0,7);
    else {
      const [a,m] = (vue.semestre || jourISO().slice(0,7)).split("-").map(Number);
      const d = new Date(a, m - 1 + v, 1);
      vue.semestre = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    }
    return rendre();
  }
  const bM = c.closest("[data-mois]");
  if(bM){
    const v = +bM.dataset.mois;
    decalerMois(v);
    /* « Today » doit amener sous les yeux la ligne du jour, pas juste le bon
       mois : en fin de mois il fallait sans ça défiler à la main pour la
       retrouver. On réutilise le mécanisme de surlignage déjà en place
       (défile seulement si la ligne n'est pas déjà visible). */
    if(v === 0) vue.surligne = jourISO();
    return rendre();
  }
  const bJ = c.closest("[data-saut]");
  if(bJ){ vue.decalage = +bJ.dataset.saut; return rendre(); }
  const bP = c.closest("[data-periode]");
  if(bP){ const v = +bP.dataset.periode;
    vue.decalage = v === 0 ? 0 : vue.decalage + v; return rendre(); }
  const bAB = c.closest("[data-anbilan]");
  if(bAB){ const v = +bAB.dataset.anbilan;
    vue.anneeBilan = v === 0 ? null : (vue.anneeBilan ?? anneeBilanCourante()) + v;
    return rendre(); }

  /* Traité avant le garde-fou ci-dessous : une ligne de résultat ne porte
     pas de data-act, elle serait sinon purement et simplement ignorée. */
  const lres0 = c.closest("[data-res]");
  if(lres0){
    const x = resultatsCourants[+lres0.dataset.res];
    if(x){ dlg.close(); x.aller(); return rendre(); }
    return;
  }

  const b = c.closest("[data-act]");
  if(!b){
    const lj = c.closest("[data-jourdate]");
    if(lj && vue.onglet === "agenda" && !c.closest("[data-rdv]") && !c.closest("[data-tache]"))
      return editerRdv(null, lj.dataset.jourdate);
    return;
  }
  const act = b.dataset.act;

  if(act === "ajouter") return ajouterDepuis("saisie", null);

      db.projets = db.projets.filter(x => x.id !== p.id);
      if(vue.projet === p.id) vue.projet = null;
      return maj();
    }
  }

  const llp = trouver(c, "ligneprojet");
  if(llp && (act === "editerLigneProjet" || act === "jeterLigneProjet")){
    const p = (db.projets||[]).find(x => x.id === llp.elt.dataset.projet);
    const l = p && (p.lignes||[]).find(y => y.id === llp.id);
    if(!p || !l) return;

    if(!confirm(`Supprimer « ${l.libelle} » ?`)) return;
    p.lignes = p.lignes.filter(y => y.id !== l.id);
    touche(p);
    return maj();
  }

  const ltp = trouver(c, "tacheprojet");
  if(ltp && (act === "basculerTacheProjet" || act === "remonterTacheProjet" || act === "supprimerTacheProjet" || act === "choisirSectionProjet" || act === "editerTacheProjet")){
    const p = (db.projets||[]).find(x => x.id === ltp.elt.dataset.projet);
    const x = p && (p.taches||[]).find(y => y.id === ltp.id);
    if(!p || !x) return;
    if(act === "choisirSectionProjet"){
      vue.sectionActiveProjet = vue.sectionActiveProjet === x.id ? null : x.id;
      return rendre();
    }
    if(act === "editerTacheProjet"){
      return formulaireRenommer(x.titre ? "Renommer le titre" : "Renommer", x.texte, v => { x.texte = v; touche(p); });
    }
    if(act === "basculerTacheProjet"){ x.coche = !x.coche; touche(p); return maj(); }
    if(act === "remonterTacheProjet"){
      const nouvelle = tacheNeuve({ intitule:x.texte, suivant_le:jourISO(), travail:destinationTravail() });
      db.taches.push(touche(nouvelle));
      sauver();
      return tamponner(ltp.elt, "Ajouté à « À faire »", rendre);
    }
    if(act === "supprimerTacheProjet"){
      p.taches = p.taches.filter(y => y.id !== x.id);
      touche(p);
      return maj();
    }
  }

  const lc0 = trouver(c, "commande");
  if(lc0 && (act === "basculerCommande" || act === "editerCommande" || act === "jeterCommande")){
    const cmd = (db.commandes||[]).find(x => x.id === lc0.id); if(!cmd) return;
    if(act === "basculerCommande"){ cmd.recue = !cmd.recue; touche(cmd); return maj(); }
    if(act === "editerCommande") return formulaireCommande(cmd);
    if(!confirm(`Supprimer la commande « ${cmd.nom} » ?`)) return;
    jeter("commande", cmd);
    db.commandes = db.commandes.filter(x => x.id !== cmd.id);
    return maj();
  }

  const lg0 = trouver(c, "garantie");
  if(lg0 && (act === "editerGarantie" || act === "jeterGarantie")){
    const g = (db.garanties||[]).find(x => x.id === lg0.id); if(!g) return;
    if(act === "editerGarantie") return formulaireGarantie(g);
    if(!confirm(`Supprimer la garantie « ${g.nom} » ?`)) return;
    if(g.piece_jointe) Stockage.supprimerPiece(g.piece_jointe.id);
    jeter("garantie", g);
    db.garanties = db.garanties.filter(x => x.id !== g.id);
    return maj();
  }

  const lit = trouver(c, "item");
  if(lit && (act === "basculerItem" || act === "remonterItem" || act === "supprimerItem" || act === "choisirSectionListe" || act === "editerItem")){
    const ll = (db.listes||[]).find(x => x.id === lit.elt.dataset.liste);
    const it = ll && (ll.items||[]).find(y => y.id === lit.id);
    if(!ll || !it) return;
    if(act === "choisirSectionListe"){
      vue.sectionActive = vue.sectionActive === it.id ? null : it.id;
      return rendre();
    }
    if(act === "editerItem"){
      return formulaireRenommer(it.titre ? "Renommer le titre" : "Renommer", it.texte, v => { it.texte = v; touche(ll); });
    }
    if(act === "basculerItem"){ it.coche = !it.coche; touche(ll); return maj(); }
    if(act === "remonterItem"){
      const nouvelle = tacheNeuve({ intitule:it.texte, suivant_le:jourISO(), travail:destinationTravail() });
      db.taches.push(touche(nouvelle));
      sauver();
      return tamponner(lit.elt, "Ajouté à « À faire »", rendre);
    }
    if(act === "supprimerItem"){
      ll.items = ll.items.filter(y => y.id !== it.id);
      touche(ll);
      return maj();
    }
  }

  for(const genre of ["contexte","categorie","cdepense","moyen"]){
    const l = trouver(c, genre);
    if(l && act === "editer"){
      const tas = { contexte:"contextes", categorie:"categories", cdepense:"categories_depense", moyen:"moyens" }[genre];
      const item = db[tas].find(x => x.id === l.id);
      if(item) return editerListe(genre, item);
    }
  }

  const lc = trouver(c, "corbeille");
  if(lc && act === "detruire"){
    oublier(lc.id);
    db.corbeille = db.corbeille.filter(x => x.id !== lc.id);
    return maj();
  }
  if(lc && act === "restaurer"){
    const i = db.corbeille.findIndex(x => x.id === lc.id); if(i < 0) return;
    const x = db.corbeille[i];
    /* Une charge ne vit pas dans une collection à part : elle appartient
       aux lignes de son dossier. Sans ce cas particulier, la restaurer
       la faisait simplement disparaître. */
    if(x.genre === "charge"){
      const d = dossDe(x.obj.dossier_id);
      if(!d){ alert("Le dossier de cette charge n'existe plus."); return; }
      const { dossier_id, ...ligne } = x.obj;
      (d.lignes = d.lignes || []).push(ligne);
    }else{
      const cible = { "tâche":"taches", "dossier":"dossiers", "contexte":"contextes", "categorie":"categories",
                      "cdepense":"categories_depense", "dépense":"depenses", "revenu":"revenus",
                      "rendez-vous":"rendez_vous", "anniversaire":"anniversaires", "vacances":"vacances",
                      "rentrée":"rentrees", "habitude":"habitudes", "semaine type":"emplois",
                      "liste":"listes", "projet":"projets", "commande":"commandes", "moyen":"moyens", "garantie":"garanties" }[x.genre];
      if(cible) db[cible].push(x.obj);
    }
    retrouver(x.obj && x.obj.id);
    oublier(x.id);              /* l'entrée de corbeille, elle, disparaît */
    db.corbeille.splice(i,1);
    return maj();
  }
});

/* =====================================================================
   GOOGLE AGENDA — lecture seule, à la demande, rien en base
   Ni le jeton d'accès ni les événements ne sont écrits dans `db` : tout
   vit dans ces variables en mémoire, donc rien ne passe par l'export, la
   synchro ou l'Accueil, et tout disparaît à la fermeture de l'onglet.
   Les scripts Google ne sont chargés qu'au premier clic sur « G », jamais
   au démarrage, pour ne rien consommer tant que ce n'est pas utilisé.
   ===================================================================== */
let googleEtat = "off";     // off | chargement | connecte | erreur
let googleMessage = "";
let googleVisible = false;  // vrai bouton à cocher : masquer ne redemande rien à Google
let googleTokenClient = null;
let googleScriptsPret = null; // Promise, une seule fois
let googleCache = {};         // { "AAAA-MM": { "AAAA-MM-JJ": [{resume,heure}] } }

function chargerScriptsGoogle(){
  if(googleScriptsPret) return googleScriptsPret;
  const uneFois = (src) => new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.async = true; s.defer = true;
    s.onload = res; s.onerror = () => rej(new Error("Chargement du script Google impossible."));
    document.head.appendChild(s);
  });
  googleScriptsPret = Promise.all([
    uneFois("https://accounts.google.com/gsi/client"),
    uneFois("https://apis.google.com/js/api.js"),
  ]);
  return googleScriptsPret;
}

function initGapiClient(){
  return new Promise((res, rej) => {
    window.gapi.load("client", async () => {
      try{
        await window.gapi.client.init({
          apiKey: db.reglages.google_api_key,
          discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest"],
        });
        res();
      }catch(e){ rej(e); }
    });
  });
}

function evenementsGoogleDu(iso){
  const mois = iso.slice(0, 7);
  return (googleCache[mois] && googleCache[mois][iso]) || [];
}

async function recupererEvenementsGoogleMois(moisRef){
  const [an, mo] = moisRef.split("-").map(Number);
  const debut = new Date(an, mo - 1, 1);
  const fin = new Date(an, mo, 1);
  const reponse = await window.gapi.client.calendar.events.list({
    calendarId: "primary",
    timeMin: debut.toISOString(),
    timeMax: fin.toISOString(),
    singleEvents: true,
    orderBy: "startTime",
    maxResults: 250,
  });
  const parJour = {};
  (reponse.result.items || []).forEach(ev => {
    const dateHeure = ev.start && ev.start.dateTime;
    const iso = ((dateHeure || (ev.start && ev.start.date)) || "").slice(0, 10);
    if(!iso) return;
    (parJour[iso] = parJour[iso] || []).push({
      resume: ev.summary || "(sans titre)",
      heure: dateHeure ? dateHeure.slice(11, 16) : null,
    });
  });
  googleCache[moisRef] = parJour;
}

/* Authentification seule, partagée par les deux boutons « G » (celui de
   l'Agenda du mois, et celui de la vue semaine) — chacun fait ensuite sa
   propre requête, sur un ou plusieurs mois selon ce qu'il affiche. */
async function authentifierGoogle(){
  await chargerScriptsGoogle();
  await initGapiClient();
  if(!googleTokenClient || googleTokenClient.__clientId !== db.reglages.google_client_id){
    googleTokenClient = window.google.accounts.oauth2.initTokenClient({
      client_id: db.reglages.google_client_id,
      scope: "https://www.googleapis.com/auth/calendar.events.readonly",
      callback: "", // fixé juste avant chaque requête, ci-dessous
    });
    googleTokenClient.__clientId = db.reglages.google_client_id;
  }
  await new Promise((res, rej) => {
    googleTokenClient.callback = (resp) => resp && resp.error ? rej(resp) : res();
    googleTokenClient.requestAccessToken({ prompt: window.gapi.client.getToken() ? "" : "consent" });
  });
}

async function actualiserGoogle(){
  /* Masquer ne redemande jamais rien à Google : c'est juste un repli visuel,
     gratuit en données, comme décocher une case. */
  if(googleVisible){
    googleVisible = false;
    return maj();
  }
  if(!db.reglages.google_client_id || !db.reglages.google_api_key){
    googleEtat = "erreur";
    googleMessage = "Renseignez le Client ID et la clé API dans Réglages d'abord.";
    return maj();
  }
  googleEtat = "chargement"; googleMessage = "";
  maj();
  try{
    await authentifierGoogle();
    await recupererEvenementsGoogleMois(vue.moisAgenda || jourISO().slice(0, 7));
    googleEtat = "connecte";
    googleVisible = true;
  }catch(e){
    googleEtat = "erreur";
    googleMessage = (e && (e.error_description || e.message || e.error)) || "Connexion refusée ou interrompue.";
    googleVisible = false;
  }
  maj();
}

/* Même bouton à bascule, pour la vue « Cette semaine » — elle peut couvrir
   deux mois à la fois (cette semaine + la suivante, parfois à cheval sur un
   changement de mois), donc une requête par mois concerné plutôt qu'une
   seule comme dans l'Agenda du mois. */
async function actualiserGoogleSemaine(){
  if(googleVisible){
    googleVisible = false;
    return maj();
  }
  if(!db.reglages.google_client_id || !db.reglages.google_api_key){
    googleEtat = "erreur";
    googleMessage = "Renseignez le Client ID et la clé API dans Réglages d'abord.";
    return maj();
  }
  googleEtat = "chargement"; googleMessage = "";
  maj();
  try{
    await authentifierGoogle();
    const sem = semaineDe(jourISO());
    const semSuiv = semaineDe(jourISO(new Date(versDate(sem[6]).getTime() + 86400000)));
    const mois = [...new Set([...sem, ...semSuiv].map(iso => iso.slice(0,7)))];
    for(const m of mois) await recupererEvenementsGoogleMois(m);
    googleEtat = "connecte";
    googleVisible = true;
  }catch(e){
    googleEtat = "erreur";
    googleMessage = (e && (e.error_description || e.message || e.error)) || "Connexion refusée ou interrompue.";
    googleVisible = false;
  }
  maj();
}

/* =====================================================================
   GLISSER-DÉPOSER
   Les événements « pointer » couvrent la souris et le doigt d'un seul geste.
   On déplace le nœud dans le document pendant le glissement, puis on lit
   l'ordre obtenu à la fin : aucune position n'est calculée à l'aveugle.
   ===================================================================== */
let glissement = null;

function ligneSous(y, conteneur, sauf){
  const lignes = [...conteneur.querySelectorAll("[data-tache]")].filter(x => x !== sauf);
  for(const l of lignes){
    const r = l.getBoundingClientRect();
    if(y < r.top + r.height / 2) return l;
  }
  return null;
}

document.addEventListener("pointerdown", ev => {
  const prise = ev.target.closest && ev.target.closest("[data-glisser]");
  if(!prise) return;
  const ligne = prise.closest("[data-tache]");
  const conteneur = ligne && ligne.closest(".rangeable");
  if(!ligne || !conteneur) return;
  ev.preventDefault();
  glissement = { ligne, conteneur };
  ligne.classList.add("glisse");
  try{ prise.setPointerCapture(ev.pointerId); }catch(e){}
});

document.addEventListener("pointermove", ev => {
  if(!glissement) return;
  ev.preventDefault();
  const { ligne, conteneur } = glissement;
  const cible = ligneSous(ev.clientY, conteneur, ligne);
  if(cible) conteneur.insertBefore(ligne, cible);
  else conteneur.appendChild(ligne);
});

function finGlissement(){
  if(!glissement) return;
  const { ligne, conteneur } = glissement;
  glissement = null;
  ligne.classList.remove("glisse");
  /* On relit l'ordre affiché et on l'inscrit dans les données. */
  const ids = [...conteneur.querySelectorAll("[data-tache]")].map(x => x.getAttribute("data-tache"));
  let change = false;
  ids.forEach((id, i) => {
    const t = db.taches.find(x => x.id === id);
    if(t && t.ordre !== i){ t.ordre = i; touche(t); change = true; }
  });
  if(change) maj();
}
document.addEventListener("pointerup", finGlissement);
document.addEventListener("pointercancel", finGlissement);

/* Même mécanique pour réordonner les éléments d'une liste pense-bête.
   Contrairement aux tâches, les items n'ont pas de champ « ordre » séparé :
   l'ordre affiché EST l'ordre stocké, donc on réécrit simplement le tableau
   d'après la position finale dans le DOM. Les titres de section restent
   fixes (pas de poignée) mais un item peut être glissé au-delà d'un titre :
   c'est ainsi qu'on le fait changer de section. */
let glissementItem = null;

function ligneSousItem(y, conteneur, sauf){
  const lignes = [...conteneur.querySelectorAll("[data-item]")].filter(x => x !== sauf);
  for(const l of lignes){
    const r = l.getBoundingClientRect();
    if(y < r.top + r.height / 2) return l;
  }
  return null;
}

  const prise = ev.target.closest && ev.target.closest("[data-glisseritem]");
  if(!prise) return;
  const ligne = prise.closest("[data-item]");
  const conteneur = ligne && ligne.closest(".rangeable-items");
  if(!ligne || !conteneur) return;
  ev.preventDefault();

});

document.addEventListener("pointermove", ev => {

  const cible = ligneSousItem(ev.clientY, conteneur, ligne);

});

function finGlissementItem(){
  if(!glissementItem) return;

  ligne.classList.remove("glisse");
  const l = (db.listes||[]).find(x => x.id === ligne.dataset.liste);

  const ids = [...conteneur.querySelectorAll("[data-item]")].map(x => x.getAttribute("data-item"));
  const parId = new Map((l.items||[]).map(it => [it.id, it]));
  const reordonnes = ids.map(id => parId.get(id)).filter(Boolean);
  /* Filet de sécurité : si le compte ne correspond pas (DOM désynchronisé
     par un rendu entre-temps), on ignore plutôt que de tronquer la liste. */
  if(reordonnes.length !== (l.items||[]).length) return;
  l.items = reordonnes;
  touche(l);
  maj();
}
document.addEventListener("pointerup", finGlissementItem);

function finGlissementTacheProjet(){

  const parId = new Map((p.taches||[]).map(x => [x.id, x]));
  const reordonnees = ids.map(id => parId.get(id)).filter(Boolean);
  if(reordonnees.length !== (p.taches||[]).length) return;
  p.taches = reordonnees;
  touche(p);
  maj();
}
document.addEventListener("pointerup", finGlissementTacheProjet);
document.addEventListener("pointercancel", finGlissementTacheProjet);

/* Même mécanique, cette fois pour réordonner les listes elles-mêmes sur la
   page « Listes » (ex. faire passer « Voyage » avant « Livres et films »). */
let glissementListe = null;

function ligneSousListe(y, conteneur, sauf){
  const lignes = [...conteneur.querySelectorAll("[data-liste]")].filter(x => x !== sauf);
  for(const l of lignes){
    const r = l.getBoundingClientRect();
    if(y < r.top + r.height / 2) return l;
  }
  return null;
}

document.addEventListener("pointerdown", ev => {
  const prise = ev.target.closest && ev.target.closest("[data-glisserliste]");
  if(!prise) return;
  const ligne = prise.closest("[data-liste]");
  const conteneur = ligne && ligne.closest(".rangeable-listes");
  if(!ligne || !conteneur) return;
  ev.preventDefault();
  glissementListe = { ligne, conteneur };
  ligne.classList.add("glisse");
  try{ prise.setPointerCapture(ev.pointerId); }catch(e){}
});

document.addEventListener("pointermove", ev => {
  if(!glissementListe) return;
  ev.preventDefault();
  const { ligne, conteneur } = glissementListe;
  const cible = ligneSousListe(ev.clientY, conteneur, ligne);
  if(cible) conteneur.insertBefore(ligne, cible);
  else conteneur.appendChild(ligne);
});

function finGlissementListe(){
  if(!glissementListe) return;
  const { ligne, conteneur } = glissementListe;
  glissementListe = null;
  ligne.classList.remove("glisse");
  /* Comme pour les tâches : un champ « ordre » écrit sur chaque liste, pas
     un simple réarrangement du tableau — sans quoi l'ordre se perdrait à la
     prochaine synchronisation entre appareils (seuls les champs touchés
     avec leur horodatage survivent à la fusion). */
  const ids = [...conteneur.querySelectorAll("[data-liste]")].map(x => x.getAttribute("data-liste"));
  const parId = new Map((db.listes||[]).map(l => [l.id, l]));
  let change = false;
  ids.forEach((id, i) => {
    const l = parId.get(id);
    if(l && l.ordre !== i){ l.ordre = i; touche(l); change = true; }
  });
  if(change) maj();
}
document.addEventListener("pointerup", finGlissementListe);
document.addEventListener("pointercancel", finGlissementListe);

function decalerMois(v){
  if(v === 0){ vue.moisAgenda = jourISO().slice(0,7); return; }
  const [a,m] = (vue.moisAgenda || jourISO().slice(0,7)).split("-").map(Number);
  const d = new Date(a, m - 1 + v, 1);
  vue.moisAgenda = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
}

/* Balayage horizontal pour changer de mois dans l'agenda. On exige un geste
   franc et surtout plus horizontal que vertical, faute de quoi un simple
   défilement de la page ferait sauter d'un mois. */
let toucheDebut = null;
document.addEventListener("touchstart", ev => {
  if(vue.onglet !== "agenda" || ev.touches.length !== 1 || dlg.open){ toucheDebut = null; return; }
  const t = ev.touches[0];
  toucheDebut = { x:t.clientX, y:t.clientY, quand:Date.now() };
}, { passive:true });

document.addEventListener("touchend", ev => {
  if(!toucheDebut || vue.onglet !== "agenda") return;
  const t = ev.changedTouches[0];
  const dx = t.clientX - toucheDebut.x, dy = t.clientY - toucheDebut.y;
  const rapide = Date.now() - toucheDebut.quand < 700;
  toucheDebut = null;
  if(rapide && Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8){
    decalerMois(dx < 0 ? 1 : -1);
    rendre();
  }
}, { passive:true });

function verifierJour(){
  const avant = db.reglages.dernier_bascule;
  bascule();
  if(avant !== db.reglages.dernier_bascule) maj();
}
document.addEventListener("visibilitychange", () => { if(!document.hidden){ verifierJour(); Sync.auRetour(); } });
window.addEventListener("online", () => { Sync.auRetour(); recupererAstro(true).then(rendre); });
setInterval(verifierJour, 60000);

/* Garde toujours une copie de secours de l'appli pour le hors-ligne, et
   prévient discrètement (bandeau en bas, jamais bloquant) si une version
   plus récente a été détectée en tâche de fond — voir sw.js. */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", ev => {
    if(ev.data && ev.data.type === "nouvelle_version") afficherBandeauMaj();
  });
}
function afficherBandeauMaj(){
  const b = document.getElementById("bandeauMaj");
  if(!b || b.dataset.affiche) return;
  b.dataset.affiche = "1";
  b.style.display = "flex";
  b.innerHTML = `<span>Une nouvelle version du carnet est prête.</span>
    <button type="button" id="bandeauMajBtn">Mettre à jour</button>`;
  document.getElementById("bandeauMajBtn").onclick = () => location.reload();
}

/* =====================================================================
   10. DÉMARRAGE
   ===================================================================== */
(async function demarrer(){
  await Stockage.init();
  const sauve = await Stockage.lire();
  const m = migrer(sauve);
  const vierge = !(m && Array.isArray(m.taches));
  db = vierge ? etatNeuf() : Object.assign(etatNeuf(), m);
  /* Un appareil qui découvre l'appli affiche des exemples pour ne pas être
     vide. Tant qu'on n'y a rien saisi, ce carnet n'a aucune valeur : à la
     première synchro il s'efface devant la version distante au lieu de
     déverser ses exemples dans le carnet partagé. */
  db.vierge = vierge;
  db.version_schema = VERSION_SCHEMA;
  db.corbeille = db.corbeille || [];
  db.dossiers = db.dossiers || [];
  db.revenus = db.revenus || [];
  db.depenses = db.depenses || [];
  db.rendez_vous = db.rendez_vous || [];
  db.rentrees = db.rentrees || [];
  db.restaures = db.restaures || [];
  db.habitudes = db.habitudes || [];
  db.habitudes_faites = db.habitudes_faites || [];
  db.emplois = db.emplois || [];
  db.listes = db.listes || [];
  db.listes.forEach(l => { l.items = l.items || []; });
  db.sommeil = db.sommeil || [];
  db.projets = db.projets || [];
  db.projets.forEach(p => { p.lignes = p.lignes || []; p.taches = p.taches || [];
    if(typeof p.notes === "string"){ if(p.notes.trim()) (p.mur = p.mur || []).push({ id:uid(), titre:"", texte:p.notes }); delete p.notes; }
    p.mur = p.mur || []; });
  db.commandes = db.commandes || [];
  db.moyens = (db.moyens && db.moyens.length) ? db.moyens : MOYENS_SEED.map(m => ({ ...m }));
  db.garanties = db.garanties || [];
  db.bilans_mensuels = db.bilans_mensuels || {};
  db.coherence = db.coherence || [];
  if(typeof db.bloc_notes !== "string") db.bloc_notes = "";
  db.dossiers.forEach(d => { d.lignes = d.lignes || [];
    if(typeof d.notes === "string"){ if(d.notes.trim()) (d.mur = d.mur || []).push({ id:uid(), titre:"", texte:d.notes }); delete d.notes; }
    d.mur = d.mur || []; });
  db.vacances = (db.vacances && db.vacances.length) ? db.vacances : vacancesNeuves();
  db.anniversaires = (db.anniversaires && db.anniversaires.length) ? db.anniversaires : anniversairesNeufs();
  db.categories_depense = db.categories_depense?.length ? db.categories_depense : etatNeuf().categories_depense;
  db.taches = db.taches.map(t => tacheNeuve(t));
  if(!db.modifie_le) db.modifie_le = new Date().toISOString();
  appliquerTeinte(); appliquerTaille(); appliquerSombre();
  bascule(); purgerCorbeille();
  if(db.reglages.archive_avant) appliquerCoupure(db, db.reglages.archive_avant);
  if(dedoublonner()) sauver();   /* une réparation compte comme une modification */
  else sauver(false);
  rendre();
  initAstro();
  await Sync.charger();
  rendre();
  Sync.synchroniser(false);
  Sync.lancerVeille();
})();
